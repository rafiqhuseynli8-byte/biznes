/* ============================================================
   TREYLER — an ordinary day cut as a blockbuster.

   The joke is the treatment, not the events: a mall, a cinema, an ice
   cream and a bus, given drums, risers and title cards. Everything is
   timed against one clock so the hits land on the cuts.
   ============================================================ */

:root{
  --void:#08060A;
  --pink:#FF5FA2;
  --pink-2:#FFA8CB;
  --cream:#FFF2F7;
  --ease:cubic-bezier(.2,.7,.25,1);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--void)}
body{
  font-family:"Outfit",system-ui,-apple-system,sans-serif;
  color:var(--cream);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

.stage{ position:fixed; inset:0; overflow:hidden }

/* the black bars a projector leaves at the top and bottom */
.bars{ position:fixed; inset:0; z-index:41; pointer-events:none }
.bars i{
  position:absolute; left:0; right:0; height:0; background:#000;
  transition:height 1.1s cubic-bezier(.2,.8,.2,1);
}
.bars i:first-child{ top:0 }
.bars i:last-child{ bottom:0 }
body.wide .bars i{ height:7.5vh }

/* the countdown leader every film used to start with */
.leader{ position:relative; width:min(62vw,300px); aspect-ratio:1; display:grid; place-items:center }
.leader svg{ position:absolute; inset:0; width:100%; height:100%;
  animation:spin 1s linear infinite }
@keyframes spin{ to{ transform:rotate(360deg) } }
.leader .ring{ fill:none; stroke:rgba(255,242,247,.45); stroke-width:2 }
.leader .ring.thin{ stroke:rgba(255,242,247,.2); stroke-width:1;
  stroke-dasharray:6 10 }
.leader .cross{ stroke:rgba(255,242,247,.25); stroke-width:1.4 }
.leader span{
  font-family:"Anton",Impact,sans-serif; font-size:min(30vw,150px);
  line-height:1; color:var(--cream); position:relative;
}
.leader span.pop{ animation:numpop .3s var(--ease) both }
@keyframes numpop{ 0%{opacity:0;transform:scale(1.6)} 100%{opacity:1;transform:scale(1)} }


/* film grain and the soft box of a projected image */
.grain{
  position:fixed; inset:-20%; z-index:40; pointer-events:none; opacity:.10;
  background-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'>\
<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/>\
<feColorMatrix type='saturate' values='0'/></filter>\
<rect width='160' height='160' filter='url(%23n)' opacity='.5'/></svg>");
  animation:grain .4s steps(2) infinite;
}
@keyframes grain{
  0%{transform:translate(0,0)} 25%{transform:translate(-3%,2%)}
  50%{transform:translate(2%,-2%)} 75%{transform:translate(-2%,-3%)}
  100%{transform:translate(0,0)}
}
.vig{
  position:fixed; inset:0; z-index:39; pointer-events:none;
  background:radial-gradient(70% 55% at 50% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,.75) 100%);
}
.flash{
  position:fixed; inset:0; z-index:45; pointer-events:none; background:#fff; opacity:0;
}

/* ---------- cards ---------- */

.card{
  position:absolute; inset:0; z-index:10;
  display:none; align-items:center; justify-content:center;
  padding:0 24px; text-align:center;
}
.card.on{ display:flex }

/* the light that travels across the title once it lands */
.gleam{ position:relative; overflow:hidden; display:inline-block }
.gleam::after{
  content:""; position:absolute; top:-30%; bottom:-30%; width:55%; left:-70%;
  background:linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.75), rgba(255,255,255,0));
  animation:gleam 1.5s .35s var(--ease) both; pointer-events:none;
}
@keyframes gleam{ from{ left:-70% } to{ left:130% } }

.big{
  font-family:"Anton",Impact,sans-serif; font-weight:400;
  font-size:clamp(38px,13.5vw,86px); line-height:1.3; letter-spacing:.01em;
  text-transform:uppercase; margin:0;
}
.mid{
  font-family:"Anton",Impact,sans-serif;
  font-size:clamp(26px,9vw,54px); line-height:1.02; text-transform:uppercase; margin:0;
}
.small{
  font-size:clamp(13px,4vw,18px); line-height:1.5; font-weight:300;
  letter-spacing:.02em; margin:0; color:rgba(255,242,247,.8);
}
.tag{
  font-family:"Outfit",sans-serif; font-weight:700;
  font-size:clamp(10px,3vw,12px); letter-spacing:.34em; text-transform:uppercase;
  color:var(--pink); margin:0 0 14px;
}
.pink{ color:var(--pink) }

/* the punch each card arrives with */
.hit{ animation:hit .5s var(--ease) both }
@keyframes hit{
  0%{ opacity:0; transform:scale(1.32); filter:blur(14px) }
  55%{ opacity:1; filter:blur(0) }
  100%{ opacity:1; transform:scale(1); filter:blur(0) }
}
.slam{ animation:slam .45s cubic-bezier(.15,.9,.2,1) both }
@keyframes slam{
  0%{ opacity:0; transform:scale(.4) }
  70%{ opacity:1; transform:scale(1.06) }
  100%{ opacity:1; transform:scale(1) }
}
.creep{ animation:creep 3.4s linear both }
@keyframes creep{ from{ transform:scale(1) } to{ transform:scale(1.14) } }

.shake{ animation:shake .5s linear }
@keyframes shake{
  0%,100%{ transform:translate(0,0) }
  20%{ transform:translate(-7px,4px) }
  40%{ transform:translate(6px,-5px) }
  60%{ transform:translate(-4px,-3px) }
  80%{ transform:translate(5px,3px) }
}

/* ---------- the studio logo ---------- */
.logo{ display:flex; flex-direction:column; align-items:center; gap:22px }
.logo img{
  width:clamp(150px,44vw,220px); height:auto; border-radius:24px;
  box-shadow:0 0 90px -10px rgba(255,95,162,.7);
}
.logo img.pop{ animation:pop 1.1s cubic-bezier(.2,1.4,.3,1) both }
@keyframes pop{
  0%{ opacity:0; transform:scale(.2) rotate(-25deg) }
  55%{ opacity:1; transform:scale(1.16) rotate(6deg) }
  75%{ transform:scale(.94) rotate(-3deg) }
  100%{ opacity:1; transform:scale(1) rotate(0) }
}
.logo .name{
  font-family:"Anton",Impact,sans-serif;
  font-size:clamp(19px,6.4vw,34px); letter-spacing:.16em; text-transform:uppercase;
}

/* ---------- the rating card ---------- */
.rating{
  width:min(460px,86vw); border:3px solid #CFE9D2; background:#0C1A0E;
  padding:26px 20px; border-radius:4px;
}
.rating .band{
  font-family:"Anton",Impact,sans-serif; font-size:clamp(28px,10vw,54px);
  color:#CFE9D2; letter-spacing:.04em; margin:0 0 10px;
}
.rating p{ margin:0; font-size:clamp(11px,3.3vw,13.5px); letter-spacing:.16em;
  text-transform:uppercase; color:#9FBFA4; line-height:1.7 }

/* ---------- her ---------- */
.star{ position:relative; display:flex; flex-direction:column; align-items:center; gap:20px }
.star .frame{
  position:relative; width:clamp(200px,62vw,300px); aspect-ratio:1; border-radius:50%;
  overflow:hidden; box-shadow:0 0 0 3px rgba(255,95,162,.55), 0 0 90px -14px rgba(255,95,162,.8);
}
.star .frame img{ width:100%; height:100%; object-fit:cover; display:block;
  filter:brightness(1.16) contrast(1.06) saturate(1.05) }
.star .frame i{
  position:absolute; top:0; bottom:0; width:46%;
  background:linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.55), rgba(255,255,255,0));
  left:-60%;
}
.star.on .frame i{ animation:sweep 1.1s .25s var(--ease) both }
@keyframes sweep{ from{ left:-60% } to{ left:120% } }
.star .credit{ font-family:"Anton",Impact,sans-serif; font-size:clamp(22px,7.4vw,40px); text-transform:uppercase }
.star .role{ font-size:clamp(12px,3.6vw,15px); letter-spacing:.24em; text-transform:uppercase; color:var(--pink) }

/* ---------- the reviews ---------- */
.rev{ max-width:min(520px,90vw) }
.rev .stars{
  font-size:clamp(22px,7vw,34px); letter-spacing:.14em; color:var(--pink);
  margin-bottom:18px; text-shadow:0 0 26px rgba(255,95,162,.6);
}
.rev .quote{
  font-family:"Anton",Impact,sans-serif; text-transform:uppercase;
  font-size:clamp(24px,7.6vw,46px); line-height:1.22; margin:0 0 18px;
  white-space:pre-line;
}
.rev .src{
  font-family:"Outfit",sans-serif; font-weight:500; font-style:italic;
  font-size:clamp(12px,3.6vw,15px); letter-spacing:.06em;
  color:rgba(255,242,247,.55); margin:0;
}

/* ---------- montage ---------- */
.mont{ font-family:"Anton",Impact,sans-serif; font-size:clamp(34px,12vw,74px); text-transform:uppercase }

/* ---------- start and end ---------- */
.gate{ position:absolute; inset:0; z-index:30; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:26px; padding:0 26px; text-align:center }
.gate.off{ display:none }
.play{
  -webkit-appearance:none; appearance:none; cursor:pointer; border:0;
  width:clamp(112px,32vw,140px); height:clamp(112px,32vw,140px); border-radius:50%;
  background:radial-gradient(60% 60% at 50% 40%, #FF8BBB, var(--pink) 60%, #C22E6E);
  box-shadow:0 0 70px -12px rgba(255,95,162,.9);
  display:grid; place-items:center;
  animation:beat 2.4s var(--ease) 5;
}
@keyframes beat{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
.play svg{ margin-left:6px }

.endc{ position:absolute; inset:0; z-index:32; display:none; flex-direction:column;
  align-items:center; justify-content:center; gap:20px; padding:0 26px; text-align:center }
.endc.on{ display:flex; animation:hit .7s var(--ease) both }
.ticket{
  -webkit-appearance:none; appearance:none; cursor:pointer; text-decoration:none;
  display:inline-flex; align-items:center; gap:10px;
  padding:15px 30px; border-radius:99px; border:0;
  font-family:"Outfit",sans-serif; font-size:15px; font-weight:600; letter-spacing:.02em;
  color:#2A0716; background:linear-gradient(160deg,#FFC2DD,var(--pink));
  box-shadow:0 0 54px -14px rgba(255,95,162,.95);
}
.again2{
  -webkit-appearance:none; appearance:none; cursor:pointer;
  background:transparent; border:1px solid rgba(255,242,247,.25); color:rgba(255,242,247,.6);
  border-radius:99px; padding:10px 20px; font-family:inherit; font-size:12.5px;
}
.skip{
  position:fixed; z-index:44; right:12px; top:calc(12px + env(safe-area-inset-top,0px));
  -webkit-appearance:none; appearance:none; cursor:pointer;
  background:rgba(255,242,247,.07); border:1px solid rgba(255,242,247,.18);
  color:rgba(255,242,247,.7); border-radius:99px; padding:8px 15px;
  font-family:inherit; font-size:12px; opacity:0; pointer-events:none;
  transition:opacity .4s var(--ease);
}
.skip.on{ opacity:1; pointer-events:auto }

:focus-visible{ outline:2px solid var(--pink); outline-offset:4px; border-radius:10px }

@media (prefers-reduced-motion:reduce){
  .grain{ animation:none } .play{ animation:none }
  .hit,.slam,.creep,.shake,.logo img.pop{ animation-duration:.001s }
}
</style>
</head>
<body>

<div class="bars" id="bars" aria-hidden="true"><i></i><i></i></div>

<div class="stage" id="stage">

  <div class="card" id="c-count">
    <div class="leader" id="leader">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="96" class="ring"/>
        <circle cx="100" cy="100" r="70" class="ring thin"/>
        <path d="M100 4 V196 M4 100 H196" class="cross"/>
      </svg>
      <span id="countNum">3</span>
    </div>
  </div>


  <!-- ============ the cards ============ -->
  <div class="card" id="c-phone"><p class="mid" id="phoneTxt">Telefonunuzu söndürün.</p></div>

  <div class="card" id="c-logo">
    <div class="logo">
      <img id="emoji" alt="">
      <div class="name">Bir <span class="pink">Film</span></div>
    </div>
  </div>

  <div class="card" id="c-rating">
    <div class="rating">
      <p class="band">YALNIZ 1</p>
      <p>Bu film yalnız bir nəfər üçündür<br><b id="ratingName">—</b></p>
    </div>
  </div>

  <div class="card" id="c-line"><p class="big" id="lineTxt">—</p></div>

  <div class="card" id="c-mont"><p class="mont" id="montTxt">—</p></div>

  <div class="card" id="c-rev">
    <div class="rev">
      <div class="stars" id="revStars">★★★★★</div>
      <p class="quote" id="revQuote">—</p>
      <p class="src" id="revSrc">—</p>
    </div>
  </div>

  <div class="card" id="c-star">
    <div class="star" id="starBox">
      <div class="frame"><img id="face" alt=""><i></i></div>
      <div class="credit" id="starName">—</div>
      <div class="role" id="starRole">—</div>
    </div>
  </div>

  <div class="card" id="c-title">
    <div>
      <p class="tag" id="titleTag">Bu yay</p>
      <p class="big" id="titleTxt">—</p>
    </div>
  </div>

  <!-- ============ start ============ -->
  <div class="gate" id="gate">
    <p class="tag">Seans başlayır</p>
    <p class="big" id="gateTitle">—</p>
    <p class="small" id="gateSub">Səsi aç. Bir dəqiqə çəkir.</p>
    <button class="play" id="play" type="button" aria-label="Başlat">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="#2A0716"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </div>

  <!-- ============ end ============ -->
  <div class="endc" id="endc">
    <p class="tag">Növbəti seans</p>
    <p class="mid" id="endTxt">—</p>
    <p class="small" id="endSub">—</p>
    <a class="ticket" id="ticket" target="_blank" rel="noopener">Bilet al</a>
    <button class="again2" id="again2" type="button">Yenidən bax</button>
  </div>
</div>

<div class="vig" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="flash" id="flash" aria-hidden="true"></div>
<button class="skip" id="skip" type="button">Keç</button>

<script>
(function(){
  "use strict";

  /* ============================================================
     Everything personal comes from the address.
     ============================================================ */

  /* Parametr həm ?-dən, həm #-dən oxunur. Bəzi yerlər ünvandan ?-i
     kəsir, # isə heç vaxt kəsilmir — ona görə ikisi də işləyir. */
  var Q = (function(){
    var q = new URLSearchParams(location.search);
    var h = new URLSearchParams(location.hash.replace(/^#/, ""));
    h.forEach(function(v, k){ if (!q.has(k)) q.set(k, v); });
    return q;
  })();
  function param(k, d, max){
    var v = Q.get(k);
    if (v === null) return d;
    v = v.trim();
    return v ? v.slice(0, max || 80) : d;
  }

  var AD     = param("ad", "Kamran", 24);
  var MEN    = param("men", "", 24);          /* what she calls him */
  var TARIX  = param("tarix", "", 24);        /* the date of the day */
  var YERLER = param("yerler", "", 300);      /* the montage, separated by | */
  var STUDIO = param("studiya", "", 30);
  var SON    = param("son", "", 120);         /* the closing line */
  var TEL    = param("tel", "", 20);
  var PHOTO  = "";
  var LOGO   = "";

  var PLACES = YERLER
    ? YERLER.split("|").map(function(x){ return x.trim(); }).filter(Boolean)
    : ["Bir yer", "Bir gün", "Bir söhbət"];

  function upper(s){
    var o = "";
    for (var i = 0; i < s.length; i++){
      var c = s[i];
      o += (c === "i") ? "İ" : (c === "ı") ? "I" : c.toUpperCase();
    }
    return o;
  }

  var reduce = window.matchMedia &&
               window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function $(id){ return document.getElementById(id); }

  document.title = (TARIX || AD) + " — treyler";
  $("gateTitle").textContent = TARIX ? upper(TARIX) : upper(AD);
  $("ratingName").textContent = upper(AD);
  if (STUDIO){
    var parts = STUDIO.split(" ");
    var last = parts.pop();
    document.querySelector(".logo .name").innerHTML = "";
    document.querySelector(".logo .name").appendChild(
      document.createTextNode(parts.join(" ") + " "));
    var sp = document.createElement("span");
    sp.className = "pink"; sp.textContent = last;
    document.querySelector(".logo .name").appendChild(sp);
  }
  if (PHOTO) $("face").src = PHOTO;
  if (LOGO)  $("emoji").src = LOGO;

  /* ============================================================
     Sound. Trailers are made of booms, risers and whooshes, and
     those are the three things oscillators are actually good at.
     ============================================================ */

  var ac = null, master = null, noise = null, muted = false;

  function initAudio(){
    if (ac) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (e){ return; }
    if (ac.state === "suspended" && ac.resume) ac.resume();
    master = ac.createGain();
    master.gain.value = .85;
    var comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 6;
    master.connect(comp); comp.connect(ac.destination);
    noise = ac.createBuffer(1, Math.floor(ac.sampleRate * 3), ac.sampleRate);
    var d = noise.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }

  function boom(vol, drop){
    if (!ac) return;
    var t = ac.currentTime;
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(drop || 110, t);
    o.frequency.exponentialRampToValueAtTime(28, t + .8);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + 1.15);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 1.2);

    var s = ac.createBufferSource(); s.buffer = noise;
    var f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 420;
    var g2 = ac.createGain();
    g2.gain.setValueAtTime(.0001, t);
    g2.gain.exponentialRampToValueAtTime(vol * .7, t + .008);
    g2.gain.exponentialRampToValueAtTime(.0001, t + .32);
    s.connect(f); f.connect(g2); g2.connect(master);
    s.start(t); s.stop(t + .35);
  }

  function riser(dur, vol){
    if (!ac) return;
    var t = ac.currentTime;
    var s = ac.createBufferSource(); s.buffer = noise; s.loop = true;
    var f = ac.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 2.2;
    f.frequency.setValueAtTime(220, t);
    f.frequency.exponentialRampToValueAtTime(5200, t + dur);
    var g = ac.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + dur * .85);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur + .12);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); s.stop(t + dur + .2);

    var o = ac.createOscillator(), og = ac.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(70, t);
    o.frequency.exponentialRampToValueAtTime(300, t + dur);
    og.gain.setValueAtTime(.0001, t);
    og.gain.exponentialRampToValueAtTime(vol * .5, t + dur * .9);
    og.gain.exponentialRampToValueAtTime(.0001, t + dur + .1);
    var lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900;
    o.connect(lp); lp.connect(og); og.connect(master);
    o.start(t); o.stop(t + dur + .2);
  }

  function whoosh(dur, vol){
    if (!ac) return;
    var t = ac.currentTime;
    var s = ac.createBufferSource(); s.buffer = noise;
    var f = ac.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.1;
    f.frequency.setValueAtTime(3000, t);
    f.frequency.exponentialRampToValueAtTime(280, t + dur);
    var g = ac.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + dur * .3);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); s.stop(t + dur + .05);
  }

  function tick(vol){
    if (!ac) return;
    var t = ac.currentTime;
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = "square"; o.frequency.value = 1400;
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || .05, t + .004);
    g.gain.exponentialRampToValueAtTime(.0001, t + .05);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + .06);
  }

  /* The horn. A trailer is not epic without one: a stack of detuned
     sawtooths an octave apart, a sub under them, and a filter that opens
     as it lands. */
  function braam(vol, dur){
    if (!ac) return;
    var t = ac.currentTime;
    dur = dur || 2.4;
    var f = ac.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.setValueAtTime(180, t);
    f.frequency.exponentialRampToValueAtTime(1500, t + .35);
    f.frequency.exponentialRampToValueAtTime(300, t + dur);
    f.Q.value = 1.4;
    var g = ac.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .09);
    g.gain.setValueAtTime(vol, t + dur * .55);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    f.connect(g); g.connect(master);

    [55, 55.4, 82.5, 110, 110.6, 164.8].forEach(function(fr, i){
      var o = ac.createOscillator();
      o.type = i % 2 ? "sawtooth" : "square";
      o.frequency.value = fr;
      o.detune.value = (i - 2.5) * 9;
      var og = ac.createGain();
      og.gain.value = i > 3 ? .28 : .6;
      o.connect(og); og.connect(f);
      o.start(t); o.stop(t + dur + .1);
    });

    var sub = ac.createOscillator(), sg = ac.createGain();
    sub.type = "sine"; sub.frequency.value = 36;
    sg.gain.setValueAtTime(.0001, t);
    sg.gain.exponentialRampToValueAtTime(vol * .9, t + .05);
    sg.gain.exponentialRampToValueAtTime(.0001, t + dur * .8);
    sub.connect(sg); sg.connect(master);
    sub.start(t); sub.stop(t + dur);
  }

  function chord(vol){
    if (!ac) return;
    var t = ac.currentTime;
    [130.81, 196, 261.63, 392].forEach(function(f, i){
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = i > 1 ? "sine" : "triangle";
      o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + .05);
      g.gain.exponentialRampToValueAtTime(.0001, t + 2.6);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + 2.7);
    });
  }

  /* ============================================================
     The cut. One clock, so every hit lands on a frame change.
     ============================================================ */

  /* Anton is condensed but PLANLAŞDIRILMIŞDI is seventeen letters, and a
     trailer card that runs off both edges is just a mistake. Every big
     line is measured and fitted before it is shown. */
  var probe = document.createElement("canvas").getContext("2d");
  function fitFont(lines, maxPx){
    var avail = window.innerWidth * .90;
    var size = maxPx;
    for (var i = 0; i < 30; i++){
      probe.font = "400 " + size.toFixed(1) + "px Anton, Impact, sans-serif";
      var w = 0;
      for (var j = 0; j < lines.length; j++){
        w = Math.max(w, probe.measureText(lines[j]).width);
      }
      if (w <= avail || size <= 14) break;
      size = Math.max(14, size * (avail / w) * .985);
    }
    return size;
  }

  var CARDS = ["c-count","c-phone","c-logo","c-rating","c-rev","c-line","c-mont","c-star","c-title"];
  function show(id){
    for (var i = 0; i < CARDS.length; i++){
      var el = $(CARDS[i]);
      el.classList.toggle("on", CARDS[i] === id);
    }
  }
  function anim(el, cls){
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }
  function shakeStage(){
    if (reduce) return;
    anim($("stage"), "shake");
  }
  function flash(){
    if (reduce) return;
    var f = $("flash");
    f.style.transition = "none"; f.style.opacity = ".85";
    setTimeout(function(){ f.style.transition = "opacity .32s linear"; f.style.opacity = "0"; }, 20);
  }

  var timers = [];
  function at(ms, fn){ timers.push(setTimeout(fn, ms)); }
  function clearAll(){ timers.forEach(clearTimeout); timers.length = 0; }

  function lineCard(text, opts){
    show("c-line");
    var el = $("lineTxt");
    el.innerHTML = "";
    String(text).split("\n").forEach(function(t, i){
      if (i) el.appendChild(document.createElement("br"));
      el.appendChild(document.createTextNode(t));
    });
    el.className = "big" + (opts && opts.pink ? " pink" : "");
    el.style.fontSize = fitFont(String(text).split("\n"),
                                Math.min(window.innerWidth * .135, 86)) + "px";
    anim(el, opts && opts.slam ? "slam" : "hit");
  }

  function revCard(stars, quote, src){
    show("c-rev");
    $("revStars").textContent = stars;
    var q = $("revQuote");
    q.textContent = "«" + quote + "»";
    q.style.fontSize = fitFont(quote.split("\n").map(function(l){ return "«" + l + "»"; }),
                               Math.min(window.innerWidth * .076, 46)) + "px";
    $("revSrc").textContent = "— " + src;
    anim($("c-rev").firstElementChild, "hit");
  }

  function montCard(text){
    show("c-mont");
    var el = $("montTxt");
    el.textContent = upper(text);
    el.style.fontSize = fitFont([upper(text)], Math.min(window.innerWidth * .12, 74)) + "px";
    anim(el, "slam");
  }

  /* ============================================================
     The running order
     ============================================================ */

  function run(){
    clearAll();
    document.body.classList.add("wide");     /* the bars slide in */
    var L = [];        /* the script, so the timing is readable in one place */

    /* the leader every film used to start with */
    L.push([200,  function(){ show("c-count"); $("countNum").textContent = "3"; anim($("countNum"),"pop"); tick(.09); }]);
    L.push([1100, function(){ $("countNum").textContent = "2"; anim($("countNum"),"pop"); tick(.09); }]);
    L.push([2000, function(){ $("countNum").textContent = "1"; anim($("countNum"),"pop"); tick(.09); }]);
    L.push([2900, function(){ flash(); boom(.2); }]);

    /* the gag that opens it */
    L.push([3100, function(){ show("c-phone"); $("phoneTxt").textContent = "Telefonunuzu söndürün."; anim($("phoneTxt"),"hit"); tick(.06); }]);
    L.push([4600, function(){ $("phoneTxt").innerHTML = "Yox. <span class='pink'>Bu telefonda gedir.</span>"; anim($("phoneTxt"),"hit"); tick(.06); }]);

    /* studio logo */
    L.push([6400, function(){ show("c-logo"); anim($("emoji"),"pop"); whoosh(.7,.12); chord(.05); }]);
    L.push([8900, function(){ boom(.35); flash(); }]);

    /* rating */
    L.push([9000, function(){ show("c-rating"); anim($("c-rating").firstElementChild,"slam"); }]);

    /* part one, and how the world received it */
    L.push([11500, function(){ lineCard("KEÇƏN DƏFƏ", {slam:true}); boom(.34); braam(.16, 2.0); shakeStage(); }]);
    L.push([13400, function(){ lineCard("BİR FİLM ÇIXDI."); boom(.3); }]);
    L.push([15400, function(){ lineCard("HAMI\nAĞLADI.", {pink:true}); boom(.32); shakeStage(); }]);

    L.push([17600, function(){ revCard("★★★★★", "Bir nəfər. Bir gəziş.\nŞedevr.", "Bakı Xəbər"); whoosh(.45,.09); tick(.05); }]);
    L.push([21000, function(){ revCard("★★★★★", "Bu ilin ən yaxşı\nadamı.", "Kino Jurnalı"); whoosh(.45,.09); tick(.05); }]);

    /* the sequel, which is the same film but longer */
    L.push([24600, function(){ lineCard("İNDİ..."); riser(1.7,.09); }]);
    L.push([26600, function(){ lineCard("DAVAMI\nGƏLDİ.", {pink:true}); boom(.44, 130); flash(); shakeStage(); braam(.24, 2.6); }]);

    L.push([29400, function(){ lineCard("EYNİ ADAM."); boom(.28); }]);
    L.push([31200, function(){ lineCard("EYNİ YOL."); boom(.28); }]);
    L.push([33000, function(){ lineCard("SADƏCƏ\nDAHA UZUN.", {pink:true}); boom(.36); shakeStage(); }]);

    /* what the critics made of the sequel */
    L.push([35600, function(){ revCard("★★★★★", "İki qat çox gəzdilər.\nHeç nə baş vermədi.\nMöhtəşəm.", "Kino Jurnalı"); whoosh(.45,.09); tick(.05); }]);
    L.push([39400, function(){ revCard("★★★★★", "Ayaqlarım ağrıyır.\nYenə baxaram.", "Bakı Xəbər"); whoosh(.45,.09); tick(.05); }]);
    L.push([42800, function(){ revCard("★★★★☆", "Bir ulduz çıxdı:\ntitrlərdən sonra\ndavamı yoxdur.", "Səhər Qəzeti"); whoosh(.45,.09); boom(.22); }]);

    /* genre */
    L.push([46600, function(){ lineCard("KOMEDİYA.\nDRAM."); boom(.3); }]);
    L.push([48500, function(){ lineCard("VƏ BİR AZ\nQORXU.", {pink:true}); boom(.34); shakeStage(); }]);

    /* the horror scene */
    L.push([50600, function(){ lineCard("BİR SƏHNƏ VAR."); riser(1.8,.10); }]);
    L.push([52600, function(){ lineCard("O, MESAJI GÖRÜR."); boom(.3); }]);
    L.push([54500, function(){ lineCard("VƏ CAVAB\nVERMİR.", {pink:true}); boom(.42, 130); flash(); shakeStage(); braam(.22, 2.4); }]);

    /* her */
    var mEnd = 57600;
    L.push([mEnd, function(){
      show("c-star");
      $("starBox").querySelector(".frame").style.display = "";
      $("starName").textContent = upper(AD);
      $("starName").classList.remove("pink");
      $("starRole").textContent = "öz rolunda";
      anim($("starBox"),"on");
      $("starBox").classList.add("on");
      riser(1.6,.10); }]);
    L.push([mEnd + 2100, function(){ boom(.36); flash(); shakeStage(); }]);

    /* the claims nobody asked for */
    L.push([mEnd + 2200, function(){ lineCard("HEÇ BİR EFEKT\nİSTİFADƏ OLUNMAYIB."); }]);
    L.push([mEnd + 4300, function(){ lineCard("HAMISI\nHƏQİQƏTDİR.", {pink:true}); boom(.28); }]);

    /* the title */
    L.push([mEnd + 6600, function(){
      show("c-title");
      $("titleTag").textContent = "Tezliklə";
      var tt = upper(AD) + " 2";
      $("titleTxt").textContent = tt;
      $("titleTxt").style.fontSize = fitFont([tt], Math.min(window.innerWidth * .26, 140)) + "px";
      anim($("titleTxt"),"slam");
      $("titleTxt").classList.add("gleam");
      anim($("c-title").firstElementChild,"creep");
      boom(.5, 150); flash(); shakeStage(); braam(.30, 3.2);
    }]);
    L.push([mEnd + 9200, function(){
      $("titleTag").textContent = "";
      $("titleTxt").classList.remove("gleam");
      $("titleTxt").innerHTML = "DAHA UZUN <span class='pink'>GƏZİNTİ</span>";
      $("titleTxt").style.fontSize = fitFont(["DAHA UZUN", "GƏZİNTİ"], Math.min(window.innerWidth * .155, 92)) + "px";
      anim($("titleTxt"),"hit");
      boom(.3);
    }]);
    L.push([mEnd + 11600, function(){
      $("titleTxt").innerHTML = "3-CÜ HİSSƏ <span class='pink'>ÇƏKİLİR</span>";
      $("titleTxt").style.fontSize = fitFont(["3-CÜ HİSSƏ", "ÇƏKİLİR"], Math.min(window.innerWidth * .155, 92)) + "px";
      anim($("titleTxt"),"hit");
      boom(.26);
    }]);

    /* the ask */
    L.push([mEnd + 14200, function(){
      show("");
      $("endc").classList.add("on");
      $("endTxt").innerHTML = SON ? SON : "BİLETLƏR<br>SATIŞDA";
      $("endSub").textContent = "Bir nəfərlik zal. Yer ayrılıb.";
      chord(.06);
      $("skip").classList.remove("on");
    }]);

    L.forEach(function(step2){ at(step2[0], step2[1]); });
  }

  /* ============================================================
     Controls
     ============================================================ */

  $("play").addEventListener("click", function(){
    initAudio();
    $("gate").classList.add("off");
    $("skip").classList.add("on");
    run();
  });

  $("skip").addEventListener("click", function(){
    clearAll();
    show("");
    $("endc").classList.add("on");
    $("endTxt").innerHTML = SON ? SON : "ÜÇÜNCÜ HİSSƏ<br>NƏ VAXT?";
    $("endSub").textContent = "Bu dəfə lap uzun gəzərik.";
    $("skip").classList.remove("on");
  });

  $("again2").addEventListener("click", function(){
    $("endc").classList.remove("on");
    $("skip").classList.add("on");
    run();
  });

  var tk = $("ticket");
  if (TEL && /^\d{7,15}$/.test(TEL)){
    tk.href = "https://wa.me/" + TEL;
  } else {
    tk.style.display = "none";
  }
})();
</script>
