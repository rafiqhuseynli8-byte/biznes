body.night #vignette{ opacity:0 }

#dots{
  position:absolute; inset:0; z-index:0; pointer-events:none; opacity:0;
  background-image:radial-gradient(rgba(246,239,225,.14) 1px, rgba(0,0,0,0) 1.4px);
  background-size:7px 7px; transition:opacity .5s ease;
}
body.night #dots{ opacity:.45 }
#frame{
  position:absolute; inset:9px; z-index:12; pointer-events:none;
  border:3px solid #F6EFE1; border-radius:2px; opacity:0;
  transition:opacity .45s ease;
}
body.night #frame{ opacity:.85 }
#wash{
  position:absolute; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(115% 62% at 50% 40%, rgba(255,201,60,.13), rgba(0,0,0,0) 64%);
  opacity:0; transition:opacity 1.3s ease;
}
#wash.on{ opacity:1 }
#flash{
  position:absolute; inset:0; z-index:18; pointer-events:none; background:#fff; opacity:0;
}
#flash.on{ animation:flash .55s ease-out both }
@keyframes flash{ 0%{ opacity:.9 } 100%{ opacity:0 } }

.card{
  position:absolute; inset:0; z-index:3;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:30px 22px; text-align:center;
  opacity:0; pointer-events:none; transition:opacity .4s ease;
}
.card.on{ opacity:1; pointer-events:auto }

/* ══════════ VƏRƏQ ══════════ */
#story{ z-index:5 }
#paper{
  position:relative; width:min(88vw,420px); min-height:min(62vh,470px);
  background:linear-gradient(160deg, var(--paper) 0%, var(--paper-2) 100%);
  border-radius:2px; padding:34px 30px; text-align:left;
  box-shadow:0 22px 60px -18px rgba(0,0,0,.85), 0 2px 0 rgba(255,255,255,.14) inset;
  transform:rotate(-.7deg);
  transition:transform .8s cubic-bezier(.4,0,.7,.2), opacity .8s ease;
}
#paper.gone{ transform:translateY(-118vh) rotate(-9deg); opacity:0 }
#paper.swap{ transform:translateY(6px) rotate(-.7deg) scale(.98); opacity:0 }
#paper::after{        /* vərəqin altındakı ikinci vərəq */
  content:""; position:absolute; inset:6px -5px -7px 5px; z-index:-1;
  background:var(--paper-2); border-radius:2px; transform:rotate(1.1deg);
  box-shadow:0 12px 30px -14px rgba(0,0,0,.7);
}
.ln{
  /* display:table — blok mətnin eni qədər daralır, ona görə çəkilən
     xətt sətrin uzunluğunu tam təkrarlayır, boşluğa uzanmır. */
  position:relative; display:table; max-width:100%; margin:0 0 6px; padding:2px 0;
  font-family:"Caveat",cursive; font-weight:500;
  font-size:clamp(23px,6.4vw,31px); line-height:1.5; letter-spacing:.004em;
  color:var(--pen); word-break:break-word;
}
.ln .cw{ position:relative; display:inline-block }
.strike{
  position:absolute; left:-2px; top:56%; height:2px; width:calc(100% + 4px);
  background:var(--pen); border-radius:2px; transform:scaleX(0);
  transform-origin:0 50%; transition:transform .42s cubic-bezier(.3,.8,.4,1);
  opacity:.86; pointer-events:none;
}
.strike.on{ transform:scaleX(1) }
.ln.dead{ color:var(--pen-2); opacity:.72 }
/* Çəkilən xətt yalnız bir sətri tutur. Cümlə iki sətrə düşsə,
   ikincisi xətsiz qalır — ona görə animasiya bitəndən sonra
   brauzerin öz xətti işə düşür və hər sətri tutur. */
.ln.dead, .cw.dead{ text-decoration:line-through; text-decoration-thickness:2px }
.ln.dead > .strike, .cw.dead > .strike{ display:none }
#pen{
  display:inline-block; width:2px; height:.92em; margin-left:1px;
  background:var(--pen); vertical-align:-.1em; opacity:.8;
  animation:blink 1.05s steps(1) infinite;
}
@keyframes blink{ 0%,49%{ opacity:.8 } 50%,100%{ opacity:0 } }

/* söz ver */
#promise{ z-index:6 }
#promise .note{
  width:min(88vw,420px); background:var(--paper); border-radius:2px;
  padding:26px 26px 28px; transform:rotate(.6deg); text-align:left;
  box-shadow:0 22px 60px -18px rgba(0,0,0,.85);
}
#promise p{
  margin:0 0 22px; font-family:"Caveat",cursive; font-weight:500;
  font-size:clamp(23px,6.4vw,31px); line-height:1.45; color:var(--pen);
}
#pGo, #go{
  font-family:"Archivo",sans-serif; font-weight:600; font-size:15px;
  cursor:pointer; padding:13px 26px; border-radius:8px;
  border:1.5px solid var(--pen); background:transparent; color:var(--pen);
  transition:background .2s ease, color .2s ease;
}
#pGo:hover, #go:hover{ background:var(--pen); color:var(--paper) }
#pGo:focus-visible, #go:focus-visible{ outline:2px solid var(--pen); outline-offset:3px }

/* ══════════ GECƏ ══════════ */
#scene{ z-index:4; padding:0 }
#scene::before{
  content:""; position:absolute; left:0; right:0; bottom:0; height:36vh; z-index:1;
  background:linear-gradient(to top, rgba(104,134,186,.26), rgba(104,134,186,0) 72%);
  opacity:0; transition:opacity 1.4s ease; pointer-events:none;
}
#scene.lit::before{ opacity:1 }
#city{
  position:absolute; left:0; right:0; bottom:0; width:100%; height:30vh;
  z-index:2; opacity:0; transition:opacity 1.1s ease;
}
#city.on{ opacity:1 }
#beam{
  position:absolute; left:50%; bottom:6vh; z-index:1;
  width:74vw; max-width:520px; height:64vh;
  transform:translateX(-50%) scaleY(.04); transform-origin:50% 100%;
  background:linear-gradient(to top, rgba(255,201,60,.34), rgba(255,201,60,.05) 62%, rgba(255,201,60,0));
  clip-path:polygon(41% 100%, 59% 100%, 100% 0, 0 0);
  filter:blur(6px); opacity:0;
}
#beam.on{ animation:beam 1.3s cubic-bezier(.2,.9,.3,1) forwards }
@keyframes beam{
  0%{ opacity:0; transform:translateX(-50%) scaleY(.04) }
  55%{ opacity:1 }
  100%{ opacity:.92; transform:translateX(-50%) scaleY(1) }
}
#disc{
  position:absolute; left:50%; top:30%; z-index:3;
  width:min(66vw,300px); aspect-ratio:1; transform:translate(-50%,-50%) scale(.6);
  border-radius:50%; display:grid; place-items:center;
  background:radial-gradient(circle, rgba(255,229,154,.96) 0%, rgba(255,201,60,.88) 46%, rgba(255,201,60,.16) 68%, rgba(255,201,60,0) 74%);
  opacity:0;
}
#disc.on{ animation:hit .8s cubic-bezier(.16,1,.3,1) forwards }
@keyframes hit{
  0%{ opacity:0; transform:translate(-50%,-50%) scale(.55) }
  62%{ opacity:1; transform:translate(-50%,-50%) scale(1.07) }
  100%{ opacity:1; transform:translate(-50%,-50%) scale(1) }
}
#disc.dim{ animation:none; opacity:.32; transform:translate(-50%,-50%) scale(.8); transition:opacity .9s ease, transform .9s ease }
#bat{ width:66%; display:block; filter:drop-shadow(0 3px 10px rgba(0,0,0,.55)) }
#bat path{ fill:var(--ink) }

#cap{
  position:absolute; left:0; right:0; top:59%; z-index:5; padding:0 20px;
  margin:0; font-family:"Anton",Impact,sans-serif; font-weight:400;
  font-size:clamp(35px,11.8vw,66px);
  /* Anton + azərbaycan diakritikləri: 1.3-dən aşağı line-height olmaz. */
  line-height:1.3; letter-spacing:.005em; text-align:center;
  color:#F6EFE1; text-wrap:balance;
  -webkit-text-stroke:3px var(--ink);
  text-shadow:7px 7px 0 rgba(255,201,60,.95);
  opacity:0;
}
#cap.on{ animation:splash .55s cubic-bezier(.16,1,.3,1) both }
@keyframes splash{
  0%{ opacity:0; transform:scale(.78) rotate(-3deg) }
  60%{ opacity:1; transform:scale(1.05) rotate(1deg) }
  100%{ opacity:1; transform:none }
}

/* ---------- şəxsi iş ---------- */
#proof{ z-index:7 }
/* Şəxsi iş də əl yazısıdır — bu variantda hər şey eyni vərəqdən
   çıxır, komiks lövhəsi buraya yad düşür. */
.sheet{
  background:linear-gradient(160deg, var(--paper) 0%, var(--paper-2) 100%);
  color:var(--pen); border-radius:2px;
  box-shadow:0 22px 60px -18px rgba(0,0,0,.85), 0 2px 0 rgba(255,255,255,.14) inset;
  padding:26px 26px 28px; width:100%; max-width:400px; text-align:left;
  transform:rotate(-.9deg); position:relative;
}
.sheet::after{
  content:""; position:absolute; inset:6px -5px -7px 5px; z-index:-1;
  background:var(--paper-2); border-radius:2px; transform:rotate(1.2deg);
  box-shadow:0 12px 30px -14px rgba(0,0,0,.7);
}
.sheet .tag{
  display:inline-block; margin:0 0 16px; padding:4px 10px 3px;
  border:1.5px solid var(--pen); color:var(--pen); border-radius:2px;
  font-family:"Archivo",sans-serif; font-weight:700; font-size:11px;
  letter-spacing:.22em; line-height:1.4; transform:rotate(-1.5deg); opacity:.8;
}
#dossier{ margin:0; padding:0 }
.rec{
  padding:11px 0; border-top:1px solid rgba(30,36,48,.2);
  opacity:0; transform:translateX(-8px); transition:opacity .45s ease, transform .45s ease;
}
.rec:first-child{ border-top:0; padding-top:0 }
.rec.on{ opacity:1; transform:none }
.rec .k{
  display:block; margin:0 0 2px; font-family:"Archivo",sans-serif; font-weight:600;
  font-size:10.5px; letter-spacing:.2em; line-height:1.4; color:rgba(30,36,48,.5);
}
.rec .v{
  display:block; font-family:"Caveat",cursive; font-weight:500;
  font-size:clamp(22px,6vw,28px); line-height:1.35; color:var(--pen);
}
.censor{
  position:relative; display:inline-block; padding:0 4px; overflow:hidden;
  background:rgba(30,36,48,.09); border-radius:1px;
}
.censor i{
  position:absolute; inset:0; background:var(--pen); border-radius:1px;
  transition:transform .55s cubic-bezier(.2,.9,.3,1);
}
.censor.slip i{ transform:translateX(103%) }

/* ---------- son ---------- */
#end{ z-index:8 }
.box{
  background:linear-gradient(160deg, var(--paper) 0%, var(--paper-2) 100%);
  color:var(--pen); border:0; border-radius:2px;
  padding:20px 22px; text-align:left; max-width:400px;
  font-family:"Caveat",cursive; font-weight:500;
  font-size:clamp(23px,6.2vw,29px); line-height:1.4;
  box-shadow:0 22px 60px -18px rgba(0,0,0,.85); transform:rotate(.8deg);
}
#end .last{
  margin:20px 0 0; font-family:"Anton",Impact,sans-serif; line-height:1.3;
  font-size:clamp(31px,10vw,54px); color:var(--sig);
  -webkit-text-stroke:3px var(--ink); text-shadow:6px 6px 0 var(--ink);
}
#end .sign{
  margin:18px 0 0; font-family:"Caveat",cursive; font-weight:600; font-size:22px;
  letter-spacing:.02em; line-height:1.3; color:var(--dim);
}
.row{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:26px }
.btn{
  font-family:"Anton",Impact,sans-serif; font-size:16px; letter-spacing:.02em;
  line-height:1.3; cursor:pointer; padding:12px 22px 10px; border-radius:2px;
  border:3px solid #F6EFE1; background:transparent; color:#F6EFE1;
  text-decoration:none; display:inline-block;
  transition:transform .08s ease, box-shadow .08s ease;
}
.btn.solid{
  background:var(--sig); border-color:var(--ink); color:var(--ink);
  box-shadow:5px 5px 0 #F6EFE1;
}
.btn.solid:active{ transform:translate(3px,3px); box-shadow:2px 2px 0 #F6EFE1 }
.btn:focus-visible{ outline:3px solid var(--sig); outline-offset:3px }

/* ---------- başlanğıc ---------- */
#gate{
  position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:24px; padding:32px 26px;
  background:var(--desk); transition:opacity .6s ease;
}
#gate.off{ opacity:0; pointer-events:none }
#gate .note{
  width:min(86vw,400px); background:var(--paper); border-radius:2px;
  padding:26px; transform:rotate(-1deg); text-align:left;
  box-shadow:0 22px 60px -18px rgba(0,0,0,.85);
}
#gTitle{
  margin:0 0 22px; font-family:"Caveat",cursive; font-weight:500;
  font-size:clamp(24px,6.6vw,32px); line-height:1.4; color:var(--pen);
}
#gate .sub{ margin:0; font-size:13px; color:var(--dim); text-align:center; letter-spacing:.03em }

#skip{
  position:absolute; z-index:19; top:calc(env(safe-area-inset-top,0px) + 16px); right:18px;
  font-family:"Archivo",sans-serif; font-size:12px; letter-spacing:.06em;
  padding:8px 12px; border:1px solid rgba(243,234,216,.24); border-radius:7px;
  background:rgba(20,18,16,.5); color:rgba(243,234,216,.7); cursor:pointer;
  opacity:0; pointer-events:none; transition:opacity .3s;
}
#skip.on{ opacity:1; pointer-events:auto }
body.night #skip{
  font-family:"Anton",Impact,sans-serif; letter-spacing:.14em;
  border:2px solid #F6EFE1; border-radius:2px; color:#F6EFE1;
  background:var(--ink); padding:8px 13px 6px;
}

body.shake{ animation:shake .5s ease }
@keyframes shake{
  0%,100%{ transform:translate(0,0) } 20%{ transform:translate(-3px,2px) }
  40%{ transform:translate(3px,-2px) } 60%{ transform:translate(-2px,-1px) }
  80%{ transform:translate(2px,1px) }
}

@media (prefers-reduced-motion:reduce){
  #pen{ animation:none } body.shake{ animation:none }
  #flash.on,#cap.on{ animation-duration:.01ms }
  #beam.on{ animation:none; opacity:.9; transform:translateX(-50%) scaleY(1) }
  #disc.on{ animation:none; opacity:1; transform:translate(-50%,-50%) scale(1) }
  #paper{ transition:opacity .3s ease }
}
</style>
</head>
<body>

<div id="dots"></div>
<div id="wash"></div>
<div id="vignette"></div>

<div class="card on" id="story">
  <div id="paper"></div>
</div>

<div class="card" id="promise">
  <div class="note">
    <p id="pText">—</p>
    <button id="pGo">Söz verirəm</button>
  </div>
</div>

<div class="card" id="scene">
  <div id="beam"></div>
  <div id="disc">
    <svg id="bat" viewBox="0 0 200 78" aria-hidden="true"><path id="batPath" d=""/></svg>
  </div>
  <svg id="city" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true">
    <path id="cityPath" d="" fill="#050609"/>
  </svg>
  <p id="cap"></p>
</div>

<div class="card" id="proof">
  <div class="sheet">
    <span class="tag" id="pTag">ŞƏXSİ İŞ</span>
    <div id="dossier"></div>
  </div>
</div>

<div class="card" id="end">
  <div class="box" id="eKick">—</div>
  <p class="last" id="eLast">—</p>
  <p class="sign" id="eSign"></p>
  <div class="row">
    <a class="btn solid" id="reply" href="#" target="_blank" rel="noopener">Cavab yaz</a>
    <button class="btn" id="again">Yenidən</button>
  </div>
</div>

<div id="flash"></div>
<div id="frame"></div>
<button id="skip">Keç</button>

<div id="gate">
  <div class="note"><p id="gTitle">—</p><button id="go">Aç</button></div>
  <p class="sub">Səsi aç. Tələsmə.</p>
</div>

<script>
(function(){
  "use strict";

  /* ══════════════════════════════════════════════════════════════
       .../siqnal-kagiz/?ad=Leyla&imza=Rafiq&tel=994500000000

     ad, basliq, yarim, qalan, acilis, kodlar, zeif, yekun, imza, tel
     — hamısı "siqnal" şablonundakı kimidir.
     ══════════════════════════════════════════════════════════════ */

  var Q = (function(){
    var q = new URLSearchParams(location.search);
    var h = new URLSearchParams(location.hash.replace(/^#/, ""));
    h.forEach(function(v, k){ if (!q.has(k)) q.set(k, v); });
    return q;
  })();
  function param(k, d, max){
    var v = Q.get(k);
    if (v === null) return d;
    v = v.trim();
    return v ? v.slice(0, max || 90) : d;
  }
  var $ = function(id){ return document.getElementById(id); };
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function up(t){ try{ return t.toLocaleUpperCase("az"); }catch(e){ return t.toUpperCase(); } }
  function low(t){ try{ return t.toLocaleLowerCase("az"); }catch(e){ return t.toLowerCase(); } }

  var AD    = param("ad", "dostum", 26);
  var BAS   = param("basliq", "Sənə deməli olduğum bir şey var.", 90);
  var DURAQ = param("duraq", "Mən", 60);
  var ACIL  = param("acilis", "Mən Batmanam.", 60);
  var KOD   = param("kodlar", "", 90);
  var ZEIF  = param("zeif", "", 26);
  var YEKUN = param("yekun", "Sadəcə yaz.", 40);
  var IMZA  = param("imza", "", 26);
  var TEL   = param("tel", "", 15).replace(/\D/g, "");

  /* Gözləməni pauza yaradır, sözlər yox: "Mən" yazılır və qələm
     dayanır. Etirafın heç bir hissəsi kağıza düşmür. */
  var HEAD = (ACIL.indexOf(DURAQ) === 0) ? DURAQ : ACIL;
  var TAIL = (ACIL.indexOf(DURAQ) === 0) ? ACIL.slice(DURAQ.length) : "";

  $("gTitle").textContent = BAS;
  $("pText").textContent  = "Söz ver ki, heç kimə deməyəcəksən.";
  $("eKick").textContent  = "Göydə siqnal yandırmağa ehtiyac yoxdur.";
  $("eLast").textContent  = up(YEKUN);
  $("eSign").textContent  = IMZA ? "— " + IMZA : "";

  var FILE = [];
  if (KOD) FILE.push(["KOD ADLARI", KOD, false]);
  FILE.push(["UÇA BİLİR?", "Xeyr.", false]);
  FILE.push(["ÇAĞIRANDA GƏLİR?", "Bəli.", false]);
  FILE.push(["ZƏİF NÖQTƏSİ", ZEIF || "məlumat yoxdur", true]);

  $("batPath").setAttribute("d",
    "M100 4 C95 4 91 10 89 19 C84 12 77 8 69 8 C58 8 49 16 47 27 "+
    "C38 18 26 13 14 13 C9 13 4 14 0 16 C10 18 18 23 22 30 "+
    "C13 29 5 33 0 40 C11 37 22 39 29 45 C21 48 15 55 13 64 "+
    "C26 53 43 49 57 53 C70 57 78 65 82 74 C86 63 92 57 100 57 "+
    "C108 57 114 63 118 74 C122 65 130 57 143 53 C157 49 174 53 187 64 "+
    "C185 55 179 48 171 45 C178 39 189 37 200 40 C195 33 187 29 178 30 "+
    "C182 23 190 18 200 16 C196 14 191 13 186 13 C174 13 162 18 153 27 "+
    "C151 16 142 8 131 8 C123 8 116 12 111 19 C109 10 105 4 100 4 Z");

  (function(){
    var d = "M0 120 L0 74", x = 0, tops = [62,48,70,38,56,44,66,30,58,50,68,42,60,72,46];
    for (var i = 0; i < tops.length; i++){
      var w = 18 + (i % 4) * 8;
      d += " L" + x + " " + tops[i] + " L" + (x + w) + " " + tops[i];
      x += w;
    }
    d += " L400 " + tops[tops.length - 1] + " L400 120 Z";
    $("cityPath").setAttribute("d", d);
  })();

  /* ══════════════ SƏS: qələm, kağız, sonra gecə ══════════════ */

  var AC = null, master = null, drone = null, droneGain = null;
  function initAudio(){
    if (AC) return;
    try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return; }
    master = AC.createGain(); master.gain.value = .8; master.connect(AC.destination);
  }
  function startDrone(){
    if (!AC || drone) return;
    droneGain = AC.createGain(); droneGain.gain.value = .0001;
    var lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 240;
    drone = [];
    [48, 48.4, 72].forEach(function(f){
      var o = AC.createOscillator(); o.type = "sawtooth"; o.frequency.value = f;
      o.connect(lp); o.start(); drone.push(o);
    });
    lp.connect(droneGain); droneGain.connect(master);
    droneGain.gain.exponentialRampToValueAtTime(.026, AC.currentTime + 5);
  }
  function droneTo(v, s){
    if (!droneGain) return;
    droneGain.gain.exponentialRampToValueAtTime(Math.max(v, .0001), AC.currentTime + s);
  }
  function stopDrone(){
    if (!drone) return;
    droneTo(.0001, .5);
    var d = drone; drone = null;
    setTimeout(function(){ d.forEach(function(o){ try{ o.stop(); }catch(e){} }); }, 800);
  }
  function noise(vol, hz, len, type){
    if (!AC) return;
    var n = Math.floor(AC.sampleRate * len);
    var b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var s = AC.createBufferSource(); s.buffer = b;
    var f = AC.createBiquadFilter(); f.type = type || "highpass"; f.frequency.value = hz;
    var g = AC.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  }
  function pen(){ noise(.012, 1800, .018); }
  function scratch(){ noise(.055, 900, .34); }
  function paper(){ noise(.06, 500, .5); }
  function tick(v){ noise(v || .05, 3000, .014); }
  function thump(vol){
    if (!AC) return;
    var t = AC.currentTime;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(88, t);
    o.frequency.exponentialRampToValueAtTime(42, t + .16);
    g.gain.setValueAtTime(.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + .3);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + .35);
  }
  function beat(v){ thump(v); setTimeout(function(){ thump(v * .7); }, 210); }
  function impact(){
    if (!AC) return;
    var t = AC.currentTime;
    var n = Math.floor(AC.sampleRate * 1.4);
    var b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.4);
    var s = AC.createBufferSource(); s.buffer = b;
    var f = AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 700;
    var g = AC.createGain(); g.gain.value = .5;
    s.connect(f); f.connect(g); g.connect(master); s.start();
    var o = AC.createOscillator(), og = AC.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(120, t);
    o.frequency.exponentialRampToValueAtTime(28, t + .9);
    og.gain.setValueAtTime(.0001, t);
    og.gain.linearRampToValueAtTime(.55, t + .03);
    og.gain.exponentialRampToValueAtTime(.0001, t + 1.5);
    o.connect(og); og.connect(master); o.start(t); o.stop(t + 1.6);
  }
  function shine(){
    if (!AC) return;
    var t = AC.currentTime;
    [784, 1046.5, 1318.5].forEach(function(f, i){
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t + i * .07);
      g.gain.linearRampToValueAtTime(.05, t + i * .07 + .05);
      g.gain.exponentialRampToValueAtTime(.0001, t + i * .07 + 1.6);
      o.connect(g); g.connect(master); o.start(t + i * .07); o.stop(t + i * .07 + 1.8);
    });
  }

  /* ══════════════ QƏLƏM ══════════════ */

  var timers = [];
  function at(ms, fn){ var t = setTimeout(fn, ms); timers.push(t); return t; }
  function clearAll(){ timers.forEach(clearTimeout); timers.length = 0; }

  var PAPER = $("paper");
  var line = null, span = null, caret = null;

  function newLine(){
    line = document.createElement("p");
    line.className = "ln";
    span = document.createElement("span");
    caret = document.createElement("i");
    caret.id = "pen";
    line.appendChild(span); line.appendChild(caret);
    PAPER.appendChild(line);
    return line;
  }
  function write(text, speed, done){
    var i = 0;
    (function next(){
      if (i >= text.length){ done(); return; }
      span.textContent += text.charAt(i++);
      if (i % 2 === 0) pen();
      var ch = text.charAt(i - 1);
      var p = speed + Math.random() * 34;
      if (ch === "," ) p += 140;
      if (ch === "." || ch === "?") p += 240;
      if (ch === " ") p -= 10;
      at(p, next);
    })();
  }
  function strikeEl(el, done){
    var s = document.createElement("i");
    s.className = "strike";
    el.appendChild(s);
    void s.offsetWidth;
    s.classList.add("on");
    scratch();
    at(520, done);
  }

  /* ══════════════ SSENARİ ══════════════ */

  var ops = [], oi = 0;
  function step(){ if (oi < ops.length) ops[oi++](); }
  function opHold(ms){ return function(){ at(ms, step); }; }
  function opDo(fn){ return function(){ fn(); step(); }; }
  function opLine(text, speed){
    return function(){ newLine(); write(text, speed || 62, step); };
  }
  function opStrike(){
    return function(){
      if (caret) caret.remove();
      var el = line;
      strikeEl(el, function(){ el.classList.add("dead"); step(); });
    };
  }
  function opNewPage(){
    return function(){
      paper();
      PAPER.classList.add("gone");
      at(820, function(){
        PAPER.innerHTML = "";
        PAPER.classList.remove("gone");
        PAPER.classList.add("swap");
        void PAPER.offsetWidth;
        PAPER.classList.remove("swap");
        at(420, step);
      });
    };
  }
  function opPromise(){
    return function(){
      $("story").classList.remove("on");
      $("promise").classList.add("on");
    };
  }
  /* Son sətir: "Mən" + "səni"(üstündən xətt) + " Batmanam." */
  function opFinalHead(){
    return function(){
      newLine();
      write(HEAD, 76, step);
    };
  }
  function opTail(){
    return function(){
      var t = document.createElement("span");
      line.insertBefore(t, caret);
      var i = 0;
      (function next(){
        if (i >= TAIL.length){ step(); return; }
        t.textContent += TAIL.charAt(i++);
        if (i % 2 === 0) pen();
        at(52 + Math.random() * 26, next);
      })();
    };
  }

  function boom(){
    $("story").classList.remove("on");
    $("flash").classList.add("on");
    document.body.classList.add("night");
    if (!reduce){
      document.body.classList.add("shake");
      at(600, function(){ document.body.classList.remove("shake"); });
    }
    impact(); stopDrone();
    $("scene").classList.add("on");
    $("beam").classList.add("on");
    $("city").classList.add("on");
    $("scene").classList.add("lit");
    at(260, function(){ $("disc").classList.add("on"); });
    at(900, function(){
      var c = $("cap");
      c.textContent = up(ACIL);
      c.classList.remove("on"); void c.offsetWidth; c.classList.add("on");
      shine();
    });
    at(4600, function(){
      $("disc").classList.remove("on"); $("disc").classList.add("dim");
      $("scene").classList.remove("on");
      $("proof").classList.add("on");
      dossier();
    });
  }

  function dossier(){
    var host = $("dossier");
    host.innerHTML = "";
    var lastBar = null;
    FILE.forEach(function(row, i){
      var d = document.createElement("div");
      d.className = "rec";
      var k = document.createElement("span");
      k.className = "k"; k.textContent = row[0];
      var v = document.createElement("span");
      v.className = "v";
      if (row[2]){
        var c = document.createElement("span");
        c.className = "censor";
        c.textContent = row[1];
        c.appendChild(document.createElement("i"));
        v.appendChild(c);
        lastBar = c;
      } else {
        v.textContent = row[1];
      }
      d.appendChild(k); d.appendChild(v);
      host.appendChild(d);
      at(350 + i * 1050, function(){ d.classList.add("on"); tick(.05); });
    });
    var done = 350 + FILE.length * 1050;
    if (lastBar && ZEIF){
      at(done + 900,  function(){ lastBar.classList.add("slip"); shine(); });
      at(done + 2350, function(){ lastBar.classList.remove("slip"); tick(.06); });
    }
    at(done + 3900, finish);
  }

  function finish(){
    ["story","promise","scene","proof"].forEach(function(c){ $(c).classList.remove("on"); });
    document.body.classList.add("night");
    $("end").classList.add("on");
    $("wash").classList.add("on");
    $("skip").classList.remove("on");
    shine();
  }

  function script(){
    var nick = low(AD);
    return [
      opHold(800),
      opLine(nick + " sənə bir şey deyəcəm", 54),
      opHold(900),
      opStrike(),
      opHold(600),

      opLine("yəqin vaxtı deyil amma", 52),
      opHold(800),
      opStrike(),
      opHold(600),

      opLine("necə deyim bilmirəm", 56),
      opHold(1100),
      opStrike(),
      opHold(900),

      opNewPage(),

      opLine("Yaxşı.", 70),
      opHold(1000),
      opLine("Ciddi deyirəm.", 60),
      opHold(1200),

      opDo(function(){ droneTo(.05, 3); }),
      opPromise(),

      opDo(function(){ $("promise").classList.remove("on"); $("story").classList.add("on"); }),
      opHold(700),
      opLine("Bunu heç kimə deməmişəm.", 56),
      opHold(1200),
      opLine("Sənə deyirəm.", 60),
      opHold(1300),
      opLine("Əlim əsir.", 64),
      opHold(1400),

      opDo(function(){ droneTo(.09, 4); beat(.45); }),
      opHold(700),
      opLine(AD + ",", 74),
      opHold(1200),

      opFinalHead(),
      opDo(function(){ beat(.6); }),
      opHold(3900),
      opDo(function(){ beat(.74); }),
      opHold(1500),
      opDo(function(){ beat(.88); }),
      opTail(),
      opHold(700),
      opDo(boom)
    ];
  }

  function start(){
    clearAll();
    PAPER.innerHTML = "";
    PAPER.classList.remove("gone", "swap");
    document.body.classList.remove("night");
    ["promise","scene","proof","end"].forEach(function(c){ $(c).classList.remove("on"); });
    $("beam").classList.remove("on"); $("city").classList.remove("on");
    $("scene").classList.remove("lit");
    $("disc").classList.remove("on"); $("disc").classList.remove("dim");
    $("wash").classList.remove("on");
    $("cap").classList.remove("on"); $("cap").textContent = "";
    $("flash").classList.remove("on");
    $("story").classList.add("on");
    $("skip").classList.add("on");
    ops = script(); oi = 0;
    step();
  }

  $("go").addEventListener("click", function(){
    initAudio(); startDrone();
    $("gate").classList.add("off");
    start();
  });
  $("pGo").addEventListener("click", function(){ tick(.05); step(); });
  $("skip").addEventListener("click", function(){
    clearAll(); stopDrone();
    document.body.classList.add("night");
    $("beam").classList.add("on"); $("city").classList.add("on");
    $("scene").classList.add("lit"); $("disc").classList.add("dim");
    finish();
  });
  $("again").addEventListener("click", function(){ initAudio(); startDrone(); start(); });

  if (TEL && /^\d{7,15}$/.test(TEL)){
    var WA = "https://wa.me/" + TEL;
    var rep = $("reply");
    rep.href = WA;
    rep.addEventListener("click", function(e){
      e.preventDefault();
      var w = null;
      try{ w = window.open(WA, "_blank", "noopener"); }catch(err){}
      if (!w){ try{ location.href = WA; }catch(err2){} }
    });
  } else {
    $("reply").style.display = "none";
  }

})();
</script>
</body>
</html>
