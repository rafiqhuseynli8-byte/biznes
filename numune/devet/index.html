:root{
  --void:#150C2B;
  --void-2:#221046;
  --lime:#CBF24E;
  --lime-dim:rgba(203,242,78,.42);
  --violet:#8C6BE8;
  --cream:#F6F2FF;
  --cream-60:rgba(246,242,255,.62);
  --cream-35:rgba(246,242,255,.35);
  --line:rgba(246,242,255,.14);
  --panel:rgba(246,242,255,.055);

  --pad:clamp(20px,5.6vw,36px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.22,.68,.32,1);
  --pop:cubic-bezier(.2,1.5,.35,1);
  --num:"Archivo","Helvetica Neue",Arial,sans-serif;
  --text:"Outfit","Segoe UI",system-ui,-apple-system,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--void)}

body{
  min-height:100vh;
  min-height:100svh;
  font-family:var(--text);
  color:var(--cream);
  background-color:var(--void);
  background-image:
    radial-gradient(110% 60% at 50% 0%, #2E1560 0%, transparent 62%),
    radial-gradient(85% 50% at 50% 100%, #1B0E3A 0%, transparent 72%);
  background-attachment:fixed;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

#fx{position:fixed;inset:0;z-index:60;pointer-events:none}

.stage{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  min-height:100vh;
  min-height:100svh;
  width:100%;
  max-width:520px;
  margin:0 auto;
  padding:calc(28px + env(safe-area-inset-top,0px)) var(--pad) calc(26px + var(--safe-b));
}
.inner{
  margin:auto 0;
  display:flex;
  flex-direction:column;
  gap:clamp(18px,3.4vh,28px);
  width:100%;
}

.eyebrow{
  margin:0;
  font-size:clamp(.64rem,2.9vw,.73rem);
  font-weight:600;
  letter-spacing:.32em;
  text-indent:.32em;
  text-transform:uppercase;
  color:var(--lime);
}
.title{
  margin:0;
  font-family:var(--num);
  font-weight:800;
  font-size:clamp(2rem,9vw,3.1rem);
  line-height:1.02;
  letter-spacing:-.032em;
  color:var(--cream);
  text-wrap:balance;
}
.title em{font-style:normal;color:var(--lime)}
.lede{
  margin:0;
  font-size:clamp(.94rem,3.9vw,1.05rem);
  line-height:1.62;
  color:var(--cream-60);
}

/* ── countdown ────────────────────────────────────────── */
.cd{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}
.cd-cell{
  padding:clamp(12px,3.4vw,17px) 4px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--panel);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  text-align:center;
}
.cd-num{
  display:block;
  font-family:var(--num);
  font-weight:800;
  font-size:clamp(1.5rem,7.6vw,2.3rem);
  line-height:1;
  letter-spacing:-.03em;
  color:var(--lime);
  font-variant-numeric:tabular-nums;
}
.cd-cap{
  display:block;
  margin-top:7px;
  font-size:clamp(.58rem,2.5vw,.66rem);
  font-weight:500;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--cream-35);
}

.now{
  padding:clamp(18px,5vw,26px);
  border:1px solid var(--lime-dim);
  border-radius:16px;
  background:linear-gradient(150deg,rgba(203,242,78,.13),rgba(203,242,78,.02));
  text-align:center;
}
.now b{
  display:block;
  font-family:var(--num);
  font-weight:800;
  font-size:clamp(1.5rem,7vw,2.1rem);
  letter-spacing:-.02em;
  color:var(--lime);
}
.now span{
  display:block;
  margin-top:8px;
  font-size:.9rem;
  color:var(--cream-60);
}

/* ── details ──────────────────────────────────────────── */
.rows{
  border:1px solid var(--line);
  border-radius:18px;
  background:var(--panel);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
  overflow:hidden;
}
.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:clamp(14px,3.8vw,18px) clamp(16px,4.4vw,22px);
  border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:0}
.row-k{
  flex:0 0 auto;
  font-size:clamp(.66rem,2.9vw,.74rem);
  font-weight:600;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--cream-35);
}
.row-v{
  font-family:var(--num);
  font-weight:700;
  font-size:clamp(1rem,4.3vw,1.16rem);
  line-height:1.3;
  letter-spacing:-.015em;
  text-align:right;
  color:var(--cream);
}

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  min-height:58px;
  padding:16px 26px;
  border:0;
  border-radius:100px;
  background:var(--lime);
  color:#1A2005;
  font-family:var(--text);
  font-weight:700;
  font-size:clamp(.96rem,4vw,1.08rem);
  letter-spacing:.02em;
  text-decoration:none;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  box-shadow:0 16px 38px -16px rgba(203,242,78,.6);
  transition:transform .18s var(--ease);
}
.btn:active{transform:scale(.985)}

.fine{
  margin:0;
  font-size:.78rem;
  line-height:1.5;
  text-align:center;
  color:var(--cream-35);
}

.setup{
  padding:24px;
  border:1px dashed var(--lime-dim);
  border-radius:16px;
  background:var(--panel);
}
.setup h2{margin:0 0 12px;font-family:var(--num);font-size:1.15rem;color:var(--cream)}
.setup p{margin:0 0 12px;font-size:.86rem;line-height:1.6;color:var(--cream-60)}
.setup code{
  display:block;padding:12px 14px;border-radius:9px;
  background:rgba(0,0,0,.35);color:var(--lime);
  font-size:.76rem;word-break:break-all;line-height:1.5;
}

:focus-visible{outline:2.5px solid var(--lime);outline-offset:4px;border-radius:6px}

@media (max-width:359px){
  .cd{gap:5px}
  .row{flex-direction:column;align-items:flex-start;gap:5px}
  .row-v{text-align:left}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
}
</style>
</head>

<canvas id="fx" aria-hidden="true"></canvas>

<main class="stage">
 <div class="inner" id="inner"></div>
</main>

  "use strict";

  /* ══════════════════════════════════════════════════════════════
     МЕНЯЕТСЯ ПРЯМО В ССЫЛКЕ — файл трогать не надо.

       .../devet/?ad=Leyla&vaxt=2026-08-22T18:00&yer=Bulvar
       ...&ne=Qəhvə&tel=994500000000&imza=Ad

     ad    — имя того, кого приглашаешь
     vaxt  — КОГДА: 2026-08-22T18:00  (год-месяц-деньTчасы:минуты)
     yer   — место               ne    — что за встреча
     tel   — твой номер для WhatsApp (без + и без пробелов)
     imza  — подпись             bas   — свой заголовок
     ══════════════════════════════════════════════════════════════ */

  var mq = window.matchMedia("(prefers-reduced-motion: reduce)");
  var reduce = mq.matches;

  /* Parametr həm ?-dən, həm #-dən oxunur. Bəzi yerlər ünvandan ?-i
     kəsir, # isə heç vaxt kəsilmir — ona görə ikisi də işləyir. */
  var Q = (function(){
    var q = new URLSearchParams(location.search);
    var h = new URLSearchParams(location.hash.replace(/^#/, ""));
    h.forEach(function(v, k){ if (!q.has(k)) q.set(k, v); });
    return q;
  })();
  function q(k, d){ var v = Q.get(k); return (v === null || v.trim() === "") ? d : v.trim(); }

  var AD   = q("ad", "Aysel").slice(0, 40);
  var YER  = q("yer", "").slice(0, 60);
  var NE   = q("ne", "").slice(0, 60);
  var TEL  = q("tel", "").replace(/[^0-9]/g, "").slice(0, 15);
  var IMZA = q("imza", "").slice(0, 40);
  var BAS  = q("bas", "").slice(0, 90);
  var VAXT = q("vaxt", "");

  var AYLAR = ["yanvar","fevral","mart","aprel","may","iyun",
               "iyul","avqust","sentyabr","oktyabr","noyabr","dekabr"];
  var GUNLER = ["bazar","bazar ertəsi","çərşənbə axşamı","çərşənbə",
                "cümə axşamı","cümə","şənbə"];

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function pad(n){ return (n < 10 ? "0" : "") + n; }

  var inner = document.getElementById("inner");

  /* ── parse the date ── */
  var when = null;
  var m = /^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ](\d{1,2}):(\d{2}))?$/.exec(VAXT);
  if (m){
    var d = new Date(+m[1], +m[2] - 1, +m[3], m[4] ? +m[4] : 0, m[5] ? +m[5] : 0, 0);
    if (d.getFullYear() === +m[1] && d.getMonth() === +m[2] - 1 && d.getDate() === +m[3]){
      when = d;
    }
  }

  /* Tarix yoxdursa, dəvət yenə də göstərilir — sadəcə vaxt açıq qalır.
     Qonağa "linkə parametr əlavə et" yazmaq olmaz: bu, ona deyil, sənə
     yazılmış cümlədir. */
  var OPEN = !when;

  document.title = (AD ? AD + ", " : "") + "dəvət";

  /* ── head ── */
  inner.appendChild(el("p", "eyebrow", "Dəvət"));
  var h1 = el("h1", "title");
  if (BAS){
    h1.textContent = BAS;
  } else if (AD){
    var em = el("em", null, AD);
    h1.appendChild(em);
    h1.appendChild(document.createTextNode(", gəlirsən?"));
  } else {
    h1.textContent = "Gəlirsən?";
  }
  inner.appendChild(h1);

  var whenTxt = OPEN
    ? "Vaxtı sən deyəcəksən"
    : when.getDate() + " " + AYLAR[when.getMonth()] +
      ", " + GUNLER[when.getDay()] +
      (m[4] ? ", saat " + pad(when.getHours()) + ":" + pad(when.getMinutes()) : "");
  /* Once the date is behind us the countdown turns into a note, so the
     lede must not keep promising a countdown underneath it. */
  var alreadyPast = !OPEN && (when.getTime() - Date.now()) <= 0;
  inner.appendChild(el("p", "lede", OPEN
    ? "Vaxtı sən seçirsən. Mən hazıram."
    : whenTxt + "." + (alreadyPast ? "" : " Qalan vaxt aşağıdadır.")));

  /* ── countdown ── */
  var cd = el("div", "cd");
  var cells = [];
  ["gün","saat","dəq","san"].forEach(function(cap){
    var c = el("div", "cd-cell");
    var n = el("span", "cd-num", "0");
    c.appendChild(n);
    c.appendChild(el("span", "cd-cap", cap));
    cd.appendChild(c);
    cells.push(n);
  });
  if (OPEN) cd.style.display = "none";
  inner.appendChild(cd);

  var nowBox = el("div", "now");
  nowBox.style.display = OPEN ? "" : "none";
  var nowB = el("b", null, OPEN ? "Vaxt açıqdır" : "Bu gündür!");
  nowBox.appendChild(nowB);
  nowBox.appendChild(el("span", null, OPEN ? "Sən de — mən gələrəm." : "Vaxt gəldi."));
  inner.appendChild(nowBox);

  /* ── details ── */
  var rows = el("div", "rows");
  function row(k, v){
    if (!v) return;
    var r = el("div", "row");
    r.appendChild(el("span", "row-k", k));
    r.appendChild(el("span", "row-v", v));
    rows.appendChild(r);
  }
  row("Nə", NE);
  row("Harada", YER);
  row("Nə vaxt", whenTxt);
  if (rows.children.length) inner.appendChild(rows);

  /* ── accept ── */
  if (TEL){
    var msg = "Gəlirəm ✅" +
              (NE ? "\nNə: " + NE : "") +
              (YER ? "\nYer: " + YER : "") +
              "\nVaxt: " + whenTxt;
    var a = el("a", "btn", "Gəlirəm");
    a.href = "https://wa.me/" + TEL + "?text=" + encodeURIComponent(msg);
    a.target = "_blank";
    a.rel = "noopener";
    a.addEventListener("click", function(){ burst(110); });
    inner.appendChild(a);
    inner.appendChild(el("p", "fine",
      "Düymə WhatsApp-ı açacaq — cavab hazır yazılıb."));
  } else {
    var btn = el("button", "btn", "Gəlirəm");
    btn.type = "button";
    btn.addEventListener("click", function(){
      burst(120);
      btn.textContent = "Gözləyirəm 🙂";
    });
    inner.appendChild(btn);
  }

  if (IMZA) inner.appendChild(el("p", "fine", "— " + IMZA));

  /* ── tick ── */
  function tick(){
    if (OPEN) return;
    var left = when - new Date();
    if (left <= 0){
      cd.style.display = "none";
      nowBox.style.display = "";
      nowB.textContent = (left > -864e5) ? "Bu gündür!" : "Vaxt keçdi";
      nowBox.lastChild.textContent = (left > -864e5) ? "Vaxt gəldi." : "Amma dəvət qüvvədədir.";
      return;
    }
    var s = Math.floor(left / 1000);
    cells[0].textContent = Math.floor(s / 86400);
    cells[1].textContent = pad(Math.floor(s / 3600) % 24);
    cells[2].textContent = pad(Math.floor(s / 60) % 60);
    cells[3].textContent = pad(s % 60);
  }
  tick();
  window.setInterval(tick, 1000);

  /* ── confetti ── */
  var cvs = document.getElementById("fx"), c2 = cvs.getContext("2d");
  var parts = [], raf = null;
  var COLORS = ["#CBF24E","#8C6BE8","#F6F2FF","#E8FF8A","#5B3FA8"];

  function sizeFx(){
    var dd = Math.min(window.devicePixelRatio || 1, 2);
    cvs.width = Math.floor(window.innerWidth * dd);
    cvs.height = Math.floor(window.innerHeight * dd);
    cvs.style.width = window.innerWidth + "px";
    cvs.style.height = window.innerHeight + "px";
    c2.setTransform(dd, 0, 0, dd, 0, 0);
  }
  sizeFx();
  window.addEventListener("resize", sizeFx);

  function burst(n){
    if (reduce) return;
    var cx = window.innerWidth / 2, cy = window.innerHeight * 0.5;
    for (var i = 0; i < (n || 110); i++){
      var a = Math.random() * Math.PI * 2, sp = 3.4 + Math.random() * 9;
      parts.push({
        x: cx + (Math.random()-.5)*70, y: cy + (Math.random()-.5)*40,
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 5.2,
        w: 5 + Math.random()*7, h: 7 + Math.random()*8,
        rot: Math.random()*Math.PI*2, vrot: (Math.random()-.5)*.32,
        color: COLORS[(Math.random()*COLORS.length)|0],
        round: Math.random() < .3, life: 1
      });
    }
    if (parts.length > 440) parts.splice(0, parts.length - 440);
    if (!raf) raf = requestAnimationFrame(loop);
  }

  function loop(){
    var Hh = window.innerHeight;
    c2.clearRect(0, 0, window.innerWidth, Hh);
    for (var i = parts.length - 1; i >= 0; i--){
      var p = parts[i];
      p.vy += .22; p.vx *= .992; p.vy *= .996;
      p.x += p.vx; p.y += p.vy; p.rot += p.vrot;
      if (p.y > Hh * .6) p.life -= .012;
      if (p.y > Hh + 60 || p.life <= 0){ parts.splice(i,1); continue; }
      c2.save();
      c2.translate(p.x, p.y); c2.rotate(p.rot);
      c2.globalAlpha = Math.max(0, Math.min(1, p.life));
      c2.fillStyle = p.color;
      if (p.round){ c2.beginPath(); c2.arc(0,0,p.w/2,0,Math.PI*2); c2.fill(); }
      else c2.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      c2.restore();
    }
    if (parts.length) raf = requestAnimationFrame(loop);
    else { c2.clearRect(0,0,window.innerWidth,Hh); raf = null; }
  }

})();
</script>
</body>
</html>
