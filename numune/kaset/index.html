/* ============================================================
   Bir VHS lenti. Tozlu, titrək, 1998-ci ildən qalma.
   Hər şey bir fayldadır: şrift, səs, şəkil yoxdur — hamısı çəkilir.
   ============================================================ */
:root{
  --tape:#07070A;        /* lentin qaranlığı */
  --glow:#DDE7E2;        /* fosfor ağı */
  --osd:#F2F2E8;         /* ekran yazıları */
  --rec:#FF3B30;         /* REC nöqtəsi */
  --blue:#1B2AC4;        /* siqnal yoxdur ekranı */
  --warm:#E8B45F;        /* lentin sarımtıl işığı */
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent }
html,body{ height:100%; margin:0; background:var(--tape); overflow:hidden }
body{
  font-family:"Barlow Condensed",Impact,sans-serif;
  color:var(--glow); position:fixed; inset:0;
  touch-action:manipulation; user-select:none;
}

#screen{ position:absolute; inset:0; overflow:hidden }
canvas{ position:absolute; inset:0; width:100%; height:100% }

/* ---------- lentin üstündəki cızıqlar ---------- */
#lines{
  position:absolute; inset:0; pointer-events:none; z-index:6; opacity:.5;
  background:repeating-linear-gradient(
    to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.42) 2px 4px);
  mix-blend-mode:multiply;
}
#roll{
  position:absolute; left:0; right:0; height:22vh; z-index:7; pointer-events:none;
  background:linear-gradient(to bottom,
    rgba(255,255,255,0) 0%, rgba(255,255,255,.06) 45%,
    rgba(255,255,255,.10) 52%, rgba(255,255,255,0) 100%);
  animation:roll 7.5s linear infinite;
}
@keyframes roll{ from{ top:-25vh } to{ top:105vh } }
#vig{
  position:absolute; inset:0; z-index:8; pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,
    rgba(0,0,0,0) 34%, rgba(0,0,0,.62) 76%, rgba(0,0,0,.95) 100%);
}

/* ---------- ekranın öz yazıları (OSD) ---------- */
.osd{
  position:absolute; z-index:9; font-family:"VT323",monospace;
  font-size:clamp(17px,5.2vw,26px); letter-spacing:.06em; color:var(--osd);
  text-shadow:0 0 12px rgba(226,255,240,.5), 2px 0 0 rgba(255,0,90,.45), -2px 0 0 rgba(0,200,255,.45);
}
#osdMode{ top:calc(env(safe-area-inset-top,0px) + 16px); left:18px }
#osdTime{ bottom:calc(env(safe-area-inset-bottom,0px) + 16px); right:18px; font-variant-numeric:tabular-nums }
#osdDate{ bottom:calc(env(safe-area-inset-bottom,0px) + 16px); left:18px }
#recDot{
  display:inline-block; width:.62em; height:.62em; border-radius:50%;
  background:var(--rec); margin-right:.42em; vertical-align:baseline;
  box-shadow:0 0 14px var(--rec);
}
.blink{ animation:blink 1.1s steps(1,end) infinite }
@keyframes blink{ 0%,55%{ opacity:1 } 56%,100%{ opacity:.15 } }

/* ---------- lentin üstündəki söz ---------- */
#stage{
  position:absolute; inset:0; z-index:5; display:flex;
  align-items:center; justify-content:center; padding:0 7vw;
}
#cap{
  margin:0; text-align:center; text-wrap:balance;
  font-weight:600; line-height:1.24; letter-spacing:.005em;
  text-transform:uppercase;
  color:var(--glow);
  text-shadow:
    0 0 26px rgba(200,255,225,.30),
    2.5px 0 0 rgba(255,0,80,.5), -2.5px 0 0 rgba(0,220,255,.5);
}
#cap .warm{ color:var(--warm) }
#cap small{
  display:block; margin-top:.9em; font-size:.42em; letter-spacing:.2em;
  font-weight:400; opacity:.72; text-transform:uppercase;
}
.in{ animation:in .5s cubic-bezier(.16,.9,.3,1) both }
@keyframes in{
  0%{ opacity:0; transform:translateY(10px) scaleX(1.06) }
  100%{ opacity:1; transform:none }
}
.jolt{ animation:jolt .34s steps(2,end) both }
@keyframes jolt{
  0%{ transform:translate(0,0) }
  25%{ transform:translate(-9px,2px) }
  50%{ transform:translate(7px,-3px) }
  75%{ transform:translate(-4px,1px) }
  100%{ transform:translate(0,0) }
}

/* ---------- məktub ---------- */
#letter{
  position:absolute; inset:0; z-index:10; display:none;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 12vh) 8vw
          calc(env(safe-area-inset-bottom,0px) + 14vh);
  background:linear-gradient(180deg, rgba(7,7,10,.94), rgba(7,7,10,.985));
}
#letter.on{ display:block }
#letter .kicker{
  font-family:"VT323",monospace; font-size:clamp(15px,4.4vw,20px);
  letter-spacing:.22em; color:var(--warm); margin:0 0 1.6em; opacity:.9;
}
#letter p{
  font-size:clamp(17px,4.7vw,21px); line-height:1.75; margin:0 0 1.5em;
  max-width:34em; color:#E7E9E4;
}
#letter p.sign{
  font-family:"VT323",monospace; font-size:clamp(19px,5.4vw,25px);
  letter-spacing:.1em; color:var(--warm); margin-top:2.4em;
}
#letter .row{ display:flex; flex-wrap:wrap; gap:12px; margin-top:2.8em }
.btn{
  font-family:"VT323",monospace; font-size:clamp(17px,4.8vw,21px);
  letter-spacing:.12em; text-transform:uppercase; text-decoration:none;
  padding:13px 22px; border-radius:2px; cursor:pointer;
  border:2px solid rgba(232,180,95,.55); background:transparent; color:var(--warm);
}
.btn.solid{ background:var(--warm); color:#1A1206; border-color:var(--warm) }
.btn:focus-visible{ outline:3px solid var(--glow); outline-offset:3px }

/* ---------- başlanğıc ---------- */
#gate{
  position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:30px;
  background:radial-gradient(90% 70% at 50% 45%, #101018 0%, #06060A 75%);
  transition:opacity .55s ease;
}
#gate.off{ opacity:0; pointer-events:none }
#gate .lbl{
  font-family:"VT323",monospace; letter-spacing:.32em; text-transform:uppercase;
  font-size:clamp(14px,4vw,17px); color:rgba(232,231,222,.6); margin:0;
}
#gate h1{
  margin:0; font-weight:600; text-transform:uppercase; text-align:center;
  font-size:clamp(34px,11vw,66px); letter-spacing:.02em; line-height:1.05;
  text-shadow:2.5px 0 0 rgba(255,0,80,.45), -2.5px 0 0 rgba(0,220,255,.45);
}
#play{
  width:clamp(92px,26vw,120px); height:clamp(92px,26vw,120px); border-radius:50%;
  border:2px solid rgba(232,180,95,.7); background:rgba(232,180,95,.10);
  color:var(--warm); cursor:pointer; display:grid; place-items:center;
  font-size:clamp(30px,8vw,38px); padding-left:.16em;
  box-shadow:0 0 60px -12px rgba(232,180,95,.7);
  animation:pulse 2.4s ease-in-out 4;
}
@keyframes pulse{ 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.055) } }
#gate .hint{ font-size:clamp(13px,3.7vw,15px); color:rgba(232,231,222,.45); margin:0 }

/* ---------- düymələr ---------- */
#skip{
  position:absolute; z-index:19; top:calc(env(safe-area-inset-top,0px) + 14px); right:16px;
  font-family:"VT323",monospace; font-size:15px; letter-spacing:.16em; text-transform:uppercase;
  padding:8px 14px; border:1px solid rgba(232,231,222,.28); border-radius:2px;
  background:rgba(0,0,0,.35); color:rgba(232,231,222,.75); cursor:pointer;
  opacity:0; pointer-events:none; transition:opacity .3s;
}
#skip.on{ opacity:1; pointer-events:auto }

@media (prefers-reduced-motion:reduce){
  #roll,.blink,#play{ animation:none }
  .in,.jolt{ animation-duration:.01ms }
}
</style>
</head>

     mesaj  — məktubun abzasları, | ilə ayrılır
     imza   — kimdən
     tel    — WhatsApp nömrəsi (+ və boşluq olmadan)
     ══════════════════════════════════════════════════════════════ */

  /* Parametr həm ?-dən, həm #-dən oxunur. Bəzi yerlər ünvandan ?-i
     kəsir, # isə heç vaxt kəsilmir — ona görə ikisi də işləyir. */
  function param(k, def, max){
    try{
      var q = new URLSearchParams(location.search);
      var h = new URLSearchParams(location.hash.replace(/^#/, ""));
      var v = q.get(k);
      if (v === null) v = h.get(k);
      if (v === null) return def;
      v = v.trim().slice(0, max || 120);
      return v || def;
    }catch(e){ return def; }
  }
  function lines(s){
    return s ? s.split("|").map(function(x){ return x.trim(); }).filter(Boolean) : [];
  }

  var AD     = param("ad", "Səbinə", 26);
  var IL     = param("il", "", 4).replace(/\D/g, "");
  var IMZA   = param("imza", "", 26);
  var TEL    = param("tel", "", 15).replace(/\D/g, "");
  var SEHNE  = lines(param("sehne", "", 700));
  var MESAJ  = lines(param("mesaj", "", 1600));

  if (!SEHNE.length) SEHNE = [
    "Bu lent çoxdan burdadır.",
    "Heç kim baxmayıb.",
    "İndi sən baxırsan."
  ];
  if (!MESAJ.length) MESAJ = [
    "Bu lenti sənin üçün yazdım.",
    "Burda böyük söz yoxdur. Sadəcə istədim ki, bir dəfə də olsa, kimsə sənə bunu desin."
  ];

  /* azərbaycanca böyük hərf: i → İ, ı → I */
  function upper(s){
    return String(s).replace(/i/g, "İ").replace(/ı/g, "I").toUpperCase();
  }

  var $ = function(id){ return document.getElementById(id); };
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  $("gTitle").textContent = upper(AD);
  $("lSign").textContent = IMZA ? "— " + IMZA : "";
  $("lKick").textContent = "● REC — " + upper(AD) + " ÜÇÜN";
  if (TEL && /^\d{7,15}$/.test(TEL)){
    $("reply").href = "https://wa.me/" + TEL;
  } else {
    $("reply").style.display = "none";
  }

  /* ══════════════════════════════════════════════════════════════
     LENTİN ŞƏKLİ
     Həqiqi kadr yoxdur. Ekranda yavaş sürüşən işıq ləkələri var,
     üstündən VHS zibili gedir: dənə, xromatik sürüşmə, izləmə xətası.
     ══════════════════════════════════════════════════════════════ */

  var cv = $("cv"), cx = cv.getContext("2d", { alpha:false });
  var W = 0, H = 0, DPR = 1;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.width  = Math.round(innerWidth  * DPR);
    H = cv.height = Math.round(innerHeight * DPR);
  }
  resize();
  addEventListener("resize", resize);

  /* işıq ləkələri — otağın içindəki lampalar kimi */
  var BLOBS = [];
  for (var i = 0; i < 5; i++){
    BLOBS.push({
      x: Math.random(), y: Math.random(),
      vx: (Math.random() - .5) * .00013,
      vy: (Math.random() - .5) * .00010,
      r: .28 + Math.random() * .34,
      h: [34, 44, 190, 16, 52][i],
      a: .10 + Math.random() * .10
    });
  }

  /* dənə — bir dəfə çəkilir, sonra sürüşdürülür */
  var grain = document.createElement("canvas");
  grain.width = grain.height = 190;
  (function(){
    var g = grain.getContext("2d");
    var d = g.createImageData(190, 190), p = d.data;
    for (var i = 0; i < p.length; i += 4){
      var v = 120 + Math.random() * 135;
      p[i] = p[i+1] = p[i+2] = v;
      p[i+3] = 26 + Math.random() * 40;
    }
    g.putImageData(d, 0, 0);
  })();

  var tracking = 0;      /* izləmə xətası — keçidlərdə qalxır */
  var signal   = 1;      /* siqnalın gücü */

  function glitch(power){ tracking = Math.max(tracking, power); }

  function frame(t){
    /* fon */
    cx.fillStyle = "#07070A";
    cx.fillRect(0, 0, W, H);

    /* işıq ləkələri */
    cx.globalCompositeOperation = "lighter";
    for (var i = 0; i < BLOBS.length; i++){
      var b = BLOBS[i];
      b.x += b.vx; b.y += b.vy;
      if (b.x < -.3 || b.x > 1.3) b.vx *= -1;
      if (b.y < -.3 || b.y > 1.3) b.vy *= -1;
      var wob = Math.sin(t / 2600 + i * 1.7) * .05;
      var R = (b.r + wob) * Math.max(W, H);
      var g = cx.createRadialGradient(b.x * W, b.y * H, 0, b.x * W, b.y * H, R);
      g.addColorStop(0, "hsla(" + b.h + ",62%,62%," + (b.a * signal) + ")");
      g.addColorStop(1, "hsla(" + b.h + ",62%,40%,0)");
      cx.fillStyle = g;
      cx.beginPath(); cx.arc(b.x * W, b.y * H, R, 0, 6.2832); cx.fill();
    }
    cx.globalCompositeOperation = "source-over";

    /* izləmə xətası — üfüqi zolaqlar sürüşür */
    if (tracking > .01){
      var bands = 3 + Math.round(tracking * 9);
      for (var k = 0; k < bands; k++){
        var by = Math.random() * H;
        var bh = (4 + Math.random() * 34) * DPR;
        var dx = (Math.random() - .5) * tracking * W * .34;
        try{
          cx.drawImage(cv, 0, by, W, bh, dx, by, W, bh);
        }catch(e){}
      }
      /* siqnal itir kimi ağ zolaq */
      cx.fillStyle = "rgba(235,240,235," + (tracking * .16) + ")";
      cx.fillRect(0, Math.random() * H, W, (2 + Math.random() * 8) * DPR);
      tracking *= reduce ? .5 : .90;
    }

    /* dənə */
    var gs = 190;
    var ox = -Math.random() * gs, oy = -Math.random() * gs;
    cx.globalAlpha = .38;
    for (var x = ox; x < W; x += gs)
      for (var y = oy; y < H; y += gs)
        cx.drawImage(grain, x, y, gs, gs);
    cx.globalAlpha = 1;

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ══════════════════════════════════════════════════════════════
     SƏS — lentin öz səsi: xış, mühərrik, düymə
     ══════════════════════════════════════════════════════════════ */

  var AC = null, master = null, hiss = null, hissGain = null;

  function initAudio(){
    if (AC) return;
    try{
      AC = new (window.AudioContext || window.webkitAudioContext)();
    }catch(e){ return; }
    master = AC.createGain();
    master.gain.value = .85;
    master.connect(AC.destination);

    /* lentin xışıltısı — filtrlənmiş küy, davamlı */
    var len = AC.sampleRate * 2;
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * .5;
    hiss = AC.createBufferSource();
    hiss.buffer = buf; hiss.loop = true;
    var bp = AC.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 3200; bp.Q.value = .5;
    hissGain = AC.createGain(); hissGain.gain.value = 0;
    hiss.connect(bp); bp.connect(hissGain); hissGain.connect(master);
    hiss.start();
  }
  function hissTo(v, dur){
    if (!hissGain) return;
    hissGain.gain.cancelScheduledValues(AC.currentTime);
    hissGain.gain.setValueAtTime(hissGain.gain.value, AC.currentTime);
    hissGain.gain.linearRampToValueAtTime(v, AC.currentTime + (dur || .4));
  }
  function noiseBurst(vol, dur, freq){
    if (!AC) return;
    var n = Math.floor(AC.sampleRate * dur);
    var b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var s = AC.createBufferSource(); s.buffer = b;
    var f = AC.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq || 1800; f.Q.value = .8;
    var g = AC.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(master);
    s.start();
  }
  function clunk(vol){
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(180, AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(48, AC.currentTime + .16);
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + .22);
    o.connect(g); g.connect(master);
    o.start(); o.stop(AC.currentTime + .24);
    noiseBurst(vol * .5, .07, 900);
  }
  function motor(on){
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = "sawtooth"; o.frequency.value = on ? 62 : 42;
    var lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 220;
    g.gain.setValueAtTime(0, AC.currentTime);
    g.gain.linearRampToValueAtTime(.05, AC.currentTime + .3);
    g.gain.linearRampToValueAtTime(0, AC.currentTime + 1.5);
    o.connect(lp); lp.connect(g); g.connect(master);
    o.start(); o.stop(AC.currentTime + 1.6);
  }
  function rewindSound(dur){
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(160, AC.currentTime);
    o.frequency.linearRampToValueAtTime(900, AC.currentTime + dur * .7);
    o.frequency.linearRampToValueAtTime(120, AC.currentTime + dur);
    var bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1400; bp.Q.value = 2;
    g.gain.setValueAtTime(.001, AC.currentTime);
    g.gain.linearRampToValueAtTime(.12, AC.currentTime + .12);
    g.gain.linearRampToValueAtTime(.0001, AC.currentTime + dur);
    o.connect(bp); bp.connect(g); g.connect(master);
    o.start(); o.stop(AC.currentTime + dur + .05);
  }

  /* ══════════════════════════════════════════════════════════════
     EKRANIN YAZILARI
     ══════════════════════════════════════════════════════════════ */

  var counter = 0, counting = false, counterDir = 1;

  function two(n){ return (n < 10 ? "0" : "") + n; }
  function showTime(){
    var s = Math.max(0, Math.floor(counter));
    $("osdTime").textContent = Math.floor(s / 3600) + ":" + two(Math.floor(s / 60) % 60) + ":" + two(s % 60);
  }
  setInterval(function(){
    if (!counting) return;
    counter += counterDir * (counterDir > 0 ? 1 : 9);
    showTime();
  }, 1000);

  function mode(txt, rec){
    $("osdMode").innerHTML = "";
    if (rec){
      var dot = document.createElement("span");
      dot.id = "recDot"; dot.className = "blink";
      $("osdMode").appendChild(dot);
    }
    $("osdMode").appendChild(document.createTextNode(txt));
  }

  var AY = ["YAN","FEV","MAR","APR","MAY","İYN","İYL","AVQ","SEN","OKT","NOY","DEK"];
  function stampDate(){
    var d = new Date();
    var y = IL || String(d.getFullYear());
    $("osdDate").textContent = AY[d.getMonth()] + " " + two(d.getDate()) + " " + y;
  }
  stampDate();

  /* söz — ekranın ortasında */
  var probe = document.createElement("canvas").getContext("2d");
  function fit(text, maxPx){
    var avail = innerWidth * .86;
    var rows = String(text).split("\n");
    var size = maxPx;
    for (var i = 0; i < 24; i++){
      probe.font = "600 " + size.toFixed(1) + 'px "Barlow Condensed",Impact,sans-serif';
      var w = 0;
      for (var j = 0; j < rows.length; j++) w = Math.max(w, probe.measureText(upper(rows[j])).width);
      if (w <= avail || size <= 15) break;
      size = Math.max(15, size * (avail / w) * .98);
    }
    return size;
  }

  function say(text, opts){
    opts = opts || {};
    var el = $("cap");
    el.innerHTML = "";
    var rows = String(text).split("\n");
    rows.forEach(function(r, i){
      if (i) el.appendChild(document.createElement("br"));
      if (opts.warm && i === rows.length - 1){
        var sp = document.createElement("span");
        sp.className = "warm"; sp.textContent = upper(r);
        el.appendChild(sp);
      } else {
        el.appendChild(document.createTextNode(upper(r)));
      }
    });
    if (opts.sub){
      var s = document.createElement("small");
      s.textContent = opts.sub;
      el.appendChild(s);
    }
    el.style.fontSize = fit(text, Math.min(innerWidth * .13, 74)) + "px";
    el.classList.remove("in", "jolt");
    void el.offsetWidth;
    el.classList.add(opts.jolt ? "jolt" : "in");
  }
  function clear(){ $("cap").innerHTML = ""; }

  /* ══════════════════════════════════════════════════════════════
     GEDİŞ
     ══════════════════════════════════════════════════════════════ */

  var timers = [];
  function at(ms, fn){ timers.push(setTimeout(fn, ms)); }
  function stopAll(){ timers.forEach(clearTimeout); timers.length = 0; }

  function run(){
    stopAll();
    counter = 0; counterDir = 1; counting = false; showTime();
    signal = 1;
    var L = [], t = 0;

    /* lent düşür, mühərrik işə düşür */
    L.push([0, function(){
      mode("");
      clunk(.5); motor(true); hissTo(.055, .8); glitch(1);
      signal = .25;
    }]);
    L.push([500,  function(){ glitch(.7); noiseBurst(.16, .28, 2400); }]);
    L.push([1000, function(){ mode("PLAY ▶"); counting = true; signal = 1; glitch(.5); clunk(.3); }]);

    t = 2000;
    L.push([t, function(){ say(IL ? "Bu lent " + IL + "\nilindən qalıb." : "Bu lent çoxdan\nburda qalıb.", { sub:"arxivdən" }); noiseBurst(.09, .14, 3000); }]);
    t += 2900;
    L.push([t, function(){ say("Üstündə bir ad var:"); glitch(.3); }]);
    t += 2400;
    L.push([t, function(){ say(AD, { warm:true, jolt:true }); glitch(.85); clunk(.4); noiseBurst(.2, .3, 1500); }]);

    /* səhnələr */
    t += 3000;
    SEHNE.forEach(function(s, i){
      L.push([t, function(){
        say(s);
        noiseBurst(.07, .12, 2800);
        if (i % 2 === 1) glitch(.34);
      }]);
      t += 3000 + Math.min(1800, s.length * 42);
    });

    /* lent qarışır */
    L.push([t, function(){ glitch(1); noiseBurst(.26, .5, 1200); signal = .35; clear(); mode("— — —"); }]);
    t += 900;
    L.push([t, function(){ signal = 1; mode("PLAY ▶"); glitch(.5); }]);
    t += 400;
    L.push([t, function(){ say("Bir şey də var idi.", { sub:"lentin sonunda" }); }]);
    t += 2900;
    L.push([t, function(){ say("Deyilməmiş\nqalmışdı.", { warm:true }); glitch(.4); }]);

    /* geri sarılır */
    t += 3000;
    L.push([t, function(){
      clear(); mode("◀◀ REW"); counterDir = -1;
      rewindSound(2.2); glitch(1); hissTo(.13, .3);
    }]);
    t += 2200;
    L.push([t, function(){
      counting = false; counter = 0; showTime();
      mode("REC", true); counterDir = 1; counting = true;
      clunk(.45); hissTo(.05, .4); glitch(.9);
      say("İndi yazılır.", { sub:"səsli mesaj" });
    }]);

    /* məktub */
    t += 2800;
    L.push([t, function(){ openLetter(); }]);

    L.forEach(function(step){ at(step[0], step[1]); });
  }

  function openLetter(){
    stopAll();
    counting = true;
    mode("REC", true);
    clear();
    hissTo(.03, 1);
    var box = $("lBody");
    box.innerHTML = "";
    MESAJ.forEach(function(p, i){
      var el = document.createElement("p");
      el.textContent = p;
      el.style.opacity = "0";
      el.style.transition = "opacity .7s ease " + (i * .32) + "s";
      box.appendChild(el);
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.style.opacity = "1"; }); });
    });
    $("letter").classList.add("on");
    $("skip").classList.remove("on");
    glitch(.5);
    noiseBurst(.12, .3, 1600);
  }

  /* ══════════════════════════════════════════════════════════════
     DÜYMƏLƏR
     ══════════════════════════════════════════════════════════════ */

  $("play").addEventListener("click", function(){
    initAudio();
    if (AC && AC.state === "suspended") AC.resume();
    $("gate").classList.add("off");
    $("skip").classList.add("on");
    run();
  });
  $("skip").addEventListener("click", openLetter);
  $("again").addEventListener("click", function(){
    $("letter").classList.remove("on");
    $("skip").classList.add("on");
    run();
  });

  document.body.classList.remove("booting");
})();
</script>
</body>
</html>
