/* ============================================================
   HEKAYƏ — ən böyük şablon. Digərləri bir zarafat və ya bir andır;
   bu, oturub baxılan uzun səhifədir: beş fəsil, şəkillər, rəqəmlər,
   məktub və arzu.

   Sürət oxuyanın əlindədir — heç nə özü qaçmır, hər şey sürüşdürdükcə
   açılır. Bir dəfə "avtomatik dönən" şeydən şikayət olub: adam öz
   sürəti ilə baxmaq istəyir.

   Şəkillər və musiqi faylın içinə yığılır (qurucu alət bunu edir),
   ona görə səhifə internetsiz də işləyir.
   ============================================================ */
:root{
  --n1:#0B0D12;          /* gecə — açılış */
  --n2:#12151C;
  --warm:#1A1512;        /* isinmə — məktub fəsli */
  --paper:#F4EDE1;
  --ink:#EFEAE1;
  --ink-2:#A7A196;
  --ink-3:#6E6A62;
  --gold:#D9A441;
  --gold-2:#F0C978;
  --line:rgba(239,234,225,.14);
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent }
html{ scroll-behavior:smooth }
body{
  margin:0; background:var(--n1); color:var(--ink);
  font-family:"Manrope",system-ui,sans-serif; font-size:17px; line-height:1.65;
  overflow-x:hidden;
}
img{ max-width:100%; display:block }

/* fon — fəsildən fəslə rəng dəyişir */
#bg{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:var(--n1); transition:background 1.6s ease;
}
#glow{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0;
  background:radial-gradient(120% 60% at 50% 30%, rgba(217,164,65,.16), rgba(0,0,0,0) 62%);
  transition:opacity 1.6s ease;
}
#grain{
  position:fixed; inset:-50%; z-index:1; pointer-events:none; opacity:.035;
  background-image:radial-gradient(rgba(255,255,255,.8) .5px, rgba(0,0,0,0) .6px);
  background-size:3px 3px;
}
main{ position:relative; z-index:2 }

/* oxuma zolağı */
#bar{
  position:fixed; top:0; left:0; height:2px; width:0%; z-index:30;
  background:linear-gradient(90deg, var(--gold), var(--gold-2));
  transition:width .15s linear;
}

/* səs düyməsi */
#snd{
  position:fixed; z-index:31; top:calc(env(safe-area-inset-top,0px) + 14px); right:14px;
  width:40px; height:40px; border-radius:50%; cursor:pointer;
  border:1px solid var(--line); background:rgba(11,13,18,.6); color:var(--ink-2);
  display:grid; place-items:center; backdrop-filter:blur(6px);
}
#snd svg{ width:18px; height:18px }
#snd .off{ display:none } #snd.mute .on{ display:none } #snd.mute .off{ display:block }

section{ padding:0 24px; max-width:640px; margin:0 auto }
.pad{ padding:16vh 0 }

/* ---------- üz qabığı ---------- */
#cover{
  min-height:100svh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; padding:0 26px;
}
#cover .kicker{
  margin:0 0 20px; font-family:"Archivo",sans-serif; font-weight:600;
  font-size:11.5px; letter-spacing:.3em; text-transform:uppercase; color:var(--gold);
}
#cover h1{
  margin:0; font-family:"Instrument Serif",Georgia,serif; font-weight:400;
  font-size:clamp(52px,17vw,116px); line-height:.98; letter-spacing:-.01em;
}
#cover .sub{
  margin:22px 0 0; color:var(--ink-2); font-size:16px; max-width:24ch;
}
#cue{
  position:absolute; bottom:38px; left:50%; transform:translateX(-50%);
  color:var(--ink-3); font-size:12.5px; letter-spacing:.12em; text-transform:uppercase;
  font-family:"Archivo",sans-serif; display:flex; flex-direction:column;
  align-items:center; gap:9px; transition:opacity .5s ease;
}
#cue i{
  width:1px; height:34px; background:linear-gradient(to bottom, var(--ink-3), transparent);
  display:block; animation:drop 2.1s ease-in-out infinite;
}
@keyframes drop{ 0%,100%{ transform:scaleY(.4); opacity:.4 } 50%{ transform:scaleY(1); opacity:1 } }
#cover{ position:relative }

/* ---------- fəsil başlığı ---------- */
.chap{ text-align:center; padding:11vh 0 2vh }
.chap .no{
  margin:0 0 10px; font-family:"Archivo",sans-serif; font-weight:600;
  font-size:11px; letter-spacing:.32em; text-transform:uppercase; color:var(--gold);
}
.chap h2{
  margin:0; font-family:"Instrument Serif",Georgia,serif; font-weight:400;
  font-size:clamp(31px,8.4vw,50px); line-height:1.1;
}

/* ---------- açılan sətirlər ---------- */
.rev{ opacity:0; transform:translateY(20px); transition:opacity .9s ease, transform .9s cubic-bezier(.2,.8,.3,1) }
.rev.in{ opacity:1; transform:none }
.say{
  margin:0 0 26px; font-size:clamp(19px,5vw,24px); line-height:1.6; color:var(--ink);
  text-wrap:pretty;
}
.say:last-child{ margin-bottom:0 }

/* ---------- şəkillər ---------- */
#fotos{ display:grid; gap:34px; padding:4vh 0 }
.pol{
  background:var(--paper); padding:12px 12px 46px; border-radius:3px;
  box-shadow:0 26px 60px -26px rgba(0,0,0,.9); max-width:330px; width:86%;
  position:relative;
}
.pol:nth-child(odd){ transform:rotate(-1.8deg); margin-right:auto }
.pol:nth-child(even){ transform:rotate(1.6deg); margin-left:auto }
.pol img{ width:100%; aspect-ratio:1; object-fit:cover; background:#241F1A; border-radius:1px }
.pol figcaption{
  position:absolute; left:0; right:0; bottom:13px; text-align:center;
  font-family:"Instrument Serif",Georgia,serif; font-style:italic;
  font-size:17px; color:#3B342B;
}
.pol .film{
  position:absolute; inset:12px 12px 46px; background:#1E1A16; border-radius:1px;
  transition:opacity 2.4s ease;
}
.pol.in .film{ opacity:0 }

/* ---------- rəqəmlər ---------- */
#nums{ display:grid; gap:16px; padding:4vh 0 }
@media (min-width:560px){ #nums{ grid-template-columns:1fr 1fr } }
.num{
  border:1px solid var(--line); border-radius:16px; padding:22px 20px;
  background:rgba(255,255,255,.02);
}
.num b{
  display:block; font-family:"Instrument Serif",Georgia,serif; font-weight:400;
  font-size:clamp(40px,11vw,58px); line-height:1; color:var(--gold-2);
  letter-spacing:-.02em;
}
.num span{ display:block; margin-top:8px; color:var(--ink-2); font-size:15px }

/* ---------- məktub ---------- */
#letter{
  background:var(--paper); color:#2A241D; border-radius:6px;
  padding:34px 26px 38px; margin:4vh 0; box-shadow:0 30px 70px -30px rgba(0,0,0,.95);
}
@media (min-width:600px){ #letter{ padding:46px 42px 50px } }
#letter p{
  margin:0 0 20px; font-family:"Instrument Serif",Georgia,serif;
  font-size:clamp(19px,4.9vw,23px); line-height:1.62;
}
#letter p:last-child{ margin-bottom:0 }
#letter .big{ font-size:clamp(25px,6.4vw,32px); line-height:1.35 }

/* ---------- arzu ---------- */
#wish{
  text-align:center; padding:12vh 0 2vh;
  font-family:"Instrument Serif",Georgia,serif;
  font-size:clamp(29px,7.6vw,46px); line-height:1.22; color:var(--gold-2);
  text-wrap:balance;
}

/* ---------- son ---------- */
#end{ text-align:center; padding:8vh 0 16vh }
#end .sign{
  margin:0 0 6px; font-family:"Instrument Serif",Georgia,serif; font-style:italic;
  font-size:26px; color:var(--ink);
}
#end .date{
  margin:0 0 30px; font-family:"Archivo",sans-serif; font-size:12px;
  letter-spacing:.22em; text-transform:uppercase; color:var(--ink-3);
}
.btn{
  font-family:"Archivo",sans-serif; font-weight:600; font-size:15px;
  cursor:pointer; padding:15px 30px; border-radius:12px; display:inline-block;
  text-decoration:none; border:1px solid var(--gold); background:var(--gold); color:#231704;
}
.btn.ghost{ background:transparent; color:var(--ink); border-color:var(--line) }
.btns{ display:flex; gap:11px; justify-content:center; flex-wrap:wrap }

@media (prefers-reduced-motion:reduce){
  html{ scroll-behavior:auto }
  .rev{ transition:none; opacity:1; transform:none }
  #cue i{ animation:none } .pol .film{ transition:none; opacity:0 }
}
</style>

  if (!SALAMLAR.length) SALAMLAR = [

    "Tələsmə. Aşağı sürüşdür, hər şey öz vaxtında açılacaq."
  ];
  var MEKTUBLAR = split(MEKTUB, 12);
  if (!MEKTUBLAR.length) MEKTUBLAR = [
    "Burada məktub olacaq.",
    "*Sözlər səninkidir — mən sadəcə yerini hazırlamışam."
  ];
  var REQEMLER = split(REQEM, 6).map(function(x){
    var i = x.indexOf(":");
    return i < 0 ? [x, ""] : [x.slice(0, i).trim(), x.slice(i + 1).trim()];
  });

  /* ---------- doldur ---------- */
  document.title = AD + " — hekayə";
  $("kicker").textContent = KICKER;
  $("ad").textContent = AD;
  $("sub").textContent = ALT;
  ["c1","c2","c3","c4","c5"].forEach(function(c, i){
    var t = $(c + "t"); if (t) t.textContent = F[i];
  });
  $("c1t").textContent = F[0];

  var hello = $("hello");
  SALAMLAR.forEach(function(t){
    var p = document.createElement("p");
    p.className = "say rev"; p.textContent = t;
    hello.appendChild(p);
  });

  /* şəkillər — yoxdursa fəsil tamamilə çıxarılır */
  if (SEKILLER.length){
    var host = $("fotos");
    SEKILLER.slice(0, 8).forEach(function(s){
      var fig = document.createElement("figure");
      fig.className = "pol rev";
      var im = document.createElement("img");
      im.src = s[0]; im.alt = ""; im.loading = "lazy"; im.decoding = "async";
      var film = document.createElement("div"); film.className = "film";
      fig.appendChild(im); fig.appendChild(film);
      if (s[1]){
        var cap = document.createElement("figcaption");
        cap.textContent = s[1]; fig.appendChild(cap);
      }
      host.appendChild(fig);
    });
  } else {
    $("c2").remove(); $("fotosWrap").remove();
  }

  /* rəqəmlər — yoxdursa fəsil çıxarılır */
  if (REQEMLER.length){
    var nh = $("nums");
    REQEMLER.forEach(function(r){
      var d = document.createElement("div"); d.className = "num rev";
      var b = document.createElement("b");
      b.textContent = "0"; b.setAttribute("data-to", r[0]);
      var s = document.createElement("span"); s.textContent = r[1];
      d.appendChild(b); d.appendChild(s); nh.appendChild(d);
    });
  } else {
    $("c3").remove(); $("nums").parentNode.remove();
  }

  var lt = $("letter");
  MEKTUBLAR.forEach(function(t){
    var big = t.charAt(0) === "*";
    var p = document.createElement("p");
    p.className = "rev" + (big ? " big" : "");
    p.textContent = big ? t.slice(1).trim() : t;
    lt.appendChild(p);
  });

  if (ARZU) $("wish").textContent = ARZU; else { $("c5").remove(); $("wish").parentNode.remove(); }
  $("sign").textContent = IMZA ? "— " + IMZA : "";
  $("date").textContent = TARIX;

  if (TEL && /^\d{7,15}$/.test(TEL)){
    var WA = "https://wa.me/" + TEL;
    var rep = $("reply");
    rep.href = WA;
    rep.addEventListener("click", function(e){
      e.preventDefault();
      var w = null;
      try{ w = window.open(WA, "_blank", "noopener"); }catch(err){}
      if (!w){ try{ location.href = WA; }catch(err2){} }
    });
  } else {
    $("reply").style.display = "none";
  }

  /* ---------- görünəndə açılsın ---------- */
  var MOOD = {
    night:["#0B0D12", 0],
    deep: ["#0E1118", .35],
    warm: ["#1A1512", .7],
    gold: ["#221A12", 1]
  };
  var bg = $("bg"), glow = $("glow");

  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){
      if (!e.isIntersecting) return;
      var el = e.target;
      el.classList.add("in");
      var b = el.querySelector ? el.querySelector("b[data-to]") : null;
      if (el.tagName === "DIV" && el.classList.contains("num")) count(el.querySelector("b"));
      io.unobserve(el);
    });
  }, { rootMargin:"0px 0px -12% 0px", threshold:.15 });
  document.querySelectorAll(".rev").forEach(function(el){ io.observe(el); });

  var mio = new IntersectionObserver(function(es){
    es.forEach(function(e){
      if (!e.isIntersecting) return;
      var m = MOOD[e.target.getAttribute("data-mood")];
      if (!m) return;
      bg.style.background = m[0];
      glow.style.opacity = m[1];
    });
  }, { threshold:.4 });
  document.querySelectorAll("[data-mood]").forEach(function(el){ mio.observe(el); });

  function count(b){
    if (!b) return;
    var raw = b.getAttribute("data-to") || "";
    var to = parseInt(raw.replace(/\D/g, ""), 10);
    if (!isFinite(to)){ b.textContent = raw; return; }
    var suffix = raw.replace(/[\d\s]/g, "");
    if (reduce){ b.textContent = to + suffix; return; }
    var t0 = performance.now(), dur = 1400;
    (function tick(t){
      var k = Math.min(1, (t - t0) / dur);
      var e = 1 - Math.pow(1 - k, 3);
      b.textContent = Math.round(to * e) + suffix;
      if (k < 1) requestAnimationFrame(tick);
    })(t0);
  }

  /* ---------- oxuma zolağı, kursor ---------- */
  var bar = $("bar"), cue = $("cue");
  addEventListener("scroll", function(){
    var h = document.documentElement.scrollHeight - innerHeight;
    bar.style.width = (h > 0 ? (scrollY / h) * 100 : 0) + "%";
    if (cue) cue.style.opacity = scrollY > 40 ? "0" : "1";
  }, { passive:true });

  /* ---------- səs ---------- */
  var AC = null, master = null, el = null, started = false, muted = false;
  function audioOn(){
    if (started) return;
    started = true;
    if (MUSIQI){
      el = new Audio(MUSIQI);
      el.loop = true;
      try{
        AC = new (window.AudioContext || window.webkitAudioContext)();
        var src = AC.createMediaElementSource(el);
        master = AC.createGain(); master.gain.value = .0001;
        src.connect(master); master.connect(AC.destination);
        master.gain.exponentialRampToValueAtTime(.5, AC.currentTime + 3);
      }catch(e){ el.volume = .5; }
      el.play().catch(function(){});
      return;
    }
    /* fayl yoxdursa — sakit akkord, uzaqdan gələn kimi */
    try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return; }
    master = AC.createGain(); master.gain.value = .0001; master.connect(AC.destination);
    var lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900;
    lp.connect(master);
    [146.83, 220, 293.66, 369.99].forEach(function(f, i){
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.value = i === 0 ? .5 : .22;
      var lfo = AC.createOscillator(), lg = AC.createGain();
      lfo.frequency.value = .05 + i * .017; lg.gain.value = .12;
      lfo.connect(lg); lg.connect(g.gain); lfo.start();
      o.connect(g); g.connect(lp); o.start();
    });
    master.gain.exponentialRampToValueAtTime(.16, AC.currentTime + 5);
  }
  function setMute(m){
    muted = m;
    $("snd").classList.toggle("mute", m);
    if (el && !AC) el.muted = m;
    if (master && AC) master.gain.exponentialRampToValueAtTime(m ? .0001 : (MUSIQI ? .5 : .16), AC.currentTime + .4);
  }
  ["pointerdown","keydown","scroll"].forEach(function(ev){
    addEventListener(ev, function once(){
      removeEventListener(ev, once);
      if (!muted) audioOn();
    }, { once:true, passive:true });
  });
  $("snd").addEventListener("click", function(){
    if (!started){ audioOn(); setMute(false); return; }
    setMute(!muted);
  });

})();
</script>
</body>
</html>
