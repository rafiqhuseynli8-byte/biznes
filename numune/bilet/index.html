/* ============================================================
   Bir minik talonu. Çevirirsən — arxasında söz var.
   ============================================================ */
:root{
  --night:#101922;       /* aeroportun gecəsi */
  --card:#F7F2E8;        /* talonun kağızı */
  --card-2:#EDE6D8;      /* qopan hissə */
  --ink:#14202E;
  --ink-2:#5C6B7A;
  --ink-3:#93A0AC;
  --red:#C2452D;         /* möhür */
  --gold:#C9922F;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent }
html,body{ height:100%; margin:0 }
body{
  margin:0; color:var(--card);
  background:
    radial-gradient(90% 60% at 50% 0%, #1B2A38 0%, var(--night) 62%),
    var(--night);
  font-family:"Barlow Condensed",Impact,sans-serif;
  min-height:100%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:18px;
  padding:calc(env(safe-area-inset-top,0px) + 22px) 14px
          calc(env(safe-area-inset-bottom,0px) + 26px);
  user-select:none; overflow-x:hidden;
}

/* ---------- talon ---------- */
#scene{ width:min(430px,100%); perspective:1400px }
#pass{
  position:relative; width:100%; transform-style:preserve-3d;
  transition:transform .85s cubic-bezier(.3,.9,.3,1);
}
#pass.flip{ transform:rotateY(180deg) }
.face{
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:var(--card); color:var(--ink); border-radius:12px;
  box-shadow:0 30px 60px -24px rgba(0,0,0,.95);
  overflow:hidden;
}
.face.back{ position:absolute; inset:0; transform:rotateY(180deg) }

/* üst zolaq */
.strip{
  background:var(--ink); color:var(--card); padding:11px 15px;
  display:flex; justify-content:space-between; align-items:baseline;
  font-size:11.5px; letter-spacing:.22em; text-transform:uppercase;
}
.strip .co{ font-weight:600; letter-spacing:.14em; font-size:13px }

.body{ padding:17px 16px 14px }

/* haradan → haraya */
.route{ display:flex; align-items:center; gap:12px; margin-bottom:16px }
.route .pt{ flex:1; min-width:0 }
.route .lbl{
  font-size:10.5px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--ink-3); margin:0 0 3px;
}
.route .big{
  font-size:clamp(23px,7.4vw,34px); font-weight:600; letter-spacing:.02em;
  line-height:1.06; margin:0; text-transform:uppercase; text-wrap:balance;
}
.route .arrow{ flex:none; color:var(--red); font-size:22px; line-height:1 }

.rowline{ border:0; border-top:1px dashed #C6BEAC; margin:14px 0 }

/* xanalar */
.cells{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px }
.cell .lbl{
  font-size:10px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--ink-3); margin:0 0 3px;
}
.cell .val{
  font-family:"IBM Plex Mono",monospace; font-weight:500;
  font-size:clamp(14px,4.2vw,17px); margin:0; color:var(--ink);
}
.cell .val.red{ color:var(--red) }

/* qopan hissə */
.tear{
  position:relative; height:20px; background:var(--card);
  border-top:2px dashed #C6BEAC; margin-top:4px;
}
.tear::before,.tear::after{
  content:""; position:absolute; top:-11px; width:20px; height:20px;
  border-radius:50%; background:var(--night);
}
.tear::before{ left:-11px }
.tear::after{ right:-11px }

.stub{
  background:var(--card-2); padding:13px 16px 16px;
  display:flex; align-items:flex-end; justify-content:space-between; gap:14px;
}
.stub .who .lbl{ font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-3); margin:0 0 3px }
.stub .who .val{ font-size:clamp(17px,5vw,22px); font-weight:600; margin:0; text-transform:uppercase }
#bars{ display:flex; gap:1.6px; height:38px; align-items:flex-end; flex:none }
#bars i{ display:block; width:2px; background:var(--ink) }

/* möhür */
#stampZone{ position:relative; height:58px; margin-top:10px }
#stamp{
  position:absolute; right:2px; top:0; z-index:3;
  font-size:clamp(14px,4.2vw,17px); font-weight:600; letter-spacing:.14em;
  text-transform:uppercase; color:var(--red); border:3px solid var(--red);
  border-radius:5px; padding:7px 12px; transform:rotate(-12deg) scale(2.3);
  opacity:0; mix-blend-mode:multiply; pointer-events:none;
}
#stamp.on{ animation:slam .45s cubic-bezier(.2,1.5,.35,1) forwards }
@keyframes slam{
  0%{ opacity:0; transform:rotate(-12deg) scale(2.3) }
  62%{ opacity:.95; transform:rotate(-12deg) scale(.93) }
  100%{ opacity:.9; transform:rotate(-12deg) scale(1) }
}

/* arxa üz */
.back .body{ padding:22px 20px 24px; min-height:280px; display:flex; flex-direction:column; justify-content:center }
.back .kick{
  font-size:10.5px; letter-spacing:.24em; text-transform:uppercase;
  color:var(--red); margin:0 0 14px;
}
.back p.msg{
  font-family:"Lora",Georgia,serif; font-size:clamp(15.5px,4.4vw,17.5px);
  line-height:1.68; margin:0 0 1.1em; color:var(--ink);
}
.back .sign{
  font-family:"IBM Plex Mono",monospace; font-size:13px; letter-spacing:.08em;
  color:var(--ink-2); margin-top:14px;
}

/* düymələr */
#panel{ display:flex; gap:10px; width:min(430px,100%) }
.btn{
  flex:1; font-family:"Barlow Condensed",sans-serif; font-weight:600;
  font-size:14px; letter-spacing:.18em; text-transform:uppercase;
  text-align:center; text-decoration:none; cursor:pointer;
  padding:14px 16px; border-radius:9px;
  border:1px solid rgba(247,242,232,.28); background:transparent; color:var(--card);
}
.btn.solid{ background:var(--gold); border-color:var(--gold); color:#221803 }
.btn:focus-visible{ outline:3px solid var(--gold); outline-offset:3px }

#gate{
  position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:24px; padding:24px;
  background:radial-gradient(100% 70% at 50% 42%, #1B2A38 0%, #0A1119 78%);
  transition:opacity .5s ease;
}
#gate.off{ opacity:0; pointer-events:none }
#gate .lbl{ margin:0; font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--ink-3) }
#gate h1{
  margin:0; font-weight:600; font-size:clamp(30px,10vw,52px); letter-spacing:.03em;
  text-transform:uppercase; text-align:center; text-wrap:balance;
}
#go{
  font-family:"Barlow Condensed",sans-serif; font-weight:600; font-size:15px;
  letter-spacing:.24em; text-transform:uppercase; cursor:pointer;
  padding:16px 34px; border-radius:8px; border:0; background:var(--gold); color:#221803;
  box-shadow:0 0 46px -10px rgba(201,146,47,.85);
  animation:breathe 2.6s ease-in-out 4;
}
@keyframes breathe{ 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.05) } }

@media (prefers-reduced-motion:reduce){
  #pass{ transition:none } #go{ animation:none }
  #stamp.on{ animation:none; opacity:.9; transform:rotate(-12deg) scale(1) }
}
</style>
</head>
<body>

<div id="scene">
  <div id="pass">
    <div class="face front">
      <div class="strip"><span class="co" id="co">—</span><span id="cls">tək istiqamət</span></div>
      <div class="body">
        <div class="route">
          <div class="pt"><p class="lbl">haradan</p><p class="big" id="from">—</p></div>
          <div class="arrow" aria-hidden="true">✈</div>
          <div class="pt"><p class="lbl">haraya</p><p class="big" id="to">—</p></div>
        </div>
        <hr class="rowline">
        <div class="cells">
          <div class="cell"><p class="lbl">tarix</p><p class="val" id="date">—</p></div>
          <div class="cell"><p class="lbl">qapı</p><p class="val red" id="gate2">—</p></div>
          <div class="cell"><p class="lbl">yer</p><p class="val" id="seat">—</p></div>
        </div>
        <div id="stampZone"><div id="stamp">minik açıqdır</div></div>
      </div>
      <div class="tear"></div>
      <div class="stub">
        <div class="who"><p class="lbl">sərnişin</p><p class="val" id="pax">—</p></div>
        <div id="bars"></div>
      </div>
    </div>

    <div class="face back">
      <div class="strip"><span class="co">arxa üz</span><span id="code">—</span></div>
      <div class="body">
        <p class="kick">bort qeydi</p>
        <div id="msg"></div>
        <p class="sign" id="sign"></p>
      </div>
    </div>
  </div>
</div>

<div id="panel">
  <button class="btn solid" id="flip">çevir</button>
  <a class="btn" id="reply" href="#">cavab yaz</a>
</div>

<div id="gate">
  <p class="lbl">yer ayrılıb</p>
  <h1 id="gTitle">—</h1>
  <button id="go">bileti al</button>
</div>

<script>
(function(){
  "use strict";

  /* ══════════════════════════════════════════════════════════════
     DƏYİŞİR ELƏ LİNKDƏ — fayla toxunmaq lazım deyil.

       .../bilet/?ad=Leyla&haradan=Bu gün&haraya=Sənin yanına
       ...&vaxt=2026-09-01&qapi=B12&yer=1A&imza=Rafiq
       ...&mesaj=Birinci abzas|İkinci abzas&tel=994500000000

     ad       — sərnişinin adı
     haradan  — haradan
     haraya   — haraya
     vaxt     — tarix (2026-09-01) və ya öz sözün
     qapi     — qapı nömrəsi
     yer      — oturacaq
     mesaj    — arxa üzdəki söz, | ilə ayrılır
     imza     — kimdən
     tel      — WhatsApp nömrəsi
     ══════════════════════════════════════════════════════════════ */

  var Q = (function(){
    var q = new URLSearchParams(location.search);
    var h = new URLSearchParams(location.hash.replace(/^#/, ""));
    h.forEach(function(v, k){ if (!q.has(k)) q.set(k, v); });
    return q;
  })();
  function param(k, d, max){
    var v = Q.get(k);
    if (v === null) return d;
    v = v.trim();
    return v ? v.slice(0, max || 60) : d;
  }
  function upper(s){
    return String(s).replace(/i/g, "İ").replace(/ı/g, "I").toUpperCase();
  }
  var $ = function(id){ return document.getElementById(id); };

  var AD      = param("ad", "Rəşad", 26);
  var FROM    = param("haradan", "Bu gün", 22);
  var TO      = param("haraya", "Sənin yanına", 22);
  var VAXT    = param("vaxt", "", 24);
  var QAPI    = param("qapi", "", 8);
  var YER     = param("yer", "", 8);
  var IMZA    = param("imza", "", 26);
  var TEL     = param("tel", "", 15).replace(/\D/g, "");
  var RAW     = param("mesaj", "", 1000);

  var MSG = RAW
    ? RAW.split("|").map(function(x){ return x.trim(); }).filter(Boolean).slice(0, 5)
    : ["Bu bilet bir nəfərlikdir və qaytarılmır.",
       "Uçuş nə vaxt olacaq bilmirəm. Amma yer sənin adına ayrılıb və başqasına verilməyəcək."];

  /* addan törəyən sabit rəqəmlər — hər açılışda eyni qalsın */
  var seed = 0;
  for (var i = 0; i < AD.length; i++) seed = (seed * 31 + AD.charCodeAt(i)) & 0xffff;
  function rnd(){ seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

  $("gTitle").textContent = upper(AD);
  $("co").textContent = upper(AD) + " AIR";
  $("from").textContent = upper(FROM);
  $("to").textContent = upper(TO);
  $("pax").textContent = upper(AD);
  $("gate2").textContent = QAPI || ("B" + (10 + Math.floor(rnd() * 89)));
  $("seat").textContent = YER || ("1" + "ABCDEF".charAt(Math.floor(rnd() * 6)));

  if (VAXT && /^\d{4}-\d{2}-\d{2}$/.test(VAXT)){
    var AY = ["yan","fev","mar","apr","may","iyn","iyl","avq","sen","okt","noy","dek"];
    var p = VAXT.split("-");
    $("date").textContent = p[2] + " " + AY[parseInt(p[1], 10) - 1].toUpperCase();
  } else {
    $("date").textContent = VAXT ? upper(VAXT) : "AÇIQ";
  }

  var code = "";
  for (var k = 0; k < 6; k++) code += "ABCDEFGHJKLMNPQRSTUVXYZ23456789".charAt(Math.floor(rnd() * 31));
  $("code").textContent = code;

  var bars = $("bars");
  for (var b = 0; b < 34; b++){
    var el = document.createElement("i");
    el.style.height = (16 + Math.floor(rnd() * 22)) + "px";
    el.style.width = (rnd() > .68 ? 4 : 2) + "px";
    bars.appendChild(el);
  }

  var box = $("msg");
  MSG.forEach(function(t){
    var p = document.createElement("p");
    p.className = "msg"; p.textContent = t;
    box.appendChild(p);
  });
  $("sign").textContent = IMZA ? "— " + IMZA : "";

  if (TEL && /^\d{7,15}$/.test(TEL)){
    $("reply").href = "https://wa.me/" + TEL;
  } else {
    $("reply").style.display = "none";
  }

  /* ---------- səs ---------- */
  var AC = null, master = null;
  function initAudio(){
    if (AC) return;
    try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return; }
    master = AC.createGain(); master.gain.value = .8; master.connect(AC.destination);
  }
  function thud(vol){
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(155, AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(45, AC.currentTime + .13);
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + .3);
    o.connect(g); g.connect(master); o.start(); o.stop(AC.currentTime + .32);
  }
  /* aeroport siqnalı — üç not */
  function bong(){
    if (!AC) return;
    [523.25, 659.25, 784].forEach(function(f, i){
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = "sine"; o.frequency.value = f;
      var t0 = AC.currentTime + i * .19;
      g.gain.setValueAtTime(.0001, t0);
      g.gain.linearRampToValueAtTime(.1, t0 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + .7);
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + .75);
    });
  }
  function paper(){
    if (!AC) return;
    var n = Math.floor(AC.sampleRate * .32);
    var b2 = AC.createBuffer(1, n, AC.sampleRate), d = b2.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 1.6);
    var s = AC.createBufferSource(); s.buffer = b2;
    var f = AC.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 1800;
    var g = AC.createGain(); g.gain.value = .1;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  }

  $("go").addEventListener("click", function(){
    initAudio();
    if (AC && AC.state === "suspended") AC.resume();
    $("gate").classList.add("off");
    bong();
    setTimeout(function(){ $("stamp").classList.add("on"); thud(.36); }, 850);
  });

  $("flip").addEventListener("click", function(){
    var p = $("pass");
    var open = p.classList.toggle("flip");
    $("flip").textContent = open ? "geri çevir" : "çevir";
    paper();
  });
})();
</script>
</body>
</html>
