:root{
  --paper:#FFFDF8;
  --cream:#FBF3E6;
  --cream-2:#F4E8D5;
  --gold:#DFA22C;
  --gold-lit:#F7CB63;
  --wine:#7B1E3C;
  --wine-lit:#A83A5C;
  --coral:#F2704E;
  --mint:#3FB99D;
  --ink:#3A2B22;
  --ink-60:rgba(58,43,34,.60);
  --ink-35:rgba(58,43,34,.35);
  --line:rgba(58,43,34,.13);

  --pad:clamp(20px,5.6vw,36px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.22,.68,.32,1);
  --pop:cubic-bezier(.18,1.5,.32,1);
  --display:"Fraunces",Georgia,serif;
  --text:"Outfit","Segoe UI",system-ui,-apple-system,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
html{-webkit-text-size-adjust:100%;background:var(--paper)}

body{
  min-height:100%;
  font-family:var(--text);
  color:var(--ink);
  background:var(--paper);
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}

/* the room changes colour scene by scene */
.sky{
  position:fixed;
  inset:0;
  z-index:0;
  background:
    radial-gradient(95% 60% at 50% 0%, #FFFFFF 0%, transparent 62%),
    radial-gradient(80% 50% at 50% 100%, var(--cream) 0%, transparent 70%),
    var(--paper);
  transition:background 1.2s var(--ease);
}
.sky.dusk{
  background:
    radial-gradient(100% 62% at 50% 8%, #FFE7C4 0%, transparent 58%),
    radial-gradient(90% 60% at 50% 100%, #C9A7D8 0%, transparent 72%),
    linear-gradient(180deg,#FFD9A8 0%, #F6B79A 42%, #C9A7D8 100%);
}

#fx{position:fixed;inset:0;z-index:40;pointer-events:none}

/* ════════════ SCENES ════════════ */
.scene{
  position:fixed;
  inset:0;
  z-index:2;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(14px,2.6vh,24px);
  padding:calc(28px + env(safe-area-inset-top,0px)) var(--pad) calc(26px + var(--safe-b));
  text-align:center;
  touch-action:manipulation;
}
.scene.on{display:flex;animation:sceneIn .7s var(--ease) both}
.scene.off{animation:sceneOut .35s ease both}
@keyframes sceneIn{
  from{opacity:0;transform:translateY(20px) scale(.985)}
  to{opacity:1;transform:none}
}
@keyframes sceneOut{
  from{opacity:1;transform:none}
  to{opacity:0;transform:translateY(-14px) scale(.99)}
}

/* the step dots */
.steps{
  position:fixed;
  left:0;right:0;
  bottom:calc(14px + var(--safe-b));
  z-index:30;
  display:flex;
  justify-content:center;
  gap:7px;
  pointer-events:none;
}
.steps i{
  width:6px;height:6px;
  border-radius:50%;
  background:var(--ink-35);
  opacity:.35;
  transition:all .45s var(--ease);
}
.steps i.done{opacity:.55;background:var(--gold)}
.steps i.now{opacity:1;background:var(--wine);transform:scale(1.5)}

/* ── shared type ── */
.eyebrow{
  margin:0;
  font-size:clamp(.64rem,2.9vw,.74rem);
  font-weight:500;
  letter-spacing:.32em;
  text-indent:.32em;
  text-transform:uppercase;
  color:var(--gold);
}
.huge{
  margin:0;
  font-family:var(--display);
  font-weight:900;
  font-size:clamp(2.6rem,14vw,4.6rem);
  line-height:.98;
  letter-spacing:-.03em;
  color:var(--wine);
  text-wrap:balance;
}
.mid{
  margin:0;
  font-family:var(--display);
  font-weight:900;
  font-size:clamp(1.6rem,7.4vw,2.4rem);
  line-height:1.08;
  letter-spacing:-.02em;
  color:var(--ink);
  text-wrap:balance;
}
.lede{
  margin:0;
  max-width:22em;
  font-size:clamp(.92rem,3.9vw,1.02rem);
  font-weight:300;
  line-height:1.6;
  color:var(--ink-60);
}
.tap{
  margin:0;
  font-size:.72rem;
  font-weight:500;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:var(--gold);
  animation:blink 2.2s ease-in-out infinite;
}
@keyframes blink{50%{opacity:.4}}

.btn{
  appearance:none;-webkit-appearance:none;
  display:inline-flex;align-items:center;justify-content:center;
  min-height:52px;
  padding:14px 30px;
  border:0;
  border-radius:100px;
  background:var(--wine);
  color:#FFF6F0;
  font-family:var(--text);
  font-weight:500;
  font-size:.94rem;
  letter-spacing:.06em;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  box-shadow:0 14px 30px -14px rgba(123,30,60,.8);
  transition:transform .18s var(--ease);
  opacity:0;
  pointer-events:none;
}
.btn.on{opacity:1;pointer-events:auto;animation:fadeUp .6s var(--pop) both}
.btn:active{transform:scale(.97)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ════════════ 1 · BALLOON ════════════ */
.balloon{
  position:relative;
  width:clamp(140px,42vw,190px);
  cursor:pointer;
  animation:sway 5s ease-in-out infinite;
  touch-action:manipulation;
}
@keyframes sway{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-14px) rotate(2deg)}
}
.balloon .skin{
  position:relative;
  width:100%;
  aspect-ratio:1/1.19;
  border-radius:50% 50% 48% 48%;
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 34%),
    linear-gradient(158deg, var(--wine-lit) 0%, var(--wine) 62%, #5C1029 100%);
  box-shadow:0 24px 44px -20px rgba(123,30,60,.6);
}
.balloon .knot{
  position:absolute;
  left:50%;top:100%;
  width:14px;height:12px;
  margin-left:-7px;
  background:#5C1029;
  clip-path:polygon(50% 0,100% 100%,0 100%);
}
.balloon .string{
  position:absolute;
  left:50%;top:calc(100% + 10px);
  width:2px;height:clamp(70px,13vh,110px);
  margin-left:-1px;
  background:linear-gradient(180deg,var(--ink-35),transparent);
}
.balloon.pop{animation:popOut .28s ease forwards}
@keyframes popOut{
  0%{transform:scale(1)}
  45%{transform:scale(1.16)}
  100%{transform:scale(0);opacity:0}
}

/* ════════════ 2 · CLOCK ════════════ */
.clock{
  display:flex;
  flex-direction:column;
  gap:10px;
  width:min(100%,420px);
  padding:clamp(20px,5.4vw,28px);
  border:1px solid var(--line);
  border-radius:22px;
  background:rgba(255,255,255,.7);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
  box-shadow:0 22px 44px -30px rgba(58,43,34,.5);
}
.clock-big{
  margin:0;
  font-family:var(--display);
  font-weight:900;
  font-size:clamp(2.8rem,15vw,4.4rem);
  line-height:1;
  letter-spacing:-.04em;
  color:var(--wine);
  font-variant-numeric:tabular-nums;
}
.clock-cap{margin:0;font-size:.9rem;font-weight:300;color:var(--ink-60)}
.clock-live{
  margin:8px 0 0;
  padding-top:12px;
  border-top:1px solid var(--line);
  font-size:clamp(.88rem,3.7vw,1rem);
  font-weight:400;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.clock-live b{color:var(--gold);font-weight:600}

/* ════════════ 3 · CAKE ════════════ */
.cake-wrap{display:flex;flex-direction:column;align-items:center;width:min(100%,300px)}
.candles{display:flex;align-items:flex-end;justify-content:center;gap:clamp(20px,7vw,30px);margin-bottom:-2px}
.candle{
  appearance:none;-webkit-appearance:none;
  position:relative;
  width:11px;height:clamp(38px,11vw,46px);
  padding:0;border:0;border-radius:3px 3px 1px 1px;
  background:repeating-linear-gradient(-38deg,#FFF 0 5px,var(--coral) 5px 10px);
  cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.candle::after{
  content:"";position:absolute;left:50%;top:-28px;
  width:calc(100% + clamp(20px,7vw,30px));height:calc(100% + 38px);
  transform:translateX(-50%);
}
.wick{position:absolute;left:50%;top:-5px;width:2px;height:6px;margin-left:-1px;border-radius:1px;background:#6B4A31}
.flame{
  position:absolute;left:50%;top:-24px;
  width:14px;height:21px;margin-left:-7px;
  border-radius:50% 50% 45% 45% / 62% 62% 38% 38%;
  background:radial-gradient(ellipse at 50% 78%, #FFF6D2 0%, var(--gold-lit) 38%, var(--coral) 82%, rgba(242,112,78,0) 100%);
  box-shadow:0 0 20px 6px rgba(247,203,99,.5);
  transform-origin:50% 100%;
  animation:flicker 1.1s ease-in-out infinite alternate;
}
@keyframes flicker{
  0%{transform:scale(1) rotate(-2.5deg);opacity:.94}
  100%{transform:scale(.94,1.07) rotate(2.5deg);opacity:.9}
}
.candle.out .flame{animation:none;opacity:0;transform:scale(.2);transition:all .18s var(--ease)}
.smoke{position:absolute;left:50%;top:-22px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:rgba(120,100,88,.34);opacity:0}
.candle.out .smoke{animation:puff 1.5s var(--ease) forwards}
@keyframes puff{
  0%{opacity:.55;transform:translate(0,0) scale(.5)}
  100%{opacity:0;transform:translate(5px,-58px) scale(2.4)}
}
.cake{position:relative;width:100%;filter:drop-shadow(0 16px 24px rgba(120,80,50,.2))}
.icing{position:relative;height:clamp(30px,8.4vw,38px);border-radius:12px 12px 4px 4px;background:linear-gradient(180deg,#FFFDF8,var(--cream));z-index:2}
.icing::after{
  content:"";position:absolute;left:0;right:0;bottom:-11px;height:22px;
  background:radial-gradient(circle at 13px 0, var(--cream) 12px, rgba(0,0,0,0) 13px) repeat-x;
  background-size:26px 22px;
}
.layer-a{position:relative;height:clamp(34px,9vw,42px);background:linear-gradient(180deg,#F0D3B0,#E3BC90);z-index:1}
.layer-b{height:clamp(26px,7vw,32px);margin:0 -6px;border-radius:0 0 10px 10px;background:linear-gradient(180deg,#E3BC90,#D2A473)}
.layer-a::before,.layer-a::after{
  content:"";position:absolute;left:8%;right:8%;height:6px;
  background:
    radial-gradient(circle at 6px 3px, var(--wine) 2.4px, transparent 3px) repeat-x,
    radial-gradient(circle at 20px 3px, var(--gold) 2.4px, transparent 3px) repeat-x;
  background-size:34px 6px,34px 6px;opacity:.9;
}
.layer-a::before{top:9px}
.layer-a::after{top:23px;transform:translateX(11px)}
.plate{width:112%;height:9px;margin:0 -6%;border-radius:0 0 60px 60px;background:linear-gradient(180deg,#F3E3D0,#E4CFB6)}

/* ════════════ 4 · GIFTS ════════════ */
.gifts{display:flex;justify-content:center;gap:clamp(12px,4vw,20px);width:100%}
.gbox{
  appearance:none;-webkit-appearance:none;
  position:relative;
  width:clamp(72px,22vw,92px);
  aspect-ratio:1/1.06;
  padding:0;border:0;background:none;
  cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:transform .2s var(--ease);
}
.gbox:active{transform:scale(.96)}
.gbox .gb{
  position:absolute;left:0;right:0;bottom:0;height:74%;
  border-radius:4px 4px 6px 6px;
  box-shadow:0 12px 24px -12px rgba(58,43,34,.6), inset 0 1px 0 rgba(255,255,255,.2);
}
.gbox .gl{
  position:absolute;left:-7%;right:-7%;top:12%;height:22%;
  border-radius:5px;
  box-shadow:0 8px 16px -8px rgba(58,43,34,.5), inset 0 1px 0 rgba(255,255,255,.25);
  transform-origin:50% 100%;
  transition:transform .55s var(--pop), opacity .55s var(--ease);
}
.gbox .gr{
  position:absolute;left:50%;top:12%;bottom:0;width:16%;margin-left:-8%;
  background:linear-gradient(90deg,rgba(255,255,255,.55),rgba(255,255,255,.8),rgba(255,255,255,.55));
  opacity:.85;
}
.gbox.opened .gl{transform:translateY(-46px) rotate(-22deg);opacity:0}
.gbox.opened{opacity:.45;pointer-events:none}
.gbox .num{
  position:absolute;left:0;right:0;bottom:-24px;
  font-size:.68rem;font-weight:500;letter-spacing:.2em;color:var(--ink-35);
}

.note{
  min-height:5.6em;
  display:flex;align-items:center;justify-content:center;
  width:min(100%,420px);
  padding:clamp(16px,4.4vw,22px);
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(255,255,255,.72);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
}
.note p{
  margin:0;
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(1rem,4.4vw,1.2rem);
  line-height:1.45;
  color:var(--ink);
  text-wrap:balance;
}
.note p.empty{font-family:var(--text);font-weight:300;font-size:.94rem;color:var(--ink-35)}
.note.flash{animation:noteIn .5s var(--pop)}
@keyframes noteIn{
  from{opacity:0;transform:translateY(12px) scale(.97)}
  to{opacity:1;transform:none}
}

/* ════════════ 5 · SKY ════════════ */
.sky-scene .huge{color:#FFFFFF;text-shadow:0 4px 30px rgba(120,60,40,.35)}
.sky-scene .lede{color:rgba(58,30,24,.72)}
.sky-scene .eyebrow{color:#FFF3D6}
.sky-scene .tap{color:#FFF3D6}
.sky-scene .btn{background:#FFFFFF;color:var(--wine)}

/* ════════════ 6 · LETTER ════════════ */
.letter{
  width:min(100%,460px);
  max-height:78svh;
  overflow-y:auto;
  padding:clamp(24px,6vw,34px);
  border:1px solid var(--line);
  border-radius:22px;
  background:linear-gradient(160deg,#FFFFFF,var(--cream));
  box-shadow:0 26px 52px -32px rgba(58,43,34,.55);
  text-align:left;
}
.letter p{
  margin:0 0 13px;
  font-size:clamp(.98rem,4.1vw,1.06rem);
  font-weight:300;
  line-height:1.72;
  color:var(--ink);
}
.letter p:last-of-type{margin-bottom:0}
.letter .first{
  font-family:var(--display);
  font-weight:900;
  font-size:clamp(1.4rem,6vw,1.9rem);
  line-height:1.16;
  color:var(--wine);
  margin-bottom:16px;
}
.letter .sign{
  margin-top:20px;padding-top:15px;
  border-top:1px solid var(--line);
  font-family:var(--display);font-style:italic;
  font-size:1.06rem;color:var(--gold);text-align:right;
}

:focus-visible{outline:2.5px solid var(--wine);outline-offset:4px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
}
</style>
</head>
<body>

<div class="sky" id="sky" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<!-- 1 · balloon -->
<section class="scene on" id="s1">
  <p class="eyebrow" id="s1eye"></p>
  <div class="balloon" id="balloon" role="button" tabindex="0" aria-label="Şarı partlat">
    <div class="skin"></div><div class="knot"></div><div class="string"></div>
  </div>
  <p class="tap" id="s1tap">şara toxun</p>
</section>

<!-- 2 · name -->
<section class="scene" id="s2">
  <p class="eyebrow">Bu gün</p>
  <h1 class="huge" id="theName"></h1>
  <p class="lede" id="ageLine"></p>
  <button class="btn" id="b2" type="button">Növbəti</button>
</section>

<!-- 3 · clock -->
<section class="scene" id="s3">
  <p class="eyebrow">Nə qədər vaxt keçib</p>
  <div class="clock">
    <p class="clock-big" id="days">0</p>
    <p class="clock-cap">gün — bu dünyada</p>
    <p class="clock-live" id="live">—</p>
  </div>
  <p class="lede">Saniyələr indi, sən baxarkən keçir.</p>
  <button class="btn" id="b3" type="button">Növbəti</button>
</section>

<!-- 4 · cake -->
<section class="scene" id="s4">
  <p class="eyebrow">Şamlar</p>
  <div class="cake-wrap">
    <div class="candles" id="candles" role="group" aria-label="Şamlar"></div>
    <div class="cake">
      <div class="icing"></div><div class="layer-a"></div>
      <div class="layer-b"></div><div class="plate"></div>
    </div>
  </div>
  <p class="tap" id="s4tap">şamları söndür</p>
  <button class="btn" id="b4" type="button">Növbəti</button>
</section>

<!-- 5 · gifts -->
<section class="scene" id="s5">
  <p class="eyebrow">Üç hədiyyə</p>
  <div class="gifts" id="gifts"></div>
  <div class="note" id="note"><p class="empty">Birini aç</p></div>
  <button class="btn" id="b5" type="button">Növbəti</button>
</section>

<!-- 6 · sky -->
<section class="scene sky-scene" id="s6">
  <p class="eyebrow">Göy üzü</p>
  <h2 class="huge" id="skyName"></h2>
  <p class="lede">Ekrana toxun.</p>
  <p class="tap" id="s6tap">toxun</p>
  <button class="btn" id="b6" type="button">Sonuncu söz</button>
</section>

<!-- 7 · letter -->
<section class="scene" id="s7">
  <div class="letter" id="letter"></div>
</section>

<div class="steps" id="steps" aria-hidden="true"></div>

<script>
(function(){
  "use strict";

  /* ══════════════════════════════════════════════════════════════
     МЕНЯЕТСЯ ПРЯМО В ССЫЛКЕ — файл трогать не надо.

       .../?ad=Leyla&dt=2004-05-17&imza=Ad

     ad   — имя        dt   — дата рождения (год-месяц-день)
     yas  — возраст, если не хочешь давать дату
     imza — подпись    mesaj — своё письмо, абзацы через |
     ══════════════════════════════════════════════════════════════ */

  var AD   = "Turan";
  var DT   = "";
  var YAS  = 0;
  var IMZA = "";
  var MESAJ = [
    "Bura qədər hər şey oyun idi. Bundan sonrası yox.",
    "Bunu ona görə düzəltdim ki, açanda gözlənilməz olsun. Bir də ona görə ki, bəzi şeyləri üzbəüz deməyi bacarmıram.",
    "Burda böyük söz yoxdur. Sadəcə istədim ki, bir dəfə də olsa, kimsə sənə bunu desin.",
    "Bu il sənin olsun."
  ];
  var HEDIYYE = [
    "Səbrin. Onu haradan tapdığını başa düşmürəm.",
    "Sakitliyin. Bəzi adamlar üçün adi, sənin üçün adət.",
    "Söhbətin bitməməsi. Mövzu qurtaranda da qurtarmır."
  ];

  /* ══════════════════ дальше ничего менять не нужно ══════════════ */

  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  /* Parametr həm ?-dən, həm #-dən oxunur. Bəzi yerlər ünvandan ?-i
     kəsir, # isə heç vaxt kəsilmir — ona görə ikisi də işləyir. */
  var Q = (function(){
    var q = new URLSearchParams(location.search);
    var h = new URLSearchParams(location.hash.replace(/^#/, ""));
    h.forEach(function(v, k){ if (!q.has(k)) q.set(k, v); });
    return q;
  })();
  function q(k, d){ var v = Q.get(k); return (v === null || v.trim() === "") ? d : v.trim(); }

  AD   = q("ad", AD).slice(0, 26);
  IMZA = q("imza", IMZA).slice(0, 40);
  DT   = q("dt", DT);
  var yr = parseInt(q("yas", YAS), 10);
  YAS = (isFinite(yr) && yr > 0 && yr < 130) ? yr : 0;

  var mRaw = Q.get("mesaj");
  if (mRaw && mRaw.trim()){
    MESAJ = mRaw.split("|").map(function(s){return s.trim();}).filter(Boolean)
                .slice(0,8).map(function(s){return s.slice(0,320);});
  }
  var hRaw = Q.get("hediyye");
  if (hRaw && hRaw.trim()){
    HEDIYYE = hRaw.split("|").map(function(s){return s.trim();}).filter(Boolean)
                  .slice(0,3).map(function(s){return s.slice(0,220);});
  }

  var birth = null, mm = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(DT);
  if (mm){
    var bd = new Date(+mm[1], +mm[2]-1, +mm[3]);
    if (bd.getFullYear() === +mm[1]) birth = bd;
  }
  if (!YAS && birth){
    var n0 = new Date();
    YAS = n0.getFullYear() - birth.getFullYear();
    var before = (n0.getMonth() < birth.getMonth()) ||
                 (n0.getMonth() === birth.getMonth() && n0.getDate() < birth.getDate());
    if (before) YAS += 0;      /* the page is written for the day itself */
  }

  var $ = function(s){ return document.querySelector(s); };
  function fmt(n){ return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
  function pad(n){ return (n < 10 ? "0" : "") + n; }

  document.title = AD + " — sənin üçün";
  $("#s1eye").textContent = AD + " üçün";
  $("#theName").textContent = AD;
  $("#skyName").textContent = "Ad günün mübarək";
  $("#ageLine").textContent = YAS > 0 ? YAS + " yaşın mübarək" : "Ad günün mübarək";

  var letter = $("#letter");
  for (var i = 0; i < MESAJ.length; i++){
    var p = document.createElement("p");
    if (i === 0) p.className = "first";
    p.textContent = MESAJ[i];
    letter.appendChild(p);
  }
  if (IMZA){
    var sg = document.createElement("p");
    sg.className = "sign";
    sg.textContent = "— " + IMZA;
    letter.appendChild(sg);
  }

  /* ══════════════ SCENES ══════════════ */
  var ORDER = ["s1","s2","s3","s4","s5","s6","s7"];
  var at = 0;

  var stepsBox = $("#steps");
  ORDER.forEach(function(){ stepsBox.appendChild(document.createElement("i")); });
  function paintSteps(){
    var dots = stepsBox.children;
    for (var i = 0; i < dots.length; i++){
      dots[i].className = i < at ? "done" : (i === at ? "now" : "");
    }
  }
  paintSteps();

  function go(idx){
    if (idx === at || idx >= ORDER.length) return;
    var cur = document.getElementById(ORDER[at]);
    var nxt = document.getElementById(ORDER[idx]);
    at = idx;
    paintSteps();

    function show(){
      cur.classList.remove("on","off");
      nxt.classList.add("on");
      if (ORDER[at] === "s3") startClock();
      if (ORDER[at] === "s6") toDusk();
    }
    if (reduce){ show(); return; }
    cur.classList.add("off");
    window.setTimeout(show, 320);
  }
  function next(){ go(at + 1); }

  $("#b2").addEventListener("click", next);
  $("#b3").addEventListener("click", next);
  $("#b4").addEventListener("click", next);
  $("#b5").addEventListener("click", next);
  $("#b6").addEventListener("click", next);
  $("#b2").classList.add("on");
  $("#b3").classList.add("on");

  /* ══════════════ 1 · balloon ══════════════ */
  var balloon = $("#balloon");
  var popped = false;
  function popIt(){
    if (popped) return;
    popped = true;
    var r = balloon.getBoundingClientRect();
    balloon.classList.add("pop");
    $("#s1tap").style.opacity = "0";
    shred(r.left + r.width/2, r.top + r.height/2);
    window.setTimeout(next, reduce ? 0 : 380);
  }
  balloon.addEventListener("click", popIt);
  balloon.addEventListener("keydown", function(e){
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); popIt(); }
  });

  /* ══════════════ 3 · clock ══════════════ */
  var clockRunning = false;
  function startClock(){
    if (clockRunning || !birth) return;
    clockRunning = true;
    var total = Math.floor((new Date() - birth) / 864e5);
    countUp($("#days"), total, reduce ? 0 : 1600);
    (function tickTime(){
      var t = new Date() - birth;
      var d = Math.floor(t / 864e5);
      var rest = t - d * 864e5;
      var hh = Math.floor(rest / 36e5);
      var mi = Math.floor((rest - hh*36e5) / 6e4);
      var ss = Math.floor((rest - hh*36e5 - mi*6e4) / 1000);
      $("#live").innerHTML = "";
      var b = document.createElement("b");
      b.textContent = pad(hh) + ":" + pad(mi) + ":" + pad(ss);
      $("#live").appendChild(document.createTextNode("və bu gün "));
      $("#live").appendChild(b);
      window.setTimeout(tickTime, 1000);
    })();
  }
  function countUp(node, to, ms){
    if (!ms){ node.textContent = fmt(to); return; }
    var t0 = null;
    (function step(t){
      if (t0 === null) t0 = t;
      var k = Math.min(1, (t - t0) / ms);
      node.textContent = fmt(to * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(step);
    })(performance.now());
  }

  /* ══════════════ 4 · cake ══════════════ */
  var box = $("#candles"), left = 5;
  for (var c = 0; c < 5; c++){
    var b4 = document.createElement("button");
    b4.className = "candle";
    b4.type = "button";
    b4.setAttribute("aria-label", "Şamı söndür");
    b4.innerHTML = '<span class="wick"></span><span class="smoke"></span><span class="flame"></span>';
    box.appendChild(b4);
  }
  box.addEventListener("click", function(e){
    var t = e.target.closest ? e.target.closest(".candle") : null;
    if (!t || t.classList.contains("out")) return;
    t.classList.add("out");
    t.setAttribute("aria-label", "Söndürülüb");
    left--;
    if (left === 0){
      $("#s4tap").textContent = "arzunu tut";
      var r = box.getBoundingClientRect();
      window.setTimeout(function(){
        confetti(r.left + r.width/2, r.top, 90);
        $("#b4").classList.add("on");
      }, reduce ? 0 : 700);
    } else {
      $("#s4tap").textContent = left + " şam qaldı";
    }
  });

  /* ══════════════ 5 · gifts ══════════════ */
  var giftsBox = $("#gifts"), note = $("#note"), openedCount = 0;
  var TONES = [
    ["#7B1E3C","#A83A5C"],
    ["#DFA22C","#F7CB63"],
    ["#3FB99D","#66D6BC"]
  ];
  HEDIYYE.forEach(function(text, i){
    var g = document.createElement("button");
    g.className = "gbox";
    g.type = "button";
    g.setAttribute("aria-label", (i+1) + "-ci hədiyyəni aç");
    var body = document.createElement("span"); body.className = "gb";
    body.style.background = "linear-gradient(160deg," + TONES[i][1] + "," + TONES[i][0] + ")";
    var lid = document.createElement("span"); lid.className = "gl";
    lid.style.background = "linear-gradient(160deg," + TONES[i][1] + "," + TONES[i][0] + ")";
    var rib = document.createElement("span"); rib.className = "gr";
    var num = document.createElement("span"); num.className = "num"; num.textContent = String(i+1);
    g.appendChild(body); g.appendChild(rib); g.appendChild(lid); g.appendChild(num);
    g.addEventListener("click", function(){
      if (g.classList.contains("opened")) return;
      g.classList.add("opened");
      openedCount++;
      note.innerHTML = "";
      var np = document.createElement("p");
      np.textContent = text;
      note.appendChild(np);
      note.classList.remove("flash"); void note.offsetWidth; note.classList.add("flash");
      var r = g.getBoundingClientRect();
      confetti(r.left + r.width/2, r.top + r.height*0.3, 34);
      if (openedCount >= HEDIYYE.length) $("#b5").classList.add("on");
    });
    giftsBox.appendChild(g);
  });

  /* ══════════════ 6 · sky ══════════════ */
  function toDusk(){ $("#sky").classList.add("dusk"); }
  var s6 = $("#s6"), shots = 0;
  s6.addEventListener("click", function(e){
    if (e.target.closest(".btn")) return;
    rocket();
    if (++shots >= 2) $("#b6").classList.add("on");
  });

  /* ══════════════ CANVAS ══════════════ */
  var cv = $("#fx"), ctx = cv.getContext("2d");
  var parts = [], raf = null, W = 0, H = 0;
  var PARTY = ["#7B1E3C","#DFA22C","#F7CB63","#F2704E","#3FB99D","#FFFFFF"];

  function size(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W*dpr); cv.height = Math.floor(H*dpr);
    cv.style.width = W+"px"; cv.style.height = H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  size();
  window.addEventListener("resize", size);

  function push(o){ parts.push(o); if (!raf) raf = requestAnimationFrame(tick); }

  function confetti(x, y, n){
    if (reduce) return;
    for (var i = 0; i < n; i++){
      var a = Math.random()*Math.PI*2, sp = 2.5 + Math.random()*9;
      push({ kind:"c", x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-5,
             w:4+Math.random()*7, h:6+Math.random()*8,
             rot:Math.random()*6.3, vrot:(Math.random()-.5)*.3,
             c:PARTY[(Math.random()*PARTY.length)|0], life:1 });
    }
  }
  /* balloon skin flying apart */
  function shred(x, y){
    if (reduce) return;
    for (var i = 0; i < 26; i++){
      var a = Math.random()*Math.PI*2, sp = 5+Math.random()*11;
      push({ kind:"c", x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-3,
             w:6+Math.random()*11, h:4+Math.random()*7,
             rot:Math.random()*6.3, vrot:(Math.random()-.5)*.5,
             c:(Math.random()<.7?"#7B1E3C":"#A83A5C"), life:1 });
    }
    confetti(x, y, 80);
  }
  function rocket(){
    if (reduce){ return; }
    var x = W*(0.16+Math.random()*0.68);
    push({ kind:"r", x:x, y:H+8, vx:(Math.random()-.5)*0.8, vy:-(14+Math.random()*4),
           r:2, g:0.07, c:"#FFF3D6", life:1,
           burstAt:H*(0.14+Math.random()*0.24),
           color:PARTY[(Math.random()*PARTY.length)|0] });
  }
  function burstAt(x, y, color){
    var n = 70+((Math.random()*36)|0), ring = 4+Math.random()*4;
    for (var i = 0; i < n; i++){
      var a = (i/n)*Math.PI*2 + Math.random()*0.12, sp = ring*(0.6+Math.random()*0.65);
      push({ kind:"s", x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
             r:1.5+Math.random()*1.6, g:0.05, c:color, life:1 });
    }
  }

  function tick(){
    ctx.clearRect(0,0,W,H);
    for (var i = parts.length-1; i >= 0; i--){
      var p = parts[i];

      if (p.kind === "c"){
        p.vy += .22; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.rot += p.vrot;
        if (p.y > H*0.62) p.life -= .012;
        if (p.y > H+50 || p.life <= 0){ parts.splice(i,1); continue; }
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        ctx.globalAlpha = Math.max(0,Math.min(1,p.life));
        ctx.fillStyle = p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
        ctx.restore();
        continue;
      }

      p.vy += p.g; p.vx *= .987; p.vy *= .987; p.x += p.vx; p.y += p.vy;

      if (p.kind === "r"){
        if (p.vy >= 0 || p.y <= p.burstAt){ burstAt(p.x,p.y,p.color); parts.splice(i,1); continue; }
      } else {
        p.life -= .012;
        if (p.life <= 0 || p.y > H+50){ parts.splice(i,1); continue; }
      }
      ctx.globalAlpha = Math.max(0,Math.min(1,p.life));
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (parts.length) raf = requestAnimationFrame(tick);
    else { ctx.clearRect(0,0,W,H); raf = null; }
  }

})();
</script>
