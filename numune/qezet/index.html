/* ============================================================
   Bir qəzetin birinci səhifəsi. Kağız saralıb, mürəkkəb bir az
   sürüşüb. Şəkil yoxdur: fotonun yerində boş çərçivə var, çünki
   çəkə bilməyiblər.
   ============================================================ */
:root{
  --paper:#E9E3D6;        /* qəzet kağızı */
  --paper-d:#DED7C7;      /* qatlanan yer */
  --ink:#17150F;          /* qara mürəkkəb */
  --ink-2:#4A4639;        /* solğun mətn */
  --ink-3:#7C7565;        /* imzalar, tarix */
  --red:#A32B22;          /* birinci səhifənin qırmızısı */
  --rule:#B9B1A0;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent }
html{ background:#1A1814 }
body{
  margin:0; background:#1A1814; color:var(--ink);
  font-family:"Lora",Georgia,serif;
  min-height:100vh; display:flex; justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 12px
          calc(env(safe-area-inset-bottom,0px) + 36px);
}

#sheet{
  width:min(560px,100%); background:var(--paper); color:var(--ink);
  padding:22px 20px 26px; position:relative;
  box-shadow:0 30px 70px -22px rgba(0,0,0,.9);
  /* kağızın dənəsi və saralması */
  background-image:
    radial-gradient(90% 60% at 20% 0%, rgba(255,252,240,.6), rgba(0,0,0,0) 60%),
    radial-gradient(80% 60% at 90% 100%, rgba(120,100,60,.10), rgba(0,0,0,0) 55%);
  transform-origin:50% 0%;
}
#sheet.drop{ animation:drop .8s cubic-bezier(.2,1.05,.35,1) both }
@keyframes drop{
  0%{ opacity:0; transform:translateY(-26px) rotate(-1.4deg) scale(1.03) }
  60%{ opacity:1; transform:translateY(4px) rotate(.4deg) scale(1) }
  100%{ opacity:1; transform:none }
}
/* qatlanma xətti */
#sheet::before{
  content:""; position:absolute; left:0; right:0; top:47%; height:16px;
  background:linear-gradient(180deg, rgba(0,0,0,0), rgba(90,80,55,.11) 45%, rgba(0,0,0,0));
  pointer-events:none;
}

/* ---------- başlıq ---------- */
.top{
  display:flex; justify-content:space-between; align-items:baseline;
  font-family:"Oswald",sans-serif; font-size:10.5px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--ink-3); padding-bottom:7px;
}
.hr{ border:0; border-top:2px solid var(--ink); margin:0 }
.hr.thin{ border-top:1px solid var(--rule) }
.hr.dbl{ border-top:4px double var(--ink); margin:9px 0 }

#masthead{
  font-family:"Playfair Display",Georgia,serif; font-weight:900;
  font-size:clamp(30px,10.5vw,58px); line-height:1; text-align:center;
  letter-spacing:-.015em; margin:10px 0 8px; text-transform:uppercase;
  /* mürəkkəb bir az sürüşüb */
  text-shadow:.7px .5px 0 rgba(163,43,34,.22);
}
#tagline{
  text-align:center; font-family:"Oswald",sans-serif; font-size:10px;
  letter-spacing:.34em; text-transform:uppercase; color:var(--ink-3); margin:0 0 2px;
}

/* ---------- əsas xəbər ---------- */
#kicker{
  font-family:"Oswald",sans-serif; font-weight:600; font-size:11px;
  letter-spacing:.24em; text-transform:uppercase; color:var(--red);
  text-align:center; margin:15px 0 8px;
}
#head{
  font-family:"Playfair Display",Georgia,serif; font-weight:900;
  font-size:clamp(31px,9.4vw,54px); line-height:1.03; letter-spacing:-.02em;
  text-align:center; text-wrap:balance; margin:0 0 12px; text-transform:uppercase;
}
#deck{
  font-family:"Lora",Georgia,serif; font-style:italic; font-size:clamp(15px,4.3vw,18px);
  line-height:1.5; text-align:center; color:var(--ink-2); text-wrap:balance;
  margin:0 auto 16px; max-width:36em;
}
.byline{
  font-family:"Oswald",sans-serif; font-size:10.5px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--ink-3); text-align:center; margin:0 0 14px;
}

/* ---------- sütunlar ---------- */
#cols{ columns:2; column-gap:20px; column-rule:1px solid var(--rule); font-size:14px; line-height:1.62 }
#cols p{ margin:0 0 .85em; text-align:justify; hyphens:auto }
#cols p:first-of-type::first-letter{
  font-family:"Playfair Display",Georgia,serif; font-weight:900;
  float:left; font-size:3.05em; line-height:.82; padding:.06em .1em 0 0; color:var(--red);
}
@media (max-width:400px){ #cols{ columns:1 } }

/* ---------- foto yeri ---------- */
#photo{
  break-inside:avoid; margin:4px 0 14px; border:1px solid var(--ink);
  padding:8px; background:var(--paper-d);
}
#frame{
  height:132px; display:grid; place-items:center; text-align:center; padding:10px;
  /* rastr nöqtələri — çap kimi */
  background-image:radial-gradient(rgba(23,21,15,.30) 1px, rgba(0,0,0,0) 1.4px);
  background-size:5px 5px;
}
#frame span{
  font-family:"Oswald",sans-serif; font-size:11px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--ink-2); background:var(--paper-d);
  padding:5px 9px; text-wrap:balance;
}
#cap{
  font-size:11.5px; color:var(--ink-3); font-style:italic; margin:8px 2px 0; line-height:1.45;
}

/* ---------- yan qutular ---------- */
.box{ border:1px solid var(--ink); padding:11px 12px; margin:14px 0; break-inside:avoid }
.box h3{
  font-family:"Oswald",sans-serif; font-size:10.5px; font-weight:600;
  letter-spacing:.22em; text-transform:uppercase; margin:0 0 7px;
  padding-bottom:5px; border-bottom:1px solid var(--rule); color:var(--red);
}
.box p{ margin:0; font-size:13px; line-height:1.55 }
.box dl{ margin:0; font-size:13px; line-height:1.7 }
.box dt{ float:left; clear:left; font-weight:600; margin-right:.45em }
.box dd{ margin:0 0 0 0; color:var(--ink-2) }

#quote{
  border-top:2px solid var(--ink); border-bottom:2px solid var(--ink);
  padding:13px 4px; margin:16px 0; text-align:center;
}
#quote p{
  font-family:"Playfair Display",Georgia,serif; font-style:italic; font-weight:700;
  font-size:clamp(17px,5vw,22px); line-height:1.35; margin:0 0 6px; text-wrap:balance;
}
#quote small{
  font-family:"Oswald",sans-serif; font-size:10px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--ink-3);
}

/* ---------- elan ---------- */
#ad{
  border:3px double var(--ink); padding:14px 13px; margin:16px 0 0; text-align:center;
}
#ad .lbl{
  font-family:"Oswald",sans-serif; font-size:9.5px; letter-spacing:.28em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 8px;
}
#ad p{ margin:0 0 12px; font-size:14px; line-height:1.6 }
#ad .sign{ font-family:"Oswald",sans-serif; font-size:12px; letter-spacing:.16em; text-transform:uppercase }
.btn{
  display:inline-block; font-family:"Oswald",sans-serif; font-size:12.5px;
  letter-spacing:.16em; text-transform:uppercase; text-decoration:none;
  padding:11px 20px; border:1px solid var(--ink); color:var(--paper);
  background:var(--ink); cursor:pointer; margin-top:4px;
}
.btn:focus-visible{ outline:3px solid var(--red); outline-offset:3px }

.foot{
  display:flex; justify-content:space-between; font-family:"Oswald",sans-serif;
  font-size:9.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-3); margin-top:16px; padding-top:8px; border-top:1px solid var(--rule);
}

@media (prefers-reduced-motion:reduce){ #sheet.drop{ animation:none } }
</style>
</head>
<body>

<div id="sheet">
  <div class="top"><span id="issue">—</span><span id="price">qiyməti: bir gülüş</span></div>
  <hr class="hr">
  <p id="tagline">müstəqil nəşr · yalnız bir nüsxə</p>
  <h1 id="masthead">—</h1>
  <hr class="hr dbl">
  <div class="top"><span id="dateline">—</span><span id="edition">səhər buraxılışı</span></div>
  <hr class="hr thin">

  <p id="kicker">birinci səhifə</p>
  <h2 id="head">—</h2>
  <p id="deck">—</p>
  <p class="byline" id="byline">—</p>

  <div id="photo">
    <div id="frame"><span id="frameTxt">şəkil çəkilə bilmədi</span></div>
    <p id="cap">—</p>
  </div>

  <div id="cols"></div>

  <div id="quote">
    <p id="quoteTxt">—</p>
    <small id="quoteWho">—</small>
  </div>

  <div class="box">
    <h3>hava</h3>
    <dl id="weather"></dl>
  </div>

  <div class="box">
    <h3>qısa xəbərlər</h3>
    <p id="briefs">—</p>
  </div>

  <div id="ad">
    <p class="lbl">elan</p>
    <p id="adTxt">—</p>
    <p class="sign" id="adSign"></p>
    <a class="btn" id="reply" href="#">cavab yaz</a>
  </div>

  <div class="foot"><span>səhifə 1</span><span id="footRight">—</span></div>
</div>

<script>
(function(){
  "use strict";

  /* ══════════════════════════════════════════════════════════════
     DƏYİŞİR ELƏ LİNKDƏ — fayla toxunmaq lazım deyil.

       .../qezet/?ad=Leyla&sehir=Gəncə&imza=Rafiq
       ...&basliq=Şəhər bir nəfərə heyran qaldı
       ...&xeber=Birinci abzas|İkinci abzas
       ...&sitat=Mən heç nə etməmişəm&tel=994500000000

     ad      — kimin haqqındadır
     basliq  — öz başlığın (yoxdursa özü yaranır)
     xeber   — məqalənin abzasları, | ilə ayrılır
     sitat   — onun "dediyi" söz
     sehir   — şəhər
     imza    — kimdən
     tel     — WhatsApp nömrəsi
     ══════════════════════════════════════════════════════════════ */

  var Q = (function(){
    var q = new URLSearchParams(location.search);
    var h = new URLSearchParams(location.hash.replace(/^#/, ""));
    h.forEach(function(v, k){ if (!q.has(k)) q.set(k, v); });
    return q;
  })();
  function param(k, d, max){
    var v = Q.get(k);
    if (v === null) return d;
    v = v.trim();
    return v ? v.slice(0, max || 90) : d;
  }
  function upper(s){
    return String(s).replace(/i/g, "İ").replace(/ı/g, "I").toUpperCase();
  }
  var $ = function(id){ return document.getElementById(id); };

  var AD     = param("ad", "Turan", 26);
  var SEHIR  = param("sehir", "Bakı", 22);
  var IMZA   = param("imza", "", 26);
  var TEL    = param("tel", "", 15).replace(/\D/g, "");
  var BASLIQ = param("basliq", "", 90);
  var SITAT  = param("sitat", "", 140);
  var XEBER  = param("xeber", "", 1200);

  /* ---------- başlıq ---------- */
  $("masthead").textContent = upper(SEHIR) + " XƏBƏR";
  $("head").textContent = upper(BASLIQ || (AD + " yenə heç nə etmədi, hamı yenə heyran qaldı"));
  $("deck").textContent = "Şahidlər deyir ki, sadəcə keçib gedib. Şəhər hələ də özünə gələ bilmir.";
  $("byline").textContent = "müxbir: " + (IMZA || "adını demək istəməyən biri");
  $("frameTxt").textContent = upper("şəkil çəkilə bilmədi");
  $("cap").textContent = "Fotoqraf üç dəfə cəhd etdi. Hər dəfə " + AD + " gülürdü, kadr alınmadı.";

  var d = new Date();
  var AY = ["yanvar","fevral","mart","aprel","may","iyun",
            "iyul","avqust","sentyabr","oktyabr","noyabr","dekabr"];
  $("dateline").textContent = d.getDate() + " " + AY[d.getMonth()] + " " + d.getFullYear();
  $("footRight").textContent = SEHIR + " · " + d.getFullYear();

  /* nömrə — addan törəyir ki, hər açılışda eyni qalsın */
  var seed = 0;
  for (var i = 0; i < AD.length; i++) seed = (seed * 31 + AD.charCodeAt(i)) & 0xffff;
  $("issue").textContent = "nömrə " + (1000 + (seed % 8999));

  /* ---------- məqalə ---------- */
  var paras = XEBER
    ? XEBER.split("|").map(function(x){ return x.trim(); }).filter(Boolean)
    : [
        "Dünən axşam " + SEHIR + " küçələrində adi bir şey baş verdi: " + AD +
        " həmişəki kimi keçib getdi. Buna baxmayaraq, şəhərin yarısı işini dayandırdı.",
        "Yerli sakinlərdən biri hadisəni belə təsvir etdi: «Mən sadəcə pəncərədən baxırdım. Sonra nədənsə gülümsədim. Səbəbini indiyə qədər başa düşməmişəm».",
        "Mütəxəssislər vəziyyəti araşdırır. İlkin nəticə budur: səbəb tapılmayıb, amma hamı razıdır ki, belə də qalsın."
      ];
  var cols = $("cols");
  paras.slice(0, 6).forEach(function(t){
    var p = document.createElement("p");
    p.textContent = t;
    cols.appendChild(p);
  });

  /* ---------- sitat ---------- */
  $("quoteTxt").textContent = "«" + (SITAT || "Mən heç nə etməmişəm ki") + "»";
  $("quoteWho").textContent = AD + ", hadisə yerində";

  /* ---------- hava ---------- */
  var W = [
    ["Səhər", "aydın, gülüş ehtimalı yüksək"],
    ["Günorta", "isti, cavabsız mesaj yoxdur"],
    ["Axşam", "sakit, ürəyə yaxın"],
    ["Gecə", "ulduzlu — çoxu onun adına yazılıb"]
  ];
  var dl = $("weather");
  W.forEach(function(r){
    var dt = document.createElement("dt"); dt.textContent = r[0] + ":";
    var dd = document.createElement("dd"); dd.textContent = r[1];
    dl.appendChild(dt); dl.appendChild(dd);
  });

  $("briefs").textContent =
    "· Şəhər saatı bu gün iki dəqiqə gec işlədi — heç kim şikayət etmədi. " +
    "· Onun bir sözünə görə iki nəfər barışdı. " +
    "· Hava proqnozu ləğv edildi: artıq lazım deyil.";

  $("adTxt").textContent = "Axtarılır: " + AD + " kimi ikinci bir adam. " +
    "Tapılmayacağı əvvəlcədən məlumdur. Yenə də axtarırıq.";
  $("adSign").textContent = IMZA ? "— " + IMZA : "";

  if (TEL && /^\d{7,15}$/.test(TEL)){
    $("reply").href = "https://wa.me/" + TEL;
  } else {
    $("reply").style.display = "none";
  }

  requestAnimationFrame(function(){ $("sheet").classList.add("drop"); });
})();
</script>
</body>
</html>
