/* ============================================================
   Bir kitab. Səhifələri barmaqla çevirirsən. Sonuncu səhifədə
   söz var. Şəkil yoxdur — hər şey CSS-dir.
   ============================================================ */
:root{
  --room:#141A17;         /* masanın qaranlığı */
  --cloth:#26382F;        /* cildin parçası */
  --cloth-d:#1A2721;
  --foil:#C9A227;         /* qızılı yazı */
  --page:#F5EFE1;         /* səhifə */
  --page-2:#EDE5D3;       /* səhifənin kölgəsi */
  --ink:#2A2620;
  --ink-2:#6B6255;
  --ink-3:#9B927F;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent }
html,body{ height:100%; margin:0 }
body{
  margin:0; background:radial-gradient(110% 70% at 50% 0%, #1E2A24 0%, var(--room) 66%);
  color:var(--page); font-family:"EB Garamond",Georgia,serif;
  min-height:100%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:16px;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 14px
          calc(env(safe-area-inset-bottom,0px) + 20px);
  user-select:none; overflow-x:hidden;
}

#book{
  width:min(400px,100%); aspect-ratio:3/4.1; max-height:74vh;
  position:relative; perspective:1600px;
}

/* ---------- cild ---------- */
#cover{
  position:absolute; inset:0; z-index:40; border-radius:4px 9px 9px 4px;
  background:
    linear-gradient(100deg, var(--cloth-d) 0 16px, var(--cloth) 16px 100%);
  box-shadow:0 30px 60px -22px rgba(0,0,0,.95), inset -1px 0 0 rgba(0,0,0,.3);
  transform-origin:left center; transform-style:preserve-3d;
  transition:transform 1s cubic-bezier(.35,.85,.35,1), opacity .3s ease .7s;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:18px; padding:34px 26px; text-align:center;
  backface-visibility:hidden;
}
#cover.open{ transform:rotateY(-172deg); opacity:0; pointer-events:none }
#cover .rule{ width:52px; height:2px; background:var(--foil); opacity:.85 }
#cover .lbl{
  font-family:"Barlow Condensed",sans-serif; font-size:11px; letter-spacing:.34em;
  text-transform:uppercase; color:var(--foil); margin:0; opacity:.9;
}
#cover h1{
  font-family:"Cormorant Garamond",Georgia,serif; font-weight:600;
  font-size:clamp(32px,10vw,52px); line-height:1.06; margin:0; color:var(--foil);
  letter-spacing:.01em; text-wrap:balance;
}
#cover .sub{
  font-style:italic; font-size:15px; color:rgba(245,239,225,.62); margin:0; max-width:22em;
}

/* ---------- səhifələr ---------- */
.leaf{
  position:absolute; inset:0; border-radius:3px 8px 8px 3px;
  background:linear-gradient(96deg, var(--page-2) 0 10px, var(--page) 10px 100%);
  color:var(--ink); transform-origin:left center;
  transition:transform .85s cubic-bezier(.35,.85,.35,1), box-shadow .85s ease;
  backface-visibility:hidden;
  box-shadow:0 20px 40px -20px rgba(0,0,0,.8), inset 9px 0 14px -10px rgba(90,70,40,.4);
  padding:34px 26px 46px; display:flex; flex-direction:column;
  overflow:hidden;
}
.leaf.turned{ transform:rotateY(-172deg); box-shadow:none }
.leaf .no{
  font-family:"Barlow Condensed",sans-serif; font-size:10.5px; letter-spacing:.3em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 20px;
}
.leaf h2{
  font-family:"Cormorant Garamond",Georgia,serif; font-weight:600;
  font-size:clamp(23px,6.6vw,31px); line-height:1.16; margin:0 0 16px;
  color:var(--ink); text-wrap:balance;
}
.leaf p{
  font-size:clamp(15.5px,4.4vw,17.5px); line-height:1.72; margin:0 0 1em;
  color:var(--ink); max-width:30em;
}
.leaf p.first::first-letter{
  font-family:"Cormorant Garamond",Georgia,serif; font-weight:600;
  float:left; font-size:2.9em; line-height:.9; padding:.04em .05em 0 0; color:var(--ink-2);
}
.leaf .fin{
  margin-top:auto; font-family:"Barlow Condensed",sans-serif; font-size:11px;
  letter-spacing:.24em; text-transform:uppercase; color:var(--ink-3);
}
.leaf.last{ justify-content:center; text-align:center }
.leaf.last h2{ color:var(--ink) }
.leaf.last .sign{
  font-style:italic; font-size:16px; color:var(--ink-2); margin-top:8px;
}

#panel{ display:flex; gap:10px; width:min(400px,100%) }
.btn{
  flex:1; font-family:"Barlow Condensed",sans-serif; font-weight:500;
  font-size:13.5px; letter-spacing:.2em; text-transform:uppercase;
  text-align:center; text-decoration:none; cursor:pointer;
  padding:13px 14px; border-radius:8px;
  border:1px solid rgba(245,239,225,.26); background:transparent; color:var(--page);
}
.btn.solid{ background:var(--foil); border-color:var(--foil); color:#231B04 }
.btn[disabled]{ opacity:.35; cursor:default }
.btn:focus-visible{ outline:3px solid var(--foil); outline-offset:3px }
#panel.hide{ visibility:hidden }

#hint{
  font-family:"Barlow Condensed",sans-serif; font-size:11px; letter-spacing:.24em;
  text-transform:uppercase; color:rgba(245,239,225,.42); margin:0;
}

@media (prefers-reduced-motion:reduce){
  #cover,.leaf{ transition:none }
}
</style>
</head>
<body>

<div id="book">
  <div id="cover">
    <p class="lbl" id="cLbl">bir nüsxə</p>
    <div class="rule"></div>
    <h1 id="cTitle">—</h1>
    <p class="sub" id="cSub">—</p>
    <div class="rule"></div>
    <p class="lbl" id="cFoot">aç</p>
  </div>
</div>

<div id="panel" class="hide">
  <button class="btn" id="prev">geri</button>
  <button class="btn solid" id="next">çevir</button>
</div>

<p id="hint">cildə toxun</p>

<script>
(function(){
  "use strict";

  /* ══════════════════════════════════════════════════════════════
     DƏYİŞİR ELƏ LİNKDƏ — fayla toxunmaq lazım deyil.

       .../kitab/?ad=Leyla&imza=Rafiq&altbaslik=Qısa bir kitab
       ...&fesil=Başlanğıc::Birinci abzas::İkinci abzas|Sonra::Mətn
       ...&son=Sonuncu söz&tel=994500000000

     ad         — kitabın adı (adam)
     altbaslik  — cilddəki kiçik yazı
     fesil      — fəsillər: "başlıq::abzas::abzas", aralarında |
     son        — sonuncu səhifədəki söz
     imza       — kimdən
     ══════════════════════════════════════════════════════════════ */

  var Q = (function(){
    var q = new URLSearchParams(location.search);
    var h = new URLSearchParams(location.hash.replace(/^#/, ""));
    h.forEach(function(v, k){ if (!q.has(k)) q.set(k, v); });
    return q;
  })();
  function param(k, d, max){
    var v = Q.get(k);
    if (v === null) return d;
    v = v.trim();
    return v ? v.slice(0, max || 90) : d;
  }
  function upper(s){
    return String(s).replace(/i/g, "İ").replace(/ı/g, "I").toUpperCase();
  }
  var $ = function(id){ return document.getElementById(id); };
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  var AD   = param("ad", "Lalə", 26);
  var SUB  = param("altbaslik", "", 70);
  var IMZA = param("imza", "", 26);
  var SON  = param("son", "", 300);
  var RAW  = param("fesil", "", 2400);

  var CH = RAW
    ? RAW.split("|").map(function(x){
        var p = x.split("::").map(function(y){ return y.trim(); });
        return { t: p[0] || "", ps: p.slice(1).filter(Boolean) };
      }).filter(function(c){ return c.t || c.ps.length; }).slice(0, 8)
    : [
        { t:"Birinci fəsil", ps:[
          "Bu kitab qısadır, çünki uzun yazsam oxumazsan. Səni tanıyıram.",
          "Burda böyük hadisə yoxdur. Sadəcə bir neçə şey var ki, deməsəm, heç kim deməyəcək."
        ]},
        { t:"İkinci fəsil", ps:[
          "Sən adi şeyləri adi etmirsən. Bunu özün bilmirsən, ona görə də alınır."
        ]},
        { t:"Üçüncü fəsil", ps:[
          "Bir dəfə heç nə deməmişdin, mən isə hər şeyi başa düşmüşdüm. O gün yadımdadır."
        ]}
      ];

  $("cTitle").textContent = AD;
  $("cSub").textContent = SUB || "qısa bir kitab — bir nəfər üçün yazılıb";

  /* ---------- səhifələri qur ---------- */
  var book = $("book");
  var leaves = [];
  var total = CH.length + 1;

  function addLeaf(build, i){
    var leaf = document.createElement("div");
    leaf.className = "leaf";
    leaf.style.zIndex = String(30 - i);
    build(leaf);
    book.insertBefore(leaf, $("cover"));
    leaves.push(leaf);
  }

  CH.forEach(function(c, i){
    addLeaf(function(leaf){
      var no = document.createElement("p");
      no.className = "no";
      no.textContent = "səhifə " + (i + 1) + " / " + total;
      leaf.appendChild(no);

      if (c.t){
        var h2 = document.createElement("h2");
        h2.textContent = c.t;
        leaf.appendChild(h2);
      }
      c.ps.forEach(function(t, j){
        var p = document.createElement("p");
        if (j === 0) p.className = "first";
        p.textContent = t;
        leaf.appendChild(p);
      });
    }, i);
  });

  /* sonuncu səhifə */
  addLeaf(function(leaf){
    leaf.className = "leaf last";
    leaf.style.zIndex = String(30 - CH.length);
    var no = document.createElement("p");
    no.className = "no";
    no.textContent = "sonuncu səhifə";
    leaf.appendChild(no);
    var h2 = document.createElement("h2");
    h2.textContent = SON || "Kitab bitdi. Sən bitmədin.";
    leaf.appendChild(h2);
    if (IMZA){
      var s = document.createElement("p");
      s.className = "sign";
      s.textContent = "— " + IMZA;
      leaf.appendChild(s);
    }
  }, CH.length);

  /* ---------- səs ---------- */
  var AC = null, master = null;
  function initAudio(){
    if (AC) return;
    try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return; }
    master = AC.createGain(); master.gain.value = .8; master.connect(AC.destination);
  }
  function paper(vol){
    if (!AC) return;
    var n = Math.floor(AC.sampleRate * .42);
    var b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < n; i++){
      var env = Math.sin(Math.PI * i / n);
      d[i] = (Math.random() * 2 - 1) * env * env;
    }
    var s = AC.createBufferSource(); s.buffer = b;
    var f = AC.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 2400; f.Q.value = .6;
    var g = AC.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  }
  function thud(vol){
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(120, AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(40, AC.currentTime + .17);
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + .36);
    o.connect(g); g.connect(master); o.start(); o.stop(AC.currentTime + .38);
  }

  /* ---------- çevirmək ---------- */
  var at = 0;        /* neçə səhifə çevrilib */
  var opened = false;

  function sync(){
    leaves.forEach(function(l, i){ l.classList.toggle("turned", i < at); });
    $("prev").disabled = at === 0;
    $("next").disabled = at >= leaves.length - 1;
    $("next").textContent = at >= leaves.length - 1 ? "bitdi" : "çevir";
    $("hint").textContent = opened
      ? (at >= leaves.length - 1 ? "kitab bitdi" : "səhifəyə toxun və ya sürüşdür")
      : "cildə toxun";
  }

  function turn(dir){
    var n = at + dir;
    if (n < 0 || n > leaves.length - 1) return;
    at = n;
    paper(.13);
    sync();
  }

  function open(){
    if (opened) return;
    initAudio();
    if (AC && AC.state === "suspended") AC.resume();
    opened = true;
    $("cover").classList.add("open");
    $("panel").classList.remove("hide");
    thud(.3); paper(.1);
    sync();
  }

  $("cover").addEventListener("click", open);
  $("next").addEventListener("click", function(){ turn(1); });
  $("prev").addEventListener("click", function(){ turn(-1); });

  /* barmaqla sürüşdürmək */
  var x0 = null;
  book.addEventListener("pointerdown", function(e){ x0 = e.clientX; });
  book.addEventListener("pointerup", function(e){
    if (x0 === null) return;
    var dx = e.clientX - x0;
    x0 = null;
    if (!opened){ open(); return; }
    if (Math.abs(dx) < 34){ turn(1); return; }   /* toxunuş = irəli */
    turn(dx < 0 ? 1 : -1);
  });
  book.addEventListener("pointercancel", function(){ x0 = null; });

  addEventListener("keydown", function(e){
    if (!opened && (e.key === "Enter" || e.key === " ")){ open(); e.preventDefault(); return; }
    if (e.key === "ArrowRight"){ turn(1); e.preventDefault(); }
    if (e.key === "ArrowLeft"){ turn(-1); e.preventDefault(); }
  });

  sync();
})();
</script>
</body>
</html>
