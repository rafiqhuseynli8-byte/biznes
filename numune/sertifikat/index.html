/* ============================================================
   Rəsmi sertifikat. Möhür yuxarıdan düşür, lent açılır.
   Heç bir şəkil yoxdur — naxış da, möhür də CSS-dir.
   ============================================================ */
:root{
  --room:#15201B;        /* masanın üstü */
  --paper:#F6EFDF;       /* kağız */
  --paper-2:#EDE3CD;
  --ink:#1E2A24;
  --ink-2:#5A6A60;
  --ink-3:#8C9A90;
  --gold:#B8912F;
  --gold-d:#8A6B1E;
  --seal:#8E2C2C;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent }
html,body{ height:100%; margin:0 }
body{
  margin:0; background:radial-gradient(110% 70% at 50% 0%, #1D2C25 0%, var(--room) 68%);
  color:var(--paper); font-family:"Libre Baskerville",Georgia,serif;
  min-height:100%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:18px;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 14px
          calc(env(safe-area-inset-bottom,0px) + 24px);
  overflow-x:clip; user-select:none;
}

#doc{
  width:min(440px,100%); background:var(--paper); color:var(--ink);
  position:relative; padding:12px;
  box-shadow:0 34px 66px -24px rgba(0,0,0,.95);
  opacity:0; transform:translateY(-14px) scale(.985);
  transition:opacity .8s ease, transform .8s cubic-bezier(.25,.9,.3,1);
}
#doc.in{ opacity:1; transform:none }

/* iki cərgə naxış — xarici zolaq və daxili xətt */
#frame{
  border:2px solid var(--gold-d); padding:3px;
  background:
    repeating-linear-gradient(45deg,
      rgba(184,145,47,.20) 0 5px, rgba(0,0,0,0) 5px 10px);
}
#inner{
  border:1px solid var(--gold-d); background:var(--paper);
  padding:26px 20px 22px; text-align:center; position:relative;
}
/* künc naxışları */
.corner{
  position:absolute; width:20px; height:20px; border:2px solid var(--gold);
  opacity:.7;
}
.corner.tl{ top:7px; left:7px; border-right:0; border-bottom:0 }
.corner.tr{ top:7px; right:7px; border-left:0; border-bottom:0 }
.corner.bl{ bottom:7px; left:7px; border-right:0; border-top:0 }
.corner.br{ bottom:7px; right:7px; border-left:0; border-top:0 }

.eyebrow{
  font-family:"Barlow Condensed",sans-serif; font-weight:500;
  font-size:11px; letter-spacing:.36em; text-transform:uppercase;
  color:var(--ink-3); margin:0 0 4px;
}
#org{
  font-family:"Cinzel",Georgia,serif; font-weight:700;
  font-size:clamp(15px,4.4vw,19px); letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink); margin:0 0 14px; text-wrap:balance;
}
.rule{
  width:64px; height:1px; background:var(--gold); margin:0 auto 18px; position:relative;
}
.rule::before,.rule::after{
  content:""; position:absolute; top:-2px; width:5px; height:5px;
  background:var(--gold); transform:rotate(45deg);
}
.rule::before{ left:-8px } .rule::after{ right:-8px }

#kind{
  font-family:"Cinzel",Georgia,serif; font-weight:500;
  font-size:clamp(19px,5.6vw,25px); letter-spacing:.06em; text-transform:uppercase;
  margin:0 0 20px; color:var(--ink);
}
.given{ font-size:12.5px; font-style:italic; color:var(--ink-2); margin:0 0 8px }
#name{
  font-family:"Cinzel",Georgia,serif; font-weight:700;
  font-size:clamp(30px,9.4vw,46px); line-height:1.08; letter-spacing:.02em;
  margin:0 0 6px; color:var(--ink); text-wrap:balance;
}
#nameRule{ width:74%; height:1px; background:var(--ink-3); margin:0 auto 18px; opacity:.5 }
#why{
  font-size:clamp(14px,4vw,15.5px); line-height:1.7; margin:0 auto 20px;
  max-width:26em; color:var(--ink);
}
#why em{ font-style:italic; color:var(--ink) }

/* maddələr */
#points{ list-style:none; margin:0 0 22px; padding:0; text-align:left; display:inline-block }
#points li{
  font-size:13.5px; line-height:1.6; color:var(--ink-2);
  padding:0 0 6px 20px; position:relative;
}
#points li::before{
  content:"✦"; position:absolute; left:2px; top:0; color:var(--gold); font-size:11px;
}

/* aşağı hissə */
#foot{ display:flex; align-items:flex-end; justify-content:space-between;
  gap:14px; margin-top:6px; padding-bottom:46px }
.sigbox{ flex:1; text-align:left }
.sigline{ border-bottom:1px solid var(--ink-3); height:26px; margin-bottom:5px; opacity:.6 }
.sigbox .lbl{
  font-family:"Barlow Condensed",sans-serif; font-size:10px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--ink-3); margin:0;
}
.sigbox .val{ font-size:13px; margin:0; color:var(--ink) }
#sigName{
  font-family:"Libre Baskerville",Georgia,serif; font-style:italic;
  font-size:16px; color:var(--ink); position:absolute; transform:translateY(-30px) rotate(-3deg);
}

/* möhür */
#seal{
  flex:none; width:82px; height:82px; border-radius:50%; position:relative;
  display:grid; place-items:center; text-align:center;
  color:var(--seal); border:2px solid var(--seal);
  transform:rotate(-9deg) scale(1); opacity:0;
}
#seal::before{
  content:""; position:absolute; inset:5px; border:1px dashed var(--seal); border-radius:50%;
  opacity:.7;
}
#seal span{
  font-family:"Barlow Condensed",sans-serif; font-size:9.5px; letter-spacing:.16em;
  text-transform:uppercase; line-height:1.25; padding:0 8px;
}
#seal.on{ animation:slam .5s cubic-bezier(.2,1.5,.35,1) forwards }
@keyframes slam{
  0%{ opacity:0; transform:rotate(-9deg) scale(2.6) }
  62%{ opacity:.95; transform:rotate(-9deg) scale(.92) }
  100%{ opacity:.88; transform:rotate(-9deg) scale(1) }
}

#serial{
  font-family:"Barlow Condensed",sans-serif; font-size:10px; letter-spacing:.24em;
  text-transform:uppercase; color:var(--ink-3); margin:18px 0 0;
}

/* möhürdən sallanan lent */
#foot{ position:relative }
#tails{
  position:absolute; right:16px; top:74px; width:50px; height:0; z-index:1;
  pointer-events:none; overflow:hidden;
  transition:height .7s cubic-bezier(.3,.9,.35,1);
}
#tails.on{ height:52px }
#tails i{
  position:absolute; top:0; width:20px; height:52px; background:var(--seal);
}
#tails i.l{ left:2px;  transform:skewX(-8deg) }
#tails i.r{ right:2px; transform:skewX(8deg) }
#tails i::after{
  content:""; position:absolute; bottom:0; left:0;
  border-left:10px solid transparent; border-right:10px solid transparent;
  border-bottom:11px solid var(--paper);
}

#panel{ display:flex; gap:10px; width:min(440px,100%) }
.btn{
  flex:1; font-family:"Barlow Condensed",sans-serif; font-weight:500;
  font-size:13.5px; letter-spacing:.2em; text-transform:uppercase;
  text-align:center; text-decoration:none; cursor:pointer;
  padding:13px 14px; border-radius:6px;
  border:1px solid rgba(246,239,223,.26); background:transparent; color:var(--paper);
}
.btn.solid{ background:var(--gold); border-color:var(--gold); color:#1E1704 }
.btn:focus-visible{ outline:3px solid var(--gold); outline-offset:3px }
#panel.hide{ visibility:hidden }

#gate{
  position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:24px; padding:24px;
  background:radial-gradient(100% 70% at 50% 42%, #1D2C25 0%, #0B120F 78%);
  transition:opacity .5s ease;
}
#gate.off{ opacity:0; pointer-events:none }
#gate .lbl{ margin:0; font-family:"Barlow Condensed",sans-serif; font-size:11px;
  letter-spacing:.32em; text-transform:uppercase; color:var(--ink-3) }
#gate h1{
  margin:0; font-family:"Cinzel",Georgia,serif; font-weight:700;
  font-size:clamp(28px,9vw,46px); letter-spacing:.03em; text-align:center;
  text-transform:uppercase; text-wrap:balance;
}
#go{
  font-family:"Barlow Condensed",sans-serif; font-weight:500; font-size:14px;
  letter-spacing:.24em; text-transform:uppercase; cursor:pointer;
  padding:15px 32px; border-radius:6px; border:0; background:var(--gold); color:#1E1704;
  box-shadow:0 0 46px -10px rgba(184,145,47,.85);
  animation:breathe 2.6s ease-in-out 4;
}
@keyframes breathe{ 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.05) } }

@media (prefers-reduced-motion:reduce){
  #doc{ transition:none } #go{ animation:none } #tails{ transition:none }
  #seal.on{ animation:none; opacity:.88; transform:rotate(-9deg) scale(1) }
}
</style>
</head>
<body>

<div id="doc">
  <div id="frame">
    <div id="inner">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>

      <p class="eyebrow">rəsmi sənəd</p>
      <p id="org">—</p>
      <div class="rule"></div>

      <p id="kind">—</p>
      <p class="given">təqdim olunur</p>
      <p id="name">—</p>
      <div id="nameRule"></div>

      <p id="why">—</p>
      <ul id="points"></ul>

      <div id="foot">
        <div class="sigbox">
          <p id="sigName"></p>
          <div class="sigline"></div>
          <p class="lbl">imza</p>
          <p class="val" id="sigDate">—</p>
        </div>
        <div id="tails"><i class="l"></i><i class="r"></i></div>
        <div id="seal"><span id="sealTxt">təsdiq<br>edilib</span></div>
      </div>

      <p id="serial">—</p>
    </div>
  </div>
</div>

<div id="panel" class="hide">
  <button class="btn" id="again">yenidən</button>
  <a class="btn solid" id="reply" href="#">cavab yaz</a>
</div>

<div id="gate">
  <p class="lbl">sənəd hazırdır</p>
  <h1 id="gTitle">—</h1>
  <button id="go">aç</button>
</div>

<script>
(function(){
  "use strict";

  /* ══════════════════════════════════════════════════════════════
     DƏYİŞİR ELƏ LİNKDƏ — fayla toxunmaq lazım deyil.

       .../sertifikat/?ad=Leyla&imza=Rafiq&tel=994500000000
       ...&novu=İlin adamı&sebeb=heç nə etmədən hər şeyi düzəltdiyinə görə
       ...&maddeler=Səbr|Gülüş|Vaxtında gələn mesaj
       ...&teskilat=Dostluq Komitəsi

     ad         — kimə verilir
     novu       — sertifikatın adı (İlin adamı, Fəxri fərman...)
     sebeb      — nəyə görə verilir
     maddeler   — maddələr, | ilə ayrılır
     teskilat   — verən qurum (zarafat üçün)
     imza       — kim imzalayır
     tel        — WhatsApp nömrəsi
     ══════════════════════════════════════════════════════════════ */

  var Q = (function(){
    var q = new URLSearchParams(location.search);
    var h = new URLSearchParams(location.hash.replace(/^#/, ""));
    h.forEach(function(v, k){ if (!q.has(k)) q.set(k, v); });
    return q;
  })();
  function param(k, d, max){
    var v = Q.get(k);
    if (v === null) return d;
    v = v.trim();
    return v ? v.slice(0, max || 90) : d;
  }
  function upper(s){
    return String(s).replace(/i/g, "İ").replace(/ı/g, "I").toUpperCase();
  }
  var $ = function(id){ return document.getElementById(id); };
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  var AD    = param("ad", "Murad", 26);
  var NOVU  = param("novu", "İlin adamı", 34);
  var SEBEB = param("sebeb", "", 200);
  var TESK  = param("teskilat", "Dostluq Komitəsi", 34);
  var IMZA  = param("imza", "", 26);
  var TEL   = param("tel", "", 15).replace(/\D/g, "");
  var RAW   = param("maddeler", "", 500);

  var POINTS = RAW
    ? RAW.split("|").map(function(x){ return x.trim(); }).filter(Boolean).slice(0, 5)
    : ["Səbr — mənbəyi məlum deyil",
       "Sakitlik — hətta lazım olmayanda da",
       "Gülüş — qanunla qadağan edilməli səviyyədə"];

  $("gTitle").textContent = upper(AD);
  $("org").textContent = TESK;
  $("kind").textContent = NOVU;
  $("name").textContent = upper(AD);
  $("why").textContent = SEBEB ||
    "heç nə etmədən hər şeyi qaydasına saldığına görə, və bunu özü də " +
    "bilmədən etdiyinə görə";

  var ul = $("points");
  POINTS.forEach(function(t){
    var li = document.createElement("li");
    li.textContent = t;
    ul.appendChild(li);
  });

  if (IMZA) $("sigName").textContent = IMZA;

  var d = new Date();
  var AY = ["yanvar","fevral","mart","aprel","may","iyun",
            "iyul","avqust","sentyabr","oktyabr","noyabr","dekabr"];
  $("sigDate").textContent = d.getDate() + " " + AY[d.getMonth()] + " " + d.getFullYear();

  /* seriya nömrəsi addan törəyir ki, hər açılışda eyni qalsın */
  var seed = 0;
  for (var i = 0; i < AD.length; i++) seed = (seed * 31 + AD.charCodeAt(i)) & 0xffff;
  function rnd(){ seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
  var ser = "";
  for (var k = 0; k < 8; k++) ser += Math.floor(rnd() * 10);
  $("serial").textContent = "seriya № " + ser.slice(0, 4) + "-" + ser.slice(4) + " · tiraj 1 nüsxə";

  if (TEL && /^\d{7,15}$/.test(TEL)){
    $("reply").href = "https://wa.me/" + TEL;
  } else {
    $("reply").style.display = "none";
  }

  /* ---------- səs ---------- */
  var AC = null, master = null;
  function initAudio(){
    if (AC) return;
    try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return; }
    master = AC.createGain(); master.gain.value = .8; master.connect(AC.destination);
  }
  function thud(vol){
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(160, AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(44, AC.currentTime + .14);
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + .33);
    o.connect(g); g.connect(master); o.start(); o.stop(AC.currentTime + .35);
    var n = Math.floor(AC.sampleRate * .06);
    var b = AC.createBuffer(1, n, AC.sampleRate), dd = b.getChannelData(0);
    for (var i = 0; i < n; i++) dd[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var s = AC.createBufferSource(); s.buffer = b;
    var f = AC.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 1600;
    var gg = AC.createGain(); gg.gain.value = vol * .55;
    s.connect(f); f.connect(gg); gg.connect(master); s.start();
  }
  function chime(){
    if (!AC) return;
    [659.25, 987.77].forEach(function(f, i){
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = "sine"; o.frequency.value = f;
      var t0 = AC.currentTime + i * .16;
      g.gain.setValueAtTime(.0001, t0);
      g.gain.linearRampToValueAtTime(.09, t0 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + .8);
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + .85);
    });
  }

  var timers = [];
  function at(ms, fn){ timers.push(setTimeout(fn, ms)); }

  function show(){
    timers.forEach(clearTimeout); timers.length = 0;
    $("doc").classList.remove("in");
    $("seal").classList.remove("on");
    $("tails").classList.remove("on");
    $("panel").classList.add("hide");
    void $("doc").offsetWidth;

    at(60,   function(){ $("doc").classList.add("in"); chime(); });
    at(1500, function(){ $("tails").classList.add("on"); });
    at(1700, function(){ $("seal").classList.add("on"); thud(.4); });
    at(2400, function(){ $("panel").classList.remove("hide"); });
  }

  $("go").addEventListener("click", function(){
    initAudio();
    if (AC && AC.state === "suspended") AC.resume();
    $("gate").classList.add("off");
    show();
  });
  $("again").addEventListener("click", show);
})();
</script>
</body>
</html>
