  --line:#E4573D;        /* xəttin rəngi */
  --line-dim:#4A2A22;
  --chrome:#E7EDF0;      /* ağ yazı */
  --dim:#8C9AA3;
  --glass:#1E282E;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent }
html,body{ height:100%; margin:0 }
body{
  margin:0; background:var(--tunnel); color:var(--chrome);
  font-family:"Oswald",sans-serif; min-height:100%;
  display:flex; justify-content:center; overflow-x:hidden; user-select:none;
  padding:calc(env(safe-area-inset-top,0px) + 0px) 0
          calc(env(safe-area-inset-bottom,0px) + 0px);
}
#car{
  width:min(480px,100%); position:relative; min-height:100vh;
  background:
    linear-gradient(180deg, rgba(20,28,33,.9), rgba(12,16,19,.9)),
    repeating-linear-gradient(180deg, var(--tile) 0 26px, #131A1F 26px 27px);
  display:flex; flex-direction:column;
}

/* ---------- yuxarıdakı lövhə ---------- */
#board{
  position:sticky; top:0; z-index:6; background:rgba(8,11,13,.94);
  backdrop-filter:blur(6px); border-bottom:1px solid rgba(231,237,240,.10);
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;
}
#route{
  display:flex; align-items:center; gap:9px; font-size:11px;
  letter-spacing:.22em; text-transform:uppercase; color:var(--dim); margin:0 0 6px;
}
#route i{ width:11px; height:11px; border-radius:50%; background:var(--line); flex:none }
#next{
  margin:0; font-size:clamp(17px,5vw,22px); font-weight:500; letter-spacing:.02em;
  min-height:1.3em; text-wrap:balance;
}
#next b{ color:var(--line); font-weight:600 }

/* ---------- xətt ---------- */
#track{ position:relative; flex:1; padding:26px 16px 40px 0 }
#rail{
  position:absolute; left:46px; top:26px; bottom:40px; width:4px;
  background:var(--line-dim); border-radius:2px;
}
#railFill{
  position:absolute; left:0; top:0; width:100%; height:0%;
  background:var(--line); border-radius:2px;
  box-shadow:0 0 18px rgba(228,87,61,.7);
  transition:height .9s cubic-bezier(.4,.05,.25,1);
}
#train{
  position:absolute; left:46px; top:26px; width:4px; height:0;
  transform:translateX(-50%); z-index:4; pointer-events:none;
}
#train span{
  position:absolute; left:50%; top:0; transform:translate(-50%,-50%);
  width:19px; height:19px; border-radius:50%; background:var(--line);
  box-shadow:0 0 0 5px rgba(228,87,61,.22), 0 0 26px rgba(228,87,61,.95);
  transition:top .9s cubic-bezier(.4,.05,.25,1);
}

ol#stops{ list-style:none; margin:0; padding:0 0 0 78px; position:relative; z-index:3 }
ol#stops li{
  position:relative; min-height:104px; padding:0 4px 30px 0;
  opacity:.28; transition:opacity .5s ease;
}
ol#stops li.on{ opacity:1 }
ol#stops li::before{
  content:""; position:absolute; left:-36px; top:6px;
  width:13px; height:13px; border-radius:50%;
  background:var(--tunnel); border:3px solid var(--line-dim);
  transform:translateX(-50%); transition:border-color .4s ease, box-shadow .4s ease;
}
ol#stops li.on::before{
  border-color:var(--line);
  box-shadow:0 0 16px rgba(228,87,61,.85);
}
ol#stops .nm{
  display:block; font-size:clamp(16px,4.6vw,20px); font-weight:600;
  letter-spacing:.06em; text-transform:uppercase; margin:0 0 8px; text-wrap:balance;
}
ol#stops .tx{
  display:block; font-family:"Lora",Georgia,serif; font-size:clamp(14.5px,4.1vw,16.5px);
  line-height:1.62; color:#C9D3D8; max-width:32em;
}
ol#stops li.on .tx{ animation:rise .6s ease both }
@keyframes rise{ from{ opacity:0; transform:translateY(9px) } to{ opacity:1; transform:none } }

/* ---------- son ---------- */
#final{
  margin:0 16px 34px 16px; padding:20px 18px; border-radius:10px;
  background:rgba(228,87,61,.09); border:1px solid rgba(228,87,61,.35);
  display:none;
}
#final.on{ display:block; animation:rise .7s ease both }
#final p{
  font-family:"Lora",Georgia,serif; font-size:clamp(15px,4.3vw,17px);
  line-height:1.65; margin:0 0 14px; color:var(--chrome);
}
#final .sign{ font-family:"Oswald",sans-serif; font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim) }
.btn{
  display:inline-block; font-family:"Oswald",sans-serif; font-size:12.5px;
  letter-spacing:.18em; text-transform:uppercase; text-decoration:none; cursor:pointer;
  padding:12px 22px; border-radius:3px; border:0; background:var(--line); color:#1A0B07;
  font-weight:500; margin-top:4px;
}
.btn.ghost{ background:transparent; color:var(--chrome); border:1px solid rgba(231,237,240,.3) }
.btn:focus-visible{ outline:3px solid var(--chrome); outline-offset:3px }

/* ---------- başlanğıc ---------- */
#gate{
  position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:24px; padding:24px;
  background:radial-gradient(100% 70% at 50% 40%, #172127 0%, #080B0D 78%);
  transition:opacity .55s ease;
}
#gate.off{ opacity:0; pointer-events:none }
#gate .lbl{ margin:0; font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--dim) }
#gate h1{
  margin:0; font-weight:600; font-size:clamp(30px,10vw,52px); letter-spacing:.04em;
  text-transform:uppercase; text-align:center; text-wrap:balance;
}
#gate .sub{ margin:0; font-size:13px; color:var(--dim); text-align:center }
#go{
  font-family:"Oswald",sans-serif; font-size:14px; letter-spacing:.24em;
  text-transform:uppercase; font-weight:500; cursor:pointer;
  padding:16px 32px; border-radius:3px; border:0; background:var(--line); color:#1A0B07;
  box-shadow:0 0 46px -10px rgba(228,87,61,.85);
  animation:breathe 2.6s ease-in-out 4;
}
@keyframes breathe{ 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.05) } }

@media (prefers-reduced-motion:reduce){
  #go{ animation:none } #railFill,#train span{ transition:none }
  ol#stops li.on .tx,#final.on{ animation:none }
}
</style>
</head>
<body>

<div id="car">
  <div id="board">
    <p id="route"><i></i><span id="lineName">—</span></p>
    <p id="next">—</p>
  </div>

  <div id="track">
    <div id="rail"><div id="railFill"></div></div>
    <div id="train"><span></span></div>
    <ol id="stops"></ol>
  </div>

  <div id="final">
    <p id="finalTxt">—</p>
    <p class="sign" id="finalSign"></p>
    <a class="btn" id="reply" href="#">cavab yaz</a>
    <button class="btn ghost" id="again">yenidən</button>
  </div>
</div>

<div id="gate">
  <p class="lbl">xətt açıqdır</p>
  <h1 id="gTitle">—</h1>
  <p class="sub">Qatar özü gedir. Sadəcə bax.</p>
  <button id="go">min</button>
</div>

<script>
(function(){
  "use strict";

  /* ══════════════════════════════════════════════════════════════
     DƏYİŞİR ELƏ LİNKDƏ — fayla toxunmaq lazım deyil.

       .../metro/?ad=Leyla&xett=Xatirə xətti&imza=Rafiq
       ...&stansiya=Arena::İlk dəfə burda gördüm|Kino::Sən yatmışdın
       ...&son=Bu xətt bitmir&tel=994500000000

     ad        — kimin üçündür
     xett      — xəttin adı
     stansiya  — stansiyalar: "ad::cümlə", aralarında |
     son       — son söz
     imza      — kimdən
     tel       — WhatsApp nömrəsi
     ══════════════════════════════════════════════════════════════ */

  var Q = (function(){
    var q = new URLSearchParams(location.search);
    var h = new URLSearchParams(location.hash.replace(/^#/, ""));
    h.forEach(function(v, k){ if (!q.has(k)) q.set(k, v); });
    return q;
  })();
  function param(k, d, max){
    var v = Q.get(k);
    if (v === null) return d;
    v = v.trim();
    return v ? v.slice(0, max || 90) : d;
  }
  function upper(s){
    return String(s).replace(/i/g, "İ").replace(/ı/g, "I").toUpperCase();
  }
  var $ = function(id){ return document.getElementById(id); };
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  var AD   = param("ad", "Günel", 26);
  var XETT = param("xett", "", 34);
  var IMZA = param("imza", "", 26);
  var TEL  = param("tel", "", 15).replace(/\D/g, "");
  var SON  = param("son", "", 260);
  var RAW  = param("stansiya", "", 1400);

  var STOPS = RAW
    ? RAW.split("|").map(function(x){
        var parts = x.split("::");
        return { nm: (parts[0] || "").trim(), tx: (parts[1] || "").trim() };
      }).filter(function(s){ return s.nm; }).slice(0, 8)
    : [
        { nm:"Başlanğıc",  tx:"Hər şeyin başladığı yer. O vaxt heç nə bilmirdik." },
        { nm:"Ortada",     tx:"Burda ən çox güldük. Səbəbini indi xatırlamıram." },
        { nm:"Sükut",      tx:"Bir dayanacaq da var idi ki, orda heç nə deməmişik. Yaxşı ki deməmişik." },
        { nm:"İndi",       tx:"Qatar hələ gedir. Sən hələ buradasan." }
      ];

  $("gTitle").textContent = upper(AD);
  $("lineName").textContent = upper(XETT || (AD + " xətti"));
  $("finalTxt").textContent = SON ||
    "Son stansiya yoxdur. Bu xətt dairəvidir — istəsən, əvvəldən başlayarıq.";
  $("finalSign").textContent = IMZA ? "— " + IMZA : "";

  if (TEL && /^\d{7,15}$/.test(TEL)){
    $("reply").href = "https://wa.me/" + TEL;
  } else {
    $("reply").style.display = "none";
  }

  /* ---------- stansiyaları qur ---------- */
  var ol = $("stops");
  STOPS.forEach(function(s){
    var li = document.createElement("li");
    var nm = document.createElement("span"); nm.className = "nm"; nm.textContent = upper(s.nm);
    var tx = document.createElement("span"); tx.className = "tx"; tx.textContent = s.tx;
    li.appendChild(nm); li.appendChild(tx);
    ol.appendChild(li);
    s.el = li;
  });

  /* ══════════════════════════════════════════════════════════════
     SƏS — qatarın səsi
     ══════════════════════════════════════════════════════════════ */

  var AC = null, master = null, rumble = null, rumbleGain = null;

  function initAudio(){
    if (AC) return;
    try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return; }
    master = AC.createGain(); master.gain.value = .85; master.connect(AC.destination);

    var len = AC.sampleRate * 2;
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1);
    rumble = AC.createBufferSource(); rumble.buffer = buf; rumble.loop = true;
    var lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 160; lp.Q.value = .7;
    rumbleGain = AC.createGain(); rumbleGain.gain.value = 0;
    rumble.connect(lp); lp.connect(rumbleGain); rumbleGain.connect(master);
    rumble.start();
  }
  function rumbleTo(v, dur){
    if (!rumbleGain) return;
    rumbleGain.gain.setTargetAtTime(v, AC.currentTime, (dur || .5) / 3);
  }
  /* metro siqnalı — iki not */
  function chime(){
    if (!AC) return;
    [660, 880].forEach(function(f, i){
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = "sine"; o.frequency.value = f;
      var t0 = AC.currentTime + i * .17;
      g.gain.setValueAtTime(.0001, t0);
      g.gain.linearRampToValueAtTime(.11, t0 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + .5);
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + .55);
    });
  }
  function doors(){
    if (!AC) return;
    var n = Math.floor(AC.sampleRate * .5);
    var b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    var s = AC.createBufferSource(); s.buffer = b;
    var f = AC.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 700; f.Q.value = 1.1;
    var g = AC.createGain(); g.gain.value = .13;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  }

  /* ══════════════════════════════════════════════════════════════
     HƏRƏKƏT
     ══════════════════════════════════════════════════════════════ */

  var timers = [];
  function at(ms, fn){ timers.push(setTimeout(fn, ms)); }
  function stopAll(){ timers.forEach(clearTimeout); timers.length = 0; }

  function moveTo(i){
    /* qatarı i-ci stansiyanın nöqtəsinə apar */
    var li = STOPS[i].el;
    var rail = $("rail").getBoundingClientRect();
    var dot = li.getBoundingClientRect();
    var y = dot.top - rail.top + 12;
    $("train").querySelector("span").style.top = y + "px";
    $("railFill").style.height = Math.max(0, Math.min(100, y / rail.height * 100)) + "%";
  }

  function ride(){
    stopAll();
    $("final").classList.remove("on");
    STOPS.forEach(function(s){ s.el.classList.remove("on"); });
    $("railFill").style.height = "0%";
    $("train").querySelector("span").style.top = "0px";
    $("next").textContent = "";
    scrollTo({ top:0, behavior: reduce ? "auto" : "smooth" });

    var t = 400;
    var hold = reduce ? 400 : 2600;

    STOPS.forEach(function(s, i){
      /* yaxınlaşır */
      L(t, function(){
        rumbleTo(.10, .6);
        $("next").innerHTML = "";
        $("next").appendChild(document.createTextNode("Növbəti stansiya: "));
        var b = document.createElement("b"); b.textContent = s.nm;
        $("next").appendChild(b);
      });
      /* dayanır */
      L(t + 900, function(){
        moveTo(i);
        s.el.classList.add("on");
        rumbleTo(.02, .5);
        chime();
        if (!reduce) s.el.scrollIntoView({ behavior:"smooth", block:"center" });
        $("next").innerHTML = "";
        $("next").appendChild(document.createTextNode(s.nm));
      });
      L(t + 1500, doors);
      t += 900 + hold;
    });

    L(t, function(){
      rumbleTo(0, 1.2);
      $("next").textContent = "Son stansiya";
      $("final").classList.add("on");
      if (!reduce) $("final").scrollIntoView({ behavior:"smooth", block:"center" });
      chime();
    });

    function L(ms, fn){ at(ms, fn); }
  }

  $("go").addEventListener("click", function(){
    initAudio();
    if (AC && AC.state === "suspended") AC.resume();
    $("gate").classList.add("off");
    ride();
  });
  $("again").addEventListener("click", ride);

  addEventListener("resize", function(){
    var on = STOPS.filter(function(s){ return s.el.classList.contains("on"); });
    if (on.length) moveTo(STOPS.indexOf(on[on.length - 1]));
  });
})();
</script>
</body>
</html>
