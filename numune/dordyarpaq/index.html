/* ============================================================
   Yonca tarlası. Hamısı üçyarpaqdır — biri istisna. Tapmaq
   lazımdır. Tapanda söz çıxır.
   ============================================================ */
:root{
  --field:#0F1A12;
  --field-2:#16281B;
  --leaf:#3E8C52;
  --leaf-2:#2E6B3E;
  --leaf-lucky:#7BD08C;
  --cream:#EFF6EF;
  --gold:#E3C05A;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent }
html,body{ height:100%; margin:0 }
body{
  margin:0; background:radial-gradient(120% 85% at 50% 12%, var(--field-2) 0%, var(--field) 68%);
  color:var(--cream); font-family:"Barlow Condensed",sans-serif;
  min-height:100%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:16px;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 12px
          calc(env(safe-area-inset-bottom,0px) + 22px);
  overflow-x:hidden; user-select:none; touch-action:manipulation;
}

#head{ text-align:center; max-width:34ch }
#head .lbl{
  font-size:11px; letter-spacing:.3em; text-transform:uppercase;
  color:rgba(239,246,239,.5); margin:0 0 5px;
}
#head h1{
  font-family:"Caveat",cursive; font-weight:600;
  font-size:clamp(26px,7.4vw,36px); margin:0 0 4px; line-height:1.15;
}
#head p{ font-size:14px; color:rgba(239,246,239,.62); margin:0 }

#field{
  width:min(420px,100%); aspect-ratio:1/1.05; position:relative;
}
.clover{
  position:absolute; width:15%; aspect-ratio:1; cursor:pointer;
  border:0; background:transparent; padding:0;
  transition:transform .25s cubic-bezier(.3,1.4,.4,1), opacity .4s ease;
}
.clover svg{ width:100%; height:100%; display:block; overflow:visible }
.clover .leafp{ fill:var(--leaf); transition:fill .3s ease }
.clover .stem{ stroke:var(--leaf-2); stroke-width:5; fill:none; stroke-linecap:round }
.clover:hover{ transform:scale(1.08) }
.clover:focus-visible{ outline:3px solid var(--gold); outline-offset:4px; border-radius:50% }
.clover.no{ animation:shake .34s ease }
.clover.dim{ opacity:.34 }
.clover.win .leafp{ fill:var(--leaf-lucky) }
.clover.win{ transform:scale(1.35); filter:drop-shadow(0 0 22px rgba(123,208,140,.85)) }
@keyframes shake{
  0%,100%{ transform:rotate(0) } 25%{ transform:rotate(-8deg) }
  50%{ transform:rotate(7deg) } 75%{ transform:rotate(-4deg) }
}

#count{
  font-size:12px; letter-spacing:.24em; text-transform:uppercase;
  color:rgba(239,246,239,.42); margin:0; min-height:1.2em;
}

#win{
  width:min(420px,100%); display:none; text-align:center;
  background:rgba(20,38,25,.72); border:1px solid rgba(123,208,140,.4);
  border-radius:14px; padding:20px 18px;
}
#win.on{ display:block; animation:rise .7s ease both }
@keyframes rise{ from{ opacity:0; transform:translateY(10px) } to{ opacity:1; transform:none } }
#win .found{
  font-size:11px; letter-spacing:.28em; text-transform:uppercase;
  color:var(--leaf-lucky); margin:0 0 10px;
}
#win p.msg{
  font-family:"Caveat",cursive; font-size:clamp(21px,5.8vw,26px); line-height:1.4;
  margin:0 0 .55em; color:var(--cream);
}
#win .sign{ font-family:"Caveat",cursive; font-size:19px; color:var(--gold); margin:10px 0 0 }
.btn{
  display:inline-block; font-family:"Barlow Condensed",sans-serif; font-weight:500;
  font-size:13.5px; letter-spacing:.2em; text-transform:uppercase;
  text-decoration:none; cursor:pointer; padding:12px 24px; border-radius:8px;
  border:1px solid rgba(239,246,239,.28); background:transparent; color:var(--cream);
  margin:14px 5px 0;
}
.btn.solid{ background:var(--gold); border-color:var(--gold); color:#241C05 }
.btn:focus-visible{ outline:3px solid var(--cream); outline-offset:3px }

@media (prefers-reduced-motion:reduce){
  .clover,.clover.no,#win.on{ animation:none; transition:none }
}
</style>
</head>
<body>

<div id="head">
  <p class="lbl">tarla</p>
  <h1 id="title">—</h1>
  <p id="sub">—</p>
</div>

<div id="field"></div>
<p id="count">—</p>

<div id="win">
  <p class="found">tapdın</p>
  <div id="winBody"></div>
  <p class="sign" id="winSign"></p>
  <a class="btn solid" id="reply" href="#">Cavab yaz</a>
  <button class="btn" id="again">Yenidən</button>
</div>

<script>
(function(){
  "use strict";

  /* ══════════════════════════════════════════════════════════════
     DƏYİŞİR ELƏ LİNKDƏ — fayla toxunmaq lazım deyil.

       .../dordyarpaq/?ad=Leyla&imza=Rafiq&tel=994500000000
       ...&mesaj=Sabah üçün uğurlar|Bilirəm ki, bacaracaqsan
       ...&say=24

     ad     — kimin üçündür
     mesaj  — tapanda çıxan söz, | ilə ayrılır
     say    — tarladakı yonca sayı (12–40)
     imza   — kimdən
     tel    — WhatsApp nömrəsi
     ══════════════════════════════════════════════════════════════ */

  var Q = (function(){
    var q = new URLSearchParams(location.search);
    var h = new URLSearchParams(location.hash.replace(/^#/, ""));
    h.forEach(function(v, k){ if (!q.has(k)) q.set(k, v); });
    return q;
  })();
  function param(k, d, max){
    var v = Q.get(k);
    if (v === null) return d;
    v = v.trim();
    return v ? v.slice(0, max || 90) : d;
  }
  var $ = function(id){ return document.getElementById(id); };
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  var AD   = param("ad", "dostum", 26);
  var IMZA = param("imza", "", 26);
  var TEL  = param("tel", "", 15).replace(/\D/g, "");
  var RAW  = param("mesaj", "", 700);
  var SAY  = parseInt(param("say", "24", 3), 10);
  if (!isFinite(SAY) || SAY < 12) SAY = 24;
  if (SAY > 40) SAY = 40;

  var MSG = RAW
    ? RAW.split("|").map(function(x){ return x.trim(); }).filter(Boolean).slice(0, 4)
    : [
        "Uğurlar sabah üçün.",
        "Tapmaq çətin idi — amma var idi. Həmişə var olur.",
        "Sən də belə. Axtarmaq lazımdır, tapılır."
      ];

  $("title").textContent = AD + ", burda dördyarpaq var";
  $("sub").textContent = "Bir dənədir. Tapmaq lazımdır.";

  var box = $("win").querySelector("#winBody") || $("winBody");
  MSG.forEach(function(t){
    var p = document.createElement("p");
    p.className = "msg"; p.textContent = t;
    box.appendChild(p);
  });
  $("winSign").textContent = IMZA ? "— " + IMZA : "";

  if (TEL && /^\d{7,15}$/.test(TEL)){
    $("reply").href = "https://wa.me/" + TEL;
  } else {
    $("reply").style.display = "none";
  }

  /* ---------- səs ---------- */
  var AC = null, master = null;
  function initAudio(){
    if (AC) return;
    try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return; }
    master = AC.createGain(); master.gain.value = .8; master.connect(AC.destination);
  }
  function rustle(vol){
    if (!AC) return;
    var n = Math.floor(AC.sampleRate * .13);
    var b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / n);
    var s = AC.createBufferSource(); s.buffer = b;
    var f = AC.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 2800; f.Q.value = .7;
    var g = AC.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  }
  function sparkle(){
    if (!AC) return;
    [659.25, 987.77, 1318.5].forEach(function(fr, i){
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = "sine"; o.frequency.value = fr;
      var t0 = AC.currentTime + i * .13;
      g.gain.setValueAtTime(.0001, t0);
      g.gain.linearRampToValueAtTime(.09, t0 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + 1.0);
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + 1.05);
    });
  }

  /* ---------- tarla ---------- */
  var field = $("field");
  var clovers = [];
  var tries = 0;
  var won = false;

  function leafPath(cx, cy, r, ang){
    /* bir yarpaq — ürək formasına yaxın ləçək */
    var a = ang * Math.PI / 180;
    var x = cx + Math.cos(a) * r * .62;
    var y = cy + Math.sin(a) * r * .62;
    return '<ellipse class="leafp" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) +
           '" rx="' + (r * .46).toFixed(1) + '" ry="' + (r * .62).toFixed(1) +
           '" transform="rotate(' + (ang + 90) + ' ' + x.toFixed(1) + ' ' + y.toFixed(1) + ')"/>';
  }

  function makeClover(leaves){
    var svg = '<svg viewBox="0 0 100 100" aria-hidden="true">';
    svg += '<path class="stem" d="M50 58 C50 74, 46 84, 42 94"/>';
    var step = 360 / leaves;
    for (var i = 0; i < leaves; i++){
      svg += leafPath(50, 46, 30, -90 + i * step);
    }
    svg += "</svg>";
    return svg;
  }

  function build(){
    field.innerHTML = "";
    clovers.length = 0;
    tries = 0;
    won = false;
    $("win").classList.remove("on");
    $("count").textContent = "";

    var lucky = Math.floor(Math.random() * SAY);
    var cols = SAY <= 18 ? 4 : 5;
    var rows = Math.ceil(SAY / cols);

    for (var i = 0; i < SAY; i++){
      var r = Math.floor(i / cols), c = i % cols;
      var btn = document.createElement("button");
      btn.className = "clover";
      btn.type = "button";
      btn.setAttribute("aria-label", "yonca");
      btn.innerHTML = makeClover(i === lucky ? 4 : 3);

      /* şəbəkə üstündə kiçik təsadüfi sürüşmə — tarla kimi görünsün */
      var jx = (Math.random() - .5) * 7;
      var jy = (Math.random() - .5) * 7;
      btn.style.left = (c * (100 / cols) + (100 / cols - 15) / 2 + jx) + "%";
      btn.style.top  = (r * (100 / rows) + (100 / rows - 15) / 2 + jy) + "%";
      btn.style.setProperty("transform", "rotate(" + ((Math.random() - .5) * 26).toFixed(1) + "deg)");

      (function(btn, isLucky){
        btn.addEventListener("click", function(){
          initAudio();
          if (AC && AC.state === "suspended") AC.resume();
          if (won) return;
          if (isLucky){
            won = true;
            btn.classList.add("win");
            clovers.forEach(function(o){ if (o !== btn) o.classList.add("dim"); });
            sparkle();
            setTimeout(function(){ $("win").classList.add("on"); }, 500);
            $("count").textContent = tries + 1 + " cəhddən sonra";
          } else {
            tries++;
            btn.classList.remove("no"); void btn.offsetWidth; btn.classList.add("no");
            rustle(.07);
            $("count").textContent = tries === 1 ? "bu deyil" : tries + " cəhd";
          }
        });
      })(btn, i === lucky);

      field.appendChild(btn);
      clovers.push(btn);
    }
  }

  build();
  $("again").addEventListener("click", build);
})();
</script>
</body>
</html>
