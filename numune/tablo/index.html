/* ============================================================
   Hava limanındakı lövhə. Hərflər bir-bir çevrilir, tıqqıltı ilə.
   ============================================================ */
:root{
  --hall:#0B0D0E;
  --board:#121618;
  --flap:#1C2225;
  --flap-2:#141A1C;
  --char:#F0E3B8;        /* solğun sarı — köhnə lövhələrdəki kimi */
  --amber:#E8C64B;
  --edge:#262E31;
  --muted:#6E7A7E;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent }
html,body{ height:100%; margin:0 }
body{
  margin:0; background:radial-gradient(120% 80% at 50% 0%, #14191B 0%, var(--hall) 68%);
  color:#DCE4E6; font-family:"Barlow Condensed",sans-serif;
  min-height:100%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:18px;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 10px
          calc(env(safe-area-inset-bottom,0px) + 24px);
  overflow-x:hidden; user-select:none;
}

#board{
  width:min(560px,100%); background:var(--board);
  border:1px solid var(--edge); border-radius:6px;
  padding:14px 12px 16px;
  box-shadow:0 26px 56px -22px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.04);
}
#top{
  display:flex; justify-content:space-between; align-items:baseline;
  font-size:11px; letter-spacing:.24em; text-transform:uppercase;
  color:var(--muted); padding:0 2px 10px; border-bottom:1px solid var(--edge);
  margin-bottom:12px;
}
#top .clock{ font-family:"IBM Plex Mono",monospace; letter-spacing:.08em; color:var(--amber) }

.row{ display:flex; gap:2px; justify-content:center; margin:0 0 4px }
.cell{
  flex:0 0 auto;
  width:var(--cw,20px); height:calc(var(--cw,20px) * 1.42);
  background:linear-gradient(180deg, var(--flap) 0 50%, var(--flap-2) 50% 100%);
  border-radius:2px; position:relative; overflow:hidden;
  display:grid; place-items:center;
  font-family:"IBM Plex Mono",monospace; font-weight:600;
  font-size:calc(var(--cw,20px) * .74); line-height:1; color:var(--char);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.5);
}
/* ortadakı tikiş */
.cell::after{
  content:""; position:absolute; left:0; right:0; top:50%; height:1px;
  background:rgba(0,0,0,.62);
}
.cell.flip{ animation:flip .09s linear }
@keyframes flip{
  0%{ transform:rotateX(0deg) }
  50%{ transform:rotateX(-42deg) }
  100%{ transform:rotateX(0deg) }
}
.cell.blank{ background:linear-gradient(180deg, #10151700 0 50%, #10151700 50% 100%); box-shadow:none }
.cell.blank::after{ display:none }

.row.amber .cell{ color:var(--amber) }
.row.big{ margin-bottom:10px }

#foot{
  display:flex; justify-content:space-between; align-items:center;
  font-size:11px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--muted); padding:12px 2px 0; border-top:1px solid var(--edge); margin-top:10px;
}
#foot .dot{
  width:7px; height:7px; border-radius:50%; background:#2E7D4F; display:inline-block;
  margin-right:7px; vertical-align:middle;
}

#panel{ display:flex; gap:10px; width:min(560px,100%); visibility:hidden }
#panel.on{ visibility:visible }
.btn{
  flex:1; font-family:"Barlow Condensed",sans-serif; font-weight:500; font-size:14px;
  letter-spacing:.2em; text-transform:uppercase; text-align:center;
  text-decoration:none; cursor:pointer; padding:13px 14px; border-radius:7px;
  border:1px solid var(--edge); background:transparent; color:#DCE4E6;
}
.btn.solid{ background:var(--amber); border-color:var(--amber); color:#231C05 }
.btn:focus-visible{ outline:3px solid var(--amber); outline-offset:3px }

#gate{
  position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:22px; padding:24px;
  background:radial-gradient(100% 70% at 50% 42%, #151B1D 0%, #08090A 78%);
  transition:opacity .5s ease;
}
#gate.off{ opacity:0; pointer-events:none }
#gate .lbl{ margin:0; font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--muted) }
#gate h1{
  margin:0; font-family:"IBM Plex Mono",monospace; font-weight:600;
  font-size:clamp(26px,8vw,44px); letter-spacing:.02em; text-align:center;
  color:var(--amber); text-wrap:balance;
}
#go{
  font-family:"Barlow Condensed",sans-serif; font-weight:500; font-size:14px;
  letter-spacing:.24em; text-transform:uppercase; cursor:pointer;
  padding:15px 32px; border-radius:7px; border:0; background:var(--amber); color:#231C05;
  box-shadow:0 0 44px -12px rgba(232,198,75,.9);
  animation:breathe 2.6s ease-in-out 4;
}
@keyframes breathe{ 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.05) } }

@media (prefers-reduced-motion:reduce){ .cell.flip{ animation:none } #go{ animation:none } }
</style>
</head>
<body>

<div id="board">
  <div id="top"><span id="topLeft">—</span><span class="clock" id="clock">--:--</span></div>
  <div id="rows"></div>
  <div id="foot"><span><span class="dot"></span><span id="status">—</span></span><span id="gateNo">—</span></div>
</div>

<div id="panel">
  <button class="btn" id="again">Yenidən</button>
  <a class="btn solid" id="reply" href="#">Cavab yaz</a>
</div>

<div id="gate">
  <p class="lbl">lövhə</p>
  <h1 id="gTitle">—</h1>
  <button id="go">Başlat</button>
</div>

<script>
(function(){
  "use strict";

  /* ══════════════════════════════════════════════════════════════
     DƏYİŞİR ELƏ LİNKDƏ — fayla toxunmaq lazım deyil.

       .../tablo/?ad=Leyla&imza=Rafiq&tel=994500000000
       ...&setir=TƏBRİK EDİRƏM|SƏN BACARDIN|BİLİRDİM

     ad     — kimin adı lövhədə yanır
     setir  — sətirlər, | ilə ayrılır (hər biri 16 hərfə qədər)
     basliq — yuxarıdakı yazı
     imza   — kimdən
     tel    — WhatsApp nömrəsi
     ══════════════════════════════════════════════════════════════ */

  var Q = (function(){
    var q = new URLSearchParams(location.search);
    var h = new URLSearchParams(location.hash.replace(/^#/, ""));
    h.forEach(function(v, k){ if (!q.has(k)) q.set(k, v); });
    return q;
  })();
  function param(k, d, max){
    var v = Q.get(k);
    if (v === null) return d;
    v = v.trim();
    return v ? v.slice(0, max || 90) : d;
  }
  function upper(s){
    return String(s).replace(/i/g, "İ").replace(/ı/g, "I").toUpperCase();
  }
  var $ = function(id){ return document.getElementById(id); };
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  var AD     = param("ad", "Lalə", 20);
  var BASLIQ = param("basliq", "", 30);
  var IMZA   = param("imza", "", 20);
  var TEL    = param("tel", "", 15).replace(/\D/g, "");
  var RAW    = param("setir", "", 300);

  var LINES = RAW
    ? RAW.split("|").map(function(x){ return upper(x.trim()); }).filter(Boolean).slice(0, 5)
    : ["TƏBRİK EDİRƏM", upper(AD), "SƏN BACARDIN", "BİLİRDİM"];

  if (!RAW && LINES.indexOf(upper(AD)) === -1) LINES.splice(1, 0, upper(AD));

  $("gTitle").textContent = upper(AD);
  $("topLeft").textContent = BASLIQ || "təbriklər";
  $("status").textContent = "yanır";

  var seed = 0;
  for (var i = 0; i < AD.length; i++) seed = (seed * 31 + AD.charCodeAt(i)) & 0xffff;
  $("gateNo").textContent = "qapı " + (1 + (seed % 9)) + String.fromCharCode(65 + (seed % 6));

  function tick(){
    var d = new Date();
    var p = function(n){ return (n < 10 ? "0" : "") + n; };
    $("clock").textContent = p(d.getHours()) + ":" + p(d.getMinutes());
  }
  tick(); setInterval(tick, 20000);

  /* ---------- lövhəni qur ---------- */
  var ALPHABET = " ABCÇDEƏFGĞHXIİJKQLMNOÖPRSŞTUÜVYZ0123456789.,!?-";
  var COLS = 0;
  LINES.forEach(function(l){ if (l.length > COLS) COLS = l.length; });
  COLS = Math.max(8, Math.min(18, COLS));

  var rowsBox = $("rows");
  var rows = [];
  LINES.forEach(function(text, ri){
    var row = document.createElement("div");
    row.className = "row" + (ri === 1 ? " amber big" : "");
    var cells = [];
    /* mətni ortala */
    var pad = Math.max(0, Math.floor((COLS - text.length) / 2));
    var padded = new Array(pad + 1).join(" ") + text;
    while (padded.length < COLS) padded += " ";
    padded = padded.slice(0, COLS);

    for (var c = 0; c < COLS; c++){
      var cell = document.createElement("div");
      cell.className = "cell";
      cell.textContent = " ";
      row.appendChild(cell);
      cells.push({ el: cell, target: padded.charAt(c) });
    }
    rowsBox.appendChild(row);
    rows.push(cells);
  });

  function sizeCells(){
    var w = $("board").clientWidth - 24;      /* padding */
    var cw = Math.floor((w - (COLS - 1) * 2) / COLS);
    cw = Math.max(12, Math.min(34, cw));
    document.documentElement.style.setProperty("--cw", cw + "px");
  }
  sizeCells();
  addEventListener("resize", sizeCells);

  if (TEL && /^\d{7,15}$/.test(TEL)){
    $("reply").href = "https://wa.me/" + TEL;
  } else {
    $("reply").style.display = "none";
  }

  /* ---------- səs: tıqqıltı ---------- */
  var AC = null, master = null;
  function initAudio(){
    if (AC) return;
    try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return; }
    master = AC.createGain(); master.gain.value = .7; master.connect(AC.destination);
  }
  function clack(vol){
    if (!AC) return;
    var n = Math.floor(AC.sampleRate * .02);
    var b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var s = AC.createBufferSource(); s.buffer = b;
    var f = AC.createBiquadFilter(); f.type = "bandpass";
    f.frequency.value = 1700 + Math.random() * 900; f.Q.value = 2.2;
    var g = AC.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  }
  function chime(){
    if (!AC) return;
    [880, 1174.66].forEach(function(fr, i){
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = "sine"; o.frequency.value = fr;
      var t0 = AC.currentTime + i * .18;
      g.gain.setValueAtTime(.0001, t0);
      g.gain.linearRampToValueAtTime(.08, t0 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + .9);
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + .95);
    });
  }

  /* ---------- çevrilmə ---------- */
  var timers = [];
  function at(ms, fn){ timers.push(setTimeout(fn, ms)); }
  function stopAll(){ timers.forEach(clearTimeout); timers.length = 0; }

  function spin(cell, target, delay, done){
    if (reduce){ at(delay, function(){ cell.textContent = target; if (done) done(); }); return; }
    var steps = 6 + Math.floor(Math.random() * 10);
    for (var k = 0; k < steps; k++){
      (function(k){
        at(delay + k * 55, function(){
          cell.textContent = ALPHABET.charAt(Math.floor(Math.random() * ALPHABET.length));
          cell.classList.remove("flip"); void cell.offsetWidth; cell.classList.add("flip");
          if (Math.random() < .5) clack(.05);
        });
      })(k);
    }
    at(delay + steps * 55, function(){
      cell.textContent = target;
      cell.classList.remove("flip"); void cell.offsetWidth; cell.classList.add("flip");
      clack(.08);
      if (done) done();
    });
  }

  function run(){
    stopAll();
    $("panel").classList.remove("on");
    rows.forEach(function(cells){ cells.forEach(function(c){ c.el.textContent = " "; }); });

    var t = 250;
    var last = 0;
    rows.forEach(function(cells){
      cells.forEach(function(c, ci){
        var delay = t + ci * 70;
        spin(c.el, c.target, delay);
        if (delay > last) last = delay;
      });
      t += 700;
    });
    at(last + 900, function(){ chime(); $("panel").classList.add("on"); });
  }

  $("go").addEventListener("click", function(){
    initAudio();
    if (AC && AC.state === "suspended") AC.resume();
    $("gate").classList.add("off");
    sizeCells();
    run();
  });
  $("again").addEventListener("click", run);
})();
</script>
</body>
</html>
